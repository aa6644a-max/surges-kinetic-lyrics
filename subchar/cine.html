<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sub Character Film</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;600&family=Noto+Sans+KR:wght@300;500;700;900&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<style>*{margin:0}html,body{height:100%;background:#000;overflow:hidden}#cv{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:0 0}</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<script src="../shared/cine.js"></script>
<script src="../shared/figures.js"></script>
<script>
/* Sub character — one take through the film set of someone else's story.
   The camera is the extra: "you" stand in the gold spotlight at the centre, "my" words are pushed to the edges. */
const D=/*DATA*/null;
var SUB_BOX=1;   // engine parity with ashita (this song is Korean, so there is no translation line)
CINE.init(document.getElementById('cv'),D);
ACC='#9FB0CC';BEAT=60/123.5;B0=.205;
const GOLD='#FFB940',GOLD2='#FFE3A6',INK='#A4337A',ME='#AAB4C8',ME_G='#56637F',RED='#C8324F';
const TY=(w,f)=>`${w} ${f}px "Nanum Gothic Coding"`;
const L=i=>Ln[i];
const outOf=i=>Ln[i+1]?Math.min(Ln[i+1].s-.35,L(i).e+2.0):L(i).e+1.5;
STY.type=a=>({al:a>=-.02?1:0});                                                  // typewriter: no easing
STY.gravity=(a,it,o)=>{const q=Math.max(0,a-(o.hang??.5));return {al:clamp((a+.08)/.08)*(1-clamp(q/1.2)),s:Math.max(0,eBk(clamp((a+.08)/.25),2)),dy:900*q*q,rot:(R(it.n,5)-.5)*q*2.4}};
STY.breath=(a,it)=>{const q=Math.max(0,a-.35);return {al:clamp((a+.12)/.2)*(1-clamp(q/2.2)*.7),dy:(1-eOutC(clamp((a+.12)/.45)))*50-q*40,blur:q*3}};

// ---------- scenes: separate sets along one long studio; the camera whips between them ----------
const SCN=[
 {n:'slate',  t0:0,     cx:0,     z:[1.12,1.0], r:[0,0], L:[['p_slate',.3]]},
 {n:'hall',   t0:15.0,  cx:3000,  z:[1.0,1.12], r:[0,0], L:[['p_hall',.3]]},
 {n:'set',    t0:31.0,  cx:6000,  z:[1.22,.94], r:[.02,0], L:[['p_set',.3]]},       // pull back: it was a film set all along
 {n:'stage',  t0:47.9,  cx:9000,  z:[1.0,1.06], r:[0,0], L:[['p_stage',.3]]},
 {n:'film',   t0:70.1,  cx:12000, z:[1.0,1.08], r:[-.04,.04]},
 {n:'mirror', t0:82.2,  cx:15000, z:[1.08,1.0], r:[0,0], L:[['p_mirror',.3]]},
 {n:'curtain',t0:95.5,  cx:18000, z:[1.0,1.12], r:[0,0], L:[['p_curtain',.3]]},
 {n:'desk',   t0:114.95,cx:21000, z:[1.04,1.0], r:[0,0], L:[['p_desk',.3]]},
 {n:'split',  t0:137.4, cx:24000, z:[1.0,1.06], r:[0,0], L:[['p_split',.3]]},
 {n:'stage2', t0:156.5, cx:27000, z:[.98,1.1], r:[0,0], L:[['p_stage',.3]]},
 {n:'dark',   t0:178.9, cx:30000, z:[1.08,.96], r:[0,0], L:[['p_apart',.3],['p_hands',.3,{from:'meet'}]]},
 {n:'end',    t0:206.2, cx:33000, z:[1,1],     r:[0,0]}];
const K=[];SCN.forEach((s,k)=>{s.cy=0;s.t1=SCN[k+1]?SCN[k+1].t0:D.dur+1;s.L=s.L||[];
  K.push([s.t0,s.cx-300,0,s.z[0],s.r[0]]);K.push([Math.max(s.t0+.5,s.t1-.5),s.cx+300,0,s.z[1],s.r[1],eIOs])});
function cam(t){const c=camAt(K,t);return {x:c[1],y:c[2],z:c[3],r:c[4]}}
const SN=n=>SCN.find(s=>s.n===n);
function inSet(s,pf,fn){layer(pf,()=>{g.translate(s.cx*pf,s.cy*pf);fn()})}
function bgRect(c0,c1){const gr=g.createLinearGradient(0,-1400,0,1400);gr.addColorStop(0,c0);gr.addColorStop(1,c1);g.fillStyle=gr;g.fillRect(-1300,-1400,2600,2800)}
function spot(x,top,floor,w0,w1,col,a){if(a<=0)return;g.save();g.globalCompositeOperation='lighter';
  const lg=g.createLinearGradient(0,top,0,floor);lg.addColorStop(0,rgba(col,.32*a));lg.addColorStop(1,rgba(col,.07*a));g.fillStyle=lg;
  g.beginPath();g.moveTo(x-w0/2,top);g.lineTo(x+w0/2,top);g.lineTo(x+w1/2,floor);g.lineTo(x-w1/2,floor);g.closePath();g.fill();
  const eg=g.createRadialGradient(x,floor,0,x,floor,w1*.62);eg.addColorStop(0,rgba(col,.5*a));eg.addColorStop(1,rgba(col,0));
  g.translate(x,floor);g.scale(1,.2);g.fillStyle=eg;g.beginPath();g.arc(0,0,w1*.62,0,7);g.fill();g.restore()}
function beamA(x,y,ang,len,w,col,a){if(a<=0)return;g.save();g.globalCompositeOperation='lighter';g.translate(x,y);g.rotate(ang);
  const lg=g.createLinearGradient(0,0,0,len);lg.addColorStop(0,rgba(col,.3*a));lg.addColorStop(1,rgba(col,0));g.fillStyle=lg;g.beginPath();g.moveTo(-14,0);g.lineTo(14,0);g.lineTo(w/2,len);g.lineTo(-w/2,len);g.closePath();g.fill();g.restore()}
function fig(x,y,s,who,pose,o={}){g.save();if(o.glow){g.shadowColor=o.gcol||GOLD;g.shadowBlur=o.glow}g.globalAlpha=o.a??1;figure(x,y,s,pose,{who,col:o.col||'#07080F',t:o.t||0,flip:o.flip,wind:.2,scarf:o.scarf||'#2E3647'});g.restore()}
const YOU='boy',ME_W='girl';   // original silhouettes: "you" (hoodie) and "me" (long hair)
function floorLine(y,col){g.fillStyle=col;g.fillRect(-1300,y,2600,1400-y)}

// crowd in front of the stage; on the chorus they clap on the beat
function crowd(t,s,hype){inSet(s,1.3,()=>{for(let k=0;k<17;k++){const x=-1600+k*200+R(k,3)*70,b=Math.abs(Math.sin(((t-B0)/BEAT)*Math.PI+k*.7))*hype*16,y=1060-b+R(k,4)*40;
  g.fillStyle='#030306';g.beginPath();g.ellipse(x,y+100,112,84,0,0,7);g.fill();g.beginPath();g.arc(x,y-24,48,0,7);g.fill();
  if(hype>0&&R(k,5)>.45){g.strokeStyle='#030306';g.lineWidth=22;g.lineCap='round';const up=b*2;g.beginPath();g.moveTo(x-60,y+40);g.lineTo(x-40,y-120-up);g.moveTo(x+60,y+40);g.lineTo(x+40,y-120-up);g.stroke()}}})}

// ---------- code-drawn sets (fallback until the painted plates exist) ----------
const SETS={
 slate(t,s){inSet(s,1,()=>{bgRect('#06070B','#0C0E15');floorLine(700,'#0A0B10');const on=t>3.4?(t<3.6?(R(1,Math.floor(t*40))>.5?1:.3):1):0;
   spot(0,-1300,700,80,560,GOLD,on);if(on)fig(0,700,1.05,YOU,'stand',{glow:44,gcol:GOLD,col:'#0B0805'});
   const na=clamp((t-9)/1.5);if(na>0)fig(-420,760,.95,ME_W,'stand',{col:'#0C0F17',glow:8,gcol:ME_G,a:na,t})})},
 hall(t,s){inSet(s,1,()=>{bgRect('#090C14','#131927');const vx=0,vy=-60;
   g.fillStyle='#0C1019';g.beginPath();g.moveTo(-1300,1400);g.lineTo(1300,1400);g.lineTo(vx+110,vy+120);g.lineTo(vx-110,vy+120);g.fill();
   g.strokeStyle='rgba(120,140,180,.14)';g.lineWidth=2;for(let k=-6;k<=6;k++){g.beginPath();g.moveTo(vx+k*18,vy+120);g.lineTo(k*260,1400);g.stroke()}
   for(let k=0;k<7;k++){const d=.18+k*.13,y=vy+120+(1400-vy-120)*d*d;g.beginPath();g.moveTo(-1300*d*d-110,y);g.lineTo(1300*d*d+110,y);g.stroke()}
   for(let k=0;k<5;k++){const d=.25+k*.17,x0=-110-1100*d*d,w=90+300*d*d,y0=vy-40-420*d*d,h=160+700*d*d;g.fillStyle=`rgba(90,120,170,${.10+.06*k})`;g.fillRect(x0-w,y0,w,h)}
   const gl=g.createRadialGradient(vx,vy+60,10,vx,vy+60,460);gl.addColorStop(0,rgba(GOLD,.55));gl.addColorStop(1,rgba(GOLD,0));g.fillStyle=gl;g.fillRect(-500,-560,1000,1000);
   fig(vx,vy+120,.32,YOU,'stand',{glow:26,gcol:GOLD,col:'#140E06'})});
   inSet(s,1.15,()=>fig(-250,1200,2.3,ME_W,'stand',{col:'#04050A',t}))},
 set(t,s){inSet(s,1,()=>{bgRect('#07080D','#10121A');g.fillStyle='#131621';g.fillRect(-900,-900,1800,1600);g.strokeStyle='rgba(160,170,200,.18)';g.lineWidth=4;g.strokeRect(-900,-900,1800,1600);
   floorLine(700,'#0B0D13');g.strokeStyle='rgba(20,22,30,1)';g.lineWidth=10;g.beginPath();g.moveTo(-600,-1200);g.lineTo(-40,-700);g.stroke();g.fillStyle='#1B1E28';g.fillRect(-90,-740,110,60);   // boom mic
   for(const sd of [-1,1]){const x=sd*640;g.strokeStyle='#161923';g.lineWidth=12;g.beginPath();g.moveTo(x,700);g.lineTo(x,-260);g.moveTo(x,700);g.lineTo(x-70,760);g.moveTo(x,700);g.lineTo(x+70,760);g.stroke();
     g.save();g.translate(x,-280);g.rotate(sd*.5);g.fillStyle='#1E2230';g.fillRect(-60,-50,120,100);g.restore();beamA(x,-280,sd*.9,1200,520,'#DDE6FF',.5)}
   spot(0,-1300,700,80,540,GOLD,1);fig(0,700,1.0,YOU,'stand',{glow:44,gcol:GOLD,col:'#0B0805'});
   const hl=clamp((t-T(11,5)+.2)/.3)*(1-P(t,outOf(11),.6));
   [[-470,.62],[-300,.66,1],[-170,.6],[230,.62],[360,.6],[500,.64]].forEach(([x,sc,me],k)=>fig(x,720,sc,me?ME_W:(k%2?YOU:ME_W),'stand',{col:me?mix('#1A1F2B','#39435A',hl):'#171B26',glow:me?30*hl:0,gcol:ME,t}))});
   inSet(s,1.25,()=>{const x=430,y=1000;g.strokeStyle='#05060A';g.lineWidth=16;g.beginPath();g.moveTo(x,y-220);g.lineTo(x-140,y+200);g.moveTo(x,y-220);g.lineTo(x+140,y+200);g.moveTo(x,y-220);g.lineTo(x,y+220);g.stroke();
     g.fillStyle='#05060A';g.fillRect(x-150,y-380,260,160);g.beginPath();g.arc(x-190,y-300,70,0,7);g.fill();g.beginPath();g.arc(x-40,y-440,60,0,7);g.arc(x+60,y-440,60,0,7);g.fill();
     if(Math.floor(t*2)%2){g.fillStyle='#FF3040';g.shadowColor='#FF3040';g.shadowBlur=20;g.beginPath();g.arc(x+80,y-350,9,0,7);g.fill();g.shadowBlur=0}})},
 stage(t,s,big){inSet(s,1,()=>{bgRect(big?'#0B0714':'#0A0710',big?'#1A1024':'#150F1C');
   g.fillStyle='#1E0A12';for(let k=0;k<14;k++){g.beginPath();g.ellipse(-1300+k*200,-900,110,60,0,0,Math.PI);g.fill()}g.fillRect(-1300,-1400,2600,500);
   floorLine(700,'#0E0B12');const ch=chorus(t);spot(0,-1300,700,90,600,GOLD,.8+.2*ch+.25*pulse(t)*ch);
   for(let k=0;k<(big?4:2);k++){const sd=k%2?1:-1,x=sd*(700+160*Math.floor(k/2)),ang=sd*(.35+.25*Math.sin(t*1.1+k));beamA(x,-1100,ang,2200,480,k%3?'#9FC4FF':'#FF8FC8',.55*ch)}
   fig(0,700,1.05,YOU,big&&ch>.5&&T(62,8)<t&&t<outOf(62)?'shout':'stand',{glow:50+20*pulse(t)*ch,gcol:GOLD,col:'#0B0805',t});
   fig(-470,760,.9,ME_W,'stand',{col:'#0B0E16',glow:6,gcol:ME_G,t})});crowd(t,s,chorus(t))},
 film(t,s){inSet(s,1,()=>bgRect('#050507','#0A0A0E'))},
 mirror(t,s){inSet(s,1,()=>{bgRect('#0D0A09','#17110E');g.fillStyle='#1C1511';g.fillRect(-1300,640,2600,800);
   const mx=-300,my=-560,mw=600,mh=820;g.fillStyle='#262019';g.fillRect(mx-40,my-40,mw+80,mh+80);const mg=g.createLinearGradient(0,my,0,my+mh);mg.addColorStop(0,'#141925');mg.addColorStop(1,'#0B0E15');g.fillStyle=mg;g.fillRect(mx,my,mw,mh);
   const pt=eIO(clamp((t-T(31,0)+.3)/.5))*(1-eIO(P(t,outOf(32),.6)));const pose=lerpPose(POSES.stand,POSES.reach,pt);
   g.save();g.beginPath();g.rect(mx,my,mw,mh);g.clip();fig(0,230,.95,ME_W,pose,{col:'#1C2231',glow:14,gcol:ME_G,flip:true,t});g.restore();
   for(let k=0;k<30;k++){const q=k/30,per=2*(mw+mh)+320;let d=q*per,x,y;const W0=mw+80,H0=mh+80;if(d<W0){x=mx-40+d;y=my-40}else if(d<W0+H0){x=mx+mw+40;y=my-40+d-W0}else if(d<2*W0+H0){x=mx+mw+40-(d-W0-H0);y=my+mh+40}else{x=mx-40;y=my+mh+40-(d-2*W0-H0)}
     const on=R(k,12)>.2?(k===7?(R(k,Math.floor(t*12))>.4?1:.2):1):0;g.fillStyle=on?'#FFE8C2':'#3A332B';g.shadowColor='#FFC680';g.shadowBlur=on?24:0;g.beginPath();g.arc(x,y,13,0,7);g.fill()}g.shadowBlur=0});
   inSet(s,1.12,()=>{const pt=eIO(clamp((t-T(31,0)+.3)/.5))*(1-eIO(P(t,outOf(32),.6)));fig(60,1280,2.2,ME_W,lerpPose(POSES.stand,POSES.reach,pt),{col:'#040405',t})})},
 curtain(t,s){inSet(s,1,()=>{bgRect('#07060A','#0E0A0E');const gl=g.createRadialGradient(0,320,20,0,320,560);gl.addColorStop(0,rgba(GOLD,.3));gl.addColorStop(1,rgba(GOLD,0));g.fillStyle=gl;g.fillRect(-600,-300,1200,1200);
   floorLine(650,'#0C090C');g.fillStyle='#17110C';g.fillRect(-80,560,160,95);
   const sit={...POSES.sit,head:.5,lean:.25,lArm:[.9,1.2],rArm:[-.6,1.4]};fig(0,565,.85,YOU,sit,{glow:22,gcol:GOLD,col:'#0D0906',t});
   fig(360,860,1.25,ME_W,{...POSES.stand,lean:-.1,head:-.1},{col:'#07070C',t});
   for(const sd of [-1,1]){const x0=sd<0?-1300:180,x1=sd<0?-180:1300,n=9;for(let k=0;k<n;k++){const x=x0+(x1-x0)*k/n,w=(x1-x0)/n;const cg=g.createLinearGradient(x,0,x+w,0);cg.addColorStop(0,'#1A0911');cg.addColorStop(.5,'#34111F');cg.addColorStop(1,'#12060C');g.fillStyle=cg;g.fillRect(x,-1400,w+1,2800)}}})},
 desk(t,s){inSet(s,1,()=>{bgRect('#0D0A07','#19130D');const gl=g.createRadialGradient(0,260,40,0,260,900);gl.addColorStop(0,'rgba(255,200,130,.26)');gl.addColorStop(1,'rgba(255,200,130,0)');g.fillStyle=gl;g.fillRect(-1100,-700,2200,1900);
   for(let k=0;k<6;k++){g.save();g.translate(-700+k*300+R(k,2)*80,-600+R(k,3)*1500);g.rotate((R(k,4)-.5)*.8);g.fillStyle='rgba(233,226,210,.07)';g.fillRect(-180,-240,360,480);g.restore()}
   g.save();g.translate(620,-520);g.rotate(.7);g.fillStyle='#C9A24A';g.fillRect(-12,-260,24,440);g.fillStyle='#E6A3AE';g.fillRect(-12,-300,24,40);g.restore()})},
 split(t,s){inSet(s,1,()=>{const lg=g.createLinearGradient(0,-1400,0,1400);lg.addColorStop(0,'#2A1E0C');lg.addColorStop(1,'#0F0A05');g.fillStyle=lg;g.fillRect(-1300,-1400,1300,2800);
   const rg=g.createLinearGradient(0,-1400,0,1400);rg.addColorStop(0,'#0C0F17');rg.addColorStop(1,'#06080D');g.fillStyle=rg;g.fillRect(0,-1400,1300,2800);
   spot(-270,-1300,700,80,500,GOLD,1);fig(-270,700,1.0,YOU,'stand',{glow:44,gcol:GOLD,col:'#0B0805'});fig(270,700,1.0,ME_W,'stand',{col:'#0A0C12',glow:6,gcol:ME_G,t});
   g.fillStyle='rgba(235,240,250,.5)';g.fillRect(-2,-1400,4,2800)})},
 stage2(t,s){SETS.stage(t,s,1)},
 dark(t,s){inSet(s,1,()=>{bgRect('#030304','#060609');floorLine(700,'#050507');darkScene(t)})},
 end(t,s){inSet(s,1,()=>bgRect('#020203','#040406'))}};

// the lights go out one by one; only yours stays. Then mine comes back, I reach, you turn and take my hand.
const OFF=[[-460,180.6],[0,184.6],[460,188.5],[-230,191.1]];
function darkScene(t){for(const [x,off] of OFF){let a=t<off-.35?1:t<off?(R(x,Math.floor(t*30))>.5?1:.15):0;if(x===-230&&t>=T(77,0)-.1)a=clamp((t-T(77,0)+.1)/.15);spot(x,-1300,700,70,380,x===-230&&t>=off?'#DDE6FF':'#C9D2E6',a*.7)}
  const meet=T(80,5),walk=eIO(clamp((t-T(80,2))/(meet-T(80,2)))),join=eIO(clamp((t-meet)/1.2));
  spot(230-100*walk,-1300,700,80,lerp(480,1250,join),GOLD,1);
  const reach=eIO(clamp((t-T(79,0))/1.2))*.55+eIO(clamp((t-T(80,2))/.6))*.45,turn=eIO(clamp((t-T(80,0))/.8));
  fig(-230+100*walk,700,1.0,ME_W,lerpPose(POSES.stand,POSES.reach,reach),{col:'#0B0D13',glow:lerp(8,40,join),gcol:join>.3?GOLD:ME,scarf:mix('#2E3647',GOLD,join),t});
  fig(230-100*walk,700,1.0,YOU,lerpPose({...POSES.stand,head:.35,lean:.08},POSES.reach,turn),{glow:44,gcol:GOLD,col:'#0B0805',flip:turn>.5,t});
  const f=clamp((t-meet+.1)/.2)*(1-clamp((t-meet-1.5)/1.5));if(f>0)flare(0,700-230,10+14*f,rgba(GOLD,.9),f,1.4)}
function chorus(t){let c=0;for(const [a,b] of [[48.2,70.1],[114.95,131.2],[156.5,178.7]])c=Math.max(c,clamp((t-a)/.6)*(1-clamp((t-b)/.8)));return c}

// ---------- painted plates (step 7): a scene whose plates all load replaces its code set ----------
const PL={img:{},off:/noplates/.test(location.search)};
const PIDS=[...new Set(SCN.flatMap(s=>s.L.map(l=>l[0])))];
const has=id=>!!PL.img[id];
const art=s=>!PL.off&&s.L.length&&s.L.every(l=>has(l[0]));
function plate(id,pf,o,s,t){const im=PL.img[id];if(!im)return;const S=Math.max(W/im.width,H/im.height)*1.12*(1+(CAM.z-1)*pf*.7),iw=im.width*S,ih=im.height*S;
  const ox=-(CAM.x-s.cx)*pf*.3,oy=-(CAM.y-s.cy)*pf*.3;g.save();g.globalAlpha=o.a??1;g.translate(CX,CY);g.rotate(CAM.r*pf);g.drawImage(im,ox-iw/2,oy-ih/2,iw,ih);g.restore()}
function loadPlates(){if(PL.off)return Promise.resolve();return Promise.all(PIDS.map(id=>new Promise(r=>{const im=new Image();im.onload=()=>{PL.img[id]=im;r()};im.onerror=()=>r();im.src='plates/'+id+'.webp'})))}
// code overlays on top of the painted plates: chorus beams, the lights-out ending
const OVER={stage(t,s,big){const ch=chorus(t);inSet(s,1,()=>{for(let k=0;k<(big?4:2);k++){const sd=k%2?1:-1,x=sd*(700+160*Math.floor(k/2)),ang=sd*(.35+.25*Math.sin(t*1.1+k));beamA(x,-1100,ang,2200,480,k%3?'#9FC4FF':'#FF8FC8',.5*ch)}
    const gl=g.createRadialGradient(40,300,20,40,300,700);gl.addColorStop(0,rgba(GOLD,.14*ch*pulse(t)));gl.addColorStop(1,rgba(GOLD,0));g.fillStyle=gl;g.fillRect(-700,-400,1500,1400)})},
  stage2(t,s){OVER.stage(t,s,1)},dark(t,s){inSet(s,1,()=>{for(const [x,off] of OFF){if(x===-230)continue;const a=t<off-.35?1:t<off?(R(x,Math.floor(t*30))>.5?1:.15):0;spot(x,-1300,700,70,380,'#C9D2E6',a*.55)}   // the painted pair; the other lights still go out

  for(let k=0;k<3;k++){const y=CY-600+k*600,dir=k%2?1:-1,sp=240+90*k,fw=400,off=((t*sp*dir)%fw+fw)%fw;g.fillStyle='#0A0A0D';g.fillRect(0,y-170,W,340);g.fillStyle='#1E1E25';
    for(let n=-1;n<30;n++){const sx=n*48+off%48;g.fillRect(sx,y-158,26,18);g.fillRect(sx,y+140,26,18)}
    for(let n=-1;n<4;n++){const fx=n*fw+off,idx=Math.floor((t*sp*dir-fx)/fw)+n*7+k*13;g.fillStyle='#12131A';g.fillRect(fx+10,y-125,fw-20,250);g.save();g.beginPath();g.rect(fx+10,y-125,fw-20,250);g.clip();
      const me=((idx%5)+5)%5===2,im=PL.img[me?'p_hall':'p_stage'];if(im){const sw=im.width*(me?.55:.36),sh=sw*250/(fw-20),sx=me?0:im.width*.4,sy=im.height*(me?.28:.52);g.drawImage(im,sx,sy,sw,sh,fx+10,y-125,fw-20,250);if(me){g.fillStyle='rgba(20,30,50,.35)';g.fillRect(fx+10,y-125,fw-20,250)}}
      else if(me){g.fillStyle='#161923';g.fillRect(fx+10,y-125,fw-20,250);fig(fx+fw-60,y+120,.5,ME_W,'stand',{col:'#2A3140',t})}
      else{const gl=g.createRadialGradient(fx+fw/2,y,5,fx+fw/2,y,160);gl.addColorStop(0,rgba(GOLD,.5));gl.addColorStop(1,rgba(GOLD,0));g.fillStyle=gl;g.fillRect(fx,y-130,fw,260);fig(fx+fw/2,y+110,.55,YOU,((idx%3)+3)%3?'stand':'shout',{glow:20,gcol:GOLD,col:'#140E06',t})}
      g.restore()}}
  for(let k=0;k<ECHO.length;k++){const t0=75.2+k*1.2,e=t-t0;if(e<0||e>1.2)continue;const q=e/1.2,sc=.15+5*eInC(q);g.save();g.translate(CX,CY-100);g.scale(sc,sc);g.globalAlpha=Math.sin(q*Math.PI)*.45;g.font=k===1||k===4?EN(600,200):KR(900,200);g.textAlign='center';g.textBaseline='middle';g.lineWidth=4;g.strokeStyle=k%2?GOLD:ME;g.strokeText(ECHO[k],0,0);g.restore()}
  const fl=pulse(t)*.08;if(fl>0){g.fillStyle=`rgba(255,240,220,${fl})`;g.fillRect(0,0,W,H)}g.restore()}

  ROLL.forEach(([r,n],k)=>{const y=H+80+k*110-(t-179.4)*95;if(y<-60||y>H+60)return;const me=n==='나';g.globalAlpha=a*(me?.55:.22);g.font=me?KR(700,40):KR(300,38);g.fillStyle=me?'#DDE3EE':ME;g.textAlign='right';g.fillText(r,CX-40,y);g.textAlign='left';g.fillText(n,CX+40,y)});g.restore()}
function endCard(t){const a=clamp((t-206.6)/1.2)*(1-clamp((t-212.6)/1.4));if(a<=0)return;g.save();g.globalAlpha=a;g.textAlign='center';g.textBaseline='middle';
  g.font=EN(600,104);g.letterSpacing='8px';g.fillStyle='#F4F1EA';g.shadowColor=GOLD;g.shadowBlur=30;g.fillText('Sub character',CX+4,CY-120);g.shadowBlur=0;

function bursts(t){for(const [tt,big2] of [[T(19,8),1],[T(22,0),.8],[T(62,8),1.3],[T(65,0),1.1],[T(81,1),1]]){const a=t-tt;if(a<0||a>1.6)continue;g.save();g.globalCompositeOperation='lighter';

const BOOST=t=>eIOs(P(t,156.5,1.5))*(1-eIOs(P(t,172.8,1.5)));
function warp(t,B){if(B<=0)return;g.save();g.globalCompositeOperation='lighter';for(let k=0;k<80;k++){const an=R(k,90)*6.28,ph=(t*(1.1+1.6*B)+R(k,91))%1,r0=140+ph*1400,r1=r0+(100+600*B)*ph;

function grade(t){const cold=eIO(P(t,T(9,3)-.1,.8))*(1-P(t,31,2)),warm=clamp((t-15)/2)*(1-cold)*(1-P(t,31,2));
  if(warm>0){g.fillStyle=`rgba(255,170,80,${.06*warm})`;g.fillRect(0,0,W,H)}if(cold>0){g.save();g.globalCompositeOperation='multiply';g.fillStyle=`rgba(${Math.round(lerp(255,120,cold))},${Math.round(lerp(255,150,cold))},255,1)`;g.fillRect(0,0,W,H);g.restore()}}

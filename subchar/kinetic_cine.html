    for(let n=-1;n<30;n++){const sx=n*48+off%48;g.fillRect(sx,y-158,26,18);g.fillRect(sx,y+140,26,18)}
    for(let n=-1;n<4;n++){const fx=n*fw+off,idx=Math.floor((t*sp*dir-fx)/fw)+n*7+k*13;g.fillStyle='#12131A';g.fillRect(fx+10,y-125,fw-20,250);g.save();g.beginPath();g.rect(fx+10,y-125,fw-20,250);g.clip();
      const me=((idx%5)+5)%5===2,im=PL.img[me?'p_hall':'p_stage'];if(im){const sw=im.width*(me?.55:.36),sh=sw*250/(fw-20),sx=me?0:im.width*.4,sy=im.height*(me?.28:.52);g.drawImage(im,sx,sy,sw,sh,fx+10,y-125,fw-20,250);if(me){g.fillStyle='rgba(20,30,50,.35)';g.fillRect(fx+10,y-125,fw-20,250)}}
      else if(me){g.fillStyle='#161923';g.fillRect(fx+10,y-125,fw-20,250);fig(fx+fw-60,y+120,.5,ME_W,'stand',{col:'#2A3140',t})}
      else{const gl=g.createRadialGradient(fx+fw/2,y,5,fx+fw/2,y,160);gl.addColorStop(0,rgba(GOLD,.5));gl.addColorStop(1,rgba(GOLD,0));g.fillStyle=gl;g.fillRect(fx,y-130,fw,260);fig(fx+fw/2,y+110,.55,YOU,((idx%3)+3)%3?'stand':'shout',{glow:20,gcol:GOLD,col:'#140E06',t})}
      g.restore()}}
  for(let k=0;k<ECHO.length;k++){const t0=75.2+k*1.2,e=t-t0;if(e<0||e>1.2)continue;const q=e/1.2,sc=.15+5*eInC(q);g.save();g.translate(CX,CY-100);g.scale(sc,sc);g.globalAlpha=Math.sin(q*Math.PI)*.45;g.font=k===1||k===4?EN(600,200):KR(900,200);g.textAlign='center';g.textBaseline='middle';g.lineWidth=4;g.strokeStyle=k%2?GOLD:ME;g.strokeText(ECHO[k],0,0);g.restore()}
  const fl=pulse(t)*.08;if(fl>0){g.fillStyle=`rgba(255,240,220,${fl})`;g.fillRect(0,0,W,H)}g.restore()}
const ROLL=[['주인공','너'],['',''],['친구 1','—'],['친구 2','—'],['행인','—'],['EXTRA #1','—'],['EXTRA #2','—'],['EXTRA #3','—'],['EXTRA #4','—'],['EXTRA #5','—'],['EXTRA #6','—'],['EXTRA #7','나'],['EXTRA #8','—'],['EXTRA #9','—']];
function creditsRoll(t){const a=clamp((t-179.4)/1)*(1-clamp((t-196.5)/1.2));if(a<=0)return;g.save();g.textBaseline='middle';
  ROLL.forEach(([r,n],k)=>{const y=H+80+k*110-(t-179.4)*95;if(y<-60||y>H+60)return;const me=n==='나';g.globalAlpha=a*(me?.55:.22);g.font=me?KR(700,40):KR(300,38);g.fillStyle=me?'#DDE3EE':ME;g.textAlign='right';g.fillText(r,CX-40,y);g.textAlign='left';g.fillText(n,CX+40,y)});g.restore()}
function endCard(t){const a=clamp((t-206.6)/1.2)*(1-clamp((t-212.6)/1.4));if(a<=0)return;g.save();g.globalAlpha=a;g.textAlign='center';g.textBaseline='middle';
  g.font=EN(600,104);g.letterSpacing='8px';g.fillStyle='#F4F1EA';g.shadowColor=GOLD;g.shadowBlur=30;g.fillText('Sub character',CX+4,CY-120);g.shadowBlur=0;
  g.font=KR(300,40);g.letterSpacing='12px';g.fillStyle=ME;g.fillText('윤하  ·  YOUNHA',CX+6,CY);g.font=EN(300,26);g.letterSpacing='16px';g.fillStyle=rgba(ME,.7);g.fillText('CAST',CX+8,CY+130);
  g.font=KR(500,36);g.letterSpacing='10px';g.fillStyle=GOLD2;g.fillText('너  ·  나',CX+5,CY+190);g.restore()}
function bursts(t){for(const [tt,big2] of [[T(19,8),1],[T(22,0),.8],[T(62,8),1.3],[T(65,0),1.1],[T(81,1),1]]){const a=t-tt;if(a<0||a>1.6)continue;g.save();g.globalCompositeOperation='lighter';
  for(let r=0;r<3;r++)ring(CX,CY-80,clamp((a-r*.12)/1.1),1200*big2,14-r*4,r===1?GOLD:'#FFFFFF');g.restore();if(a<.2){g.fillStyle=`rgba(255,240,210,${.25*big2*(1-a/.2)})`;g.fillRect(0,0,W,H)}}}
const BOOST=t=>eIOs(P(t,156.5,1.5))*(1-eIOs(P(t,172.8,1.5)));
function warp(t,B){if(B<=0)return;g.save();g.globalCompositeOperation='lighter';for(let k=0;k<80;k++){const an=R(k,90)*6.28,ph=(t*(1.1+1.6*B)+R(k,91))%1,r0=140+ph*1400,r1=r0+(100+600*B)*ph;
  g.strokeStyle=`rgba(${k%4?'200,215,255':'255,205,140'},${B*ph*.6})`;g.lineWidth=1+3*ph*B;g.beginPath();g.moveTo(CX+Math.cos(an)*r0,CY+Math.sin(an)*r0*1.2);g.lineTo(CX+Math.cos(an)*r1,CY+Math.sin(an)*r1*1.2);g.stroke()}g.restore()}
// colour temperature: the corridor is warm until "식어 가" drains it cold
function grade(t){const cold=eIO(P(t,T(9,3)-.1,.8))*(1-P(t,31,2)),warm=clamp((t-15)/2)*(1-cold)*(1-P(t,31,2));
  if(warm>0){g.fillStyle=`rgba(255,170,80,${.06*warm})`;g.fillRect(0,0,W,H)}if(cold>0){g.save();g.globalCompositeOperation='multiply';g.fillStyle=`rgba(${Math.round(lerp(255,120,cold))},${Math.round(lerp(255,150,cold))},255,1)`;g.fillRect(0,0,W,H);g.restore()}}

// ---------- frame ----------
function lyrics(t){for(let i=0;i<Ln.length;i++){if(t<L(i).s-.6||t>outOf(i)+.6)continue;if(CREDIT[i])credit(t,i);else if(i===42)erase(t);else if(i===46)montage(t);else if(i===47||i===51)continue;else block(t,i)}}
function render(t){CINE.begin();const c=cam(t),B=BOOST(t),ch=chorus(t);CAM={x:c.x,y:c.y,z:c.z*(1+(.006+.018*ch+.02*B)*pulse(t)),r:c.r+B*.02*Math.sin(t*2.1)};
  shake(t,3,6);if(Ln[59]){const a=t-T(59,3)-.55;if(a>0&&a<.4)shake(t,30*(1-a/.4))}
  g.fillStyle='#000';g.fillRect(0,0,W,H);sets(t);filmFx(t);creditsRoll(t);warp(t,B);bursts(t);
  slate(t);title(t);page(t);lyrics(t);endCard(t);
  layer(1.6,()=>dust(t,.6));grade(t);post(t,{bloom:.5,vig:.6});
  const fi=clamp(t/.4);if(fi<1){g.fillStyle=`rgba(0,0,0,${1-fi})`;g.fillRect(0,0,W,H)}const fo=P(t,D.dur-1.8,1.6);if(fo>0){g.fillStyle=`rgba(0,0,0,${fo})`;g.fillRect(0,0,W,H)}}
window.DUR=D.dur;
window.READY=(async()=>{await loadPlates();const ko=Ln.map(l=>l.t).join('')+'나너주인공조연배역대사없음이름씬·윤하친구행인';
  try{await Promise.all([300,500,700,900].map(w=>document.fonts.load(KR(w,100),ko)).concat([document.fonts.load(EN(300,60),'ABCDEFGHIJKLMNOPQRSTUVWXYZ#07'),document.fonts.load(EN(600,60),"Sub character I'm a sub Just another loser montage"),document.fonts.load(TY(400,40),ko+'SCENE FINAL DRAFT'),document.fonts.load(TY(700,40),ko+'Tell me')]))}catch(e){}
  window.renderAt=render;render(0)})();

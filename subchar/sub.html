<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sub Character Subculture</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;600&family=Black+Han+Sans&family=Dela+Gothic+One&family=Noto+Sans+KR:wght@300;500;700;900&display=swap" rel="stylesheet">
<style>*{margin:0}html,body{height:100%;background:#000;overflow:hidden}#cv{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:0 0}</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<script src="../shared/cine.js"></script>
<script>
/* Sub character — subculture sketch (0:00-0:32): anime cel art, screentone, focus lines, game-UI tags, sticker type.
   Same transition engine as trans.html. No slide cuts: every scene is reached by an expand, a morph,
   a push into a card, a tilt, a liquid wipe, following an object, an ink burst or a flood of light.
   Characters are flat silhouettes generated with Codex and tinted here. */
const D=/*DATA*/null;
CINE.init(document.getElementById('cv'),D);const MAIN=g;
BEAT=60/123.5;B0=.205;const L=i=>Ln[i],bt=n=>B0+n*BEAT,since=(t,a,d)=>clamp((t-a)/d);
const C={hot:'#FF4F9A',cyan:'#3FE3FF',sky:'#9FD8FF',navy:'#16143A',yel:'#FFE45C',peach:'#FFB86B',peri:'#6C5CFF',pink:'#FF7AA8',mint:'#35E0C6',night:'#241B55',deep:'#140F33',cream:'#FFF4E6',ink:'#121016',ice:'#CFE6FF',lilac:'#B9A8FF'};
const HV=f=>`${f}px "Black Han Sans"`,DG=f=>`${f}px "Dela Gothic One"`,JO=(w,f)=>`${w} ${f}px "Josefin Sans"`;   // KR comes from cine.js
const lg=(y0,y1,a,b)=>{const q=g.createLinearGradient(0,y0,0,y1);q.addColorStop(0,a);q.addColorStop(1,b);return q};
const bgGrad=(a,b)=>{g.fillStyle=lg(0,H,a,b);g.fillRect(0,0,W,H)};
function circ(x,y,r,f){if(r<=0)return;g.fillStyle=f;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function rrect(x,y,w,h,r){g.beginPath();g.roundRect(x-w/2,y-h/2,w,h,Math.max(0,Math.min(r,w/2,h/2)))}

// ---------- silhouettes: black-on-white PNGs turned into masks, tinted with a gradient ----------
const SIL={},SILN=['boy_back','girl_profile','legs_walk','hand_reach'],TINT={};
function sil(id,x,y,h,c0,c1,o={}){const im=SIL[id];const w=im?im.width*h/im.height:h*.45;const key=id+c0+c1;
  if(!im){g.fillStyle=c0;g.beginPath();g.ellipse(x,y,w/2,h/2,0,0,7);g.fill();return}
  if(!TINT[key]){const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;const x2=cv.getContext('2d');x2.drawImage(im,0,0);x2.globalCompositeOperation='source-in';
    const q=x2.createLinearGradient(0,0,0,im.height);q.addColorStop(0,c0);q.addColorStop(1,c1);x2.fillStyle=q;x2.fillRect(0,0,im.width,im.height);TINT[key]=cv}
  g.save();g.globalAlpha=o.a??1;g.translate(x,y);if(o.rot)g.rotate(o.rot);if(o.flip)g.scale(-1,1);g.drawImage(TINT[key],-w/2,-h/2,w,h);g.restore()}

// ---------- anime character art (Codex, keyed); falls back to the tinted silhouettes ----------
const ART={},ARTN=['me_profile','you_back','me_legs','me_hand','me_back'],ALT={me_profile:'girl_profile',you_back:'boy_back',me_legs:'legs_walk',me_hand:'hand_reach',me_back:'girl_profile'};
function art(id,x,y,h,o={}){const im=ART[id];if(!im){sil(ALT[id],x,y,h,o.c0||'#2A1F66',o.c1||'#1A1245',o);return}const w=im.width*h/im.height;
  g.save();g.globalAlpha=o.a??1;g.translate(x,y);if(o.rot)g.rotate(o.rot);if(o.flip)g.scale(-1,1);
  if(o.rim){g.shadowColor=o.rim;g.shadowBlur=0;for(const [dx,dy] of [[8,0],[-8,0],[0,8],[0,-8]]){g.shadowOffsetX=dx;g.shadowOffsetY=dy;g.drawImage(im,-w/2,-h/2,w,h)}g.shadowColor='transparent'}   // sticker outline
  g.drawImage(im,-w/2,-h/2,w,h);g.restore()}
// ---------- subculture graphic language ----------
function tone(x0,y0,w,h,col,dir=1,st=26){g.save();g.fillStyle=col;for(let y=y0;y<y0+h;y+=st)for(let x=x0+((y/st)%2?st/2:0);x<x0+w;x+=st){const q=dir>0?(y-y0)/h:1-(y-y0)/h,r=st*.48*q;if(r>.6){g.beginPath();g.arc(x,y,r,0,7);g.fill()}}g.restore()}   // screentone
function focus(x,y,col,a,t,n=64,r0=260){if(a<=0)return;g.save();g.globalAlpha=a;g.fillStyle=col;for(let k=0;k<n;k++){const an=k/n*6.283+R(k,3)*.08,w=.012+.02*R(k,4),r1=r0+R(Math.floor(t*12)+k,5)*140;   // manga focus lines
  g.beginPath();g.moveTo(x+Math.cos(an)*r1,y+Math.sin(an)*r1);g.lineTo(x+Math.cos(an-w)*2600,y+Math.sin(an-w)*2600);g.lineTo(x+Math.cos(an+w)*2600,y+Math.sin(an+w)*2600);g.fill()}g.restore()}
function spark(x,y,s,col,a=1){if(a<=0)return;g.save();g.globalAlpha=a;g.translate(x,y);g.scale(s,s);g.fillStyle=col;g.beginPath();g.moveTo(0,-40);g.quadraticCurveTo(4,-4,40,0);g.quadraticCurveTo(4,4,0,40);g.quadraticCurveTo(-4,4,-40,0);g.quadraticCurveTo(-4,-4,0,-40);g.fill();g.restore()}   // ✦
function sparks(t,seed,col,n=9){for(let k=0;k<n;k++){const ph=(t*.5+R(k,seed))%1;spark(R(k,seed+1)*W,R(k,seed+2)*H,(.3+.6*R(k,seed+3))*Math.sin(ph*Math.PI),col,.9)}}
function tag(txt,x,y,bg,fg,a=1,f=30){if(a<=0)return;g.save();g.globalAlpha=a;g.font=JO(600,f);g.letterSpacing='4px';const w=g.measureText(txt).width+f*1.4;g.translate(x,y);g.rotate(-.04);g.fillStyle=bg;g.beginPath();g.roundRect(-w/2,-f*.9,w,f*1.8,6);g.fill();
  g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';g.fillText(txt,2,2);g.restore()}   // game-UI name tag
function panel(x,y,w,h,sk,col,lw=14){g.beginPath();g.moveTo(x-w/2+sk,y-h/2);g.lineTo(x+w/2,y-h/2);g.lineTo(x+w/2-sk,y+h/2);g.lineTo(x-w/2,y+h/2);g.closePath()}   // a slanted manga panel path
// ---------- quiet, elegant type: syllables fade up on their own timing ----------
function lay(i,ks,font){g.font=font;const sp=g.measureText(' ').width;const its=[];let x=0;ks.forEach((k,j)=>{const u=U(i,k);if(j>0&&u[4])x+=sp;[...u[0]].forEach((ch,q)=>{const w=g.measureText(ch).width;its.push({ch,ts:u[1]+q*.04,x:x+w/2});x+=w})});return {its,w:x}}
// type scale: three sizes only, and a word or phrase is never split across sizes
const TS={L:{f:124,bold:900},M:{f:86,bold:900},S:{f:60,bold:700}};
function say(t,i,ks,x,y,o={}){o={...(TS[o.size||'M']),...o};const f=o.f,font=(o.bold?KR(o.bold,f):KR(o.w||500,f)),lo=lay(i,ks,font),tr=o.track||0,tot=lo.w+tr*(lo.its.length-1),x0=o.align==='left'?x:o.align==='right'?x-tot:x-tot/2;
  g.save();g.font=font;g.textAlign='center';g.textBaseline='middle';
  lo.its.forEach((it,n)=>{const a=t-it.ts+(o.lead??0);if(a<-.08)return;const p=eOutC(clamp((a+.08)/(o.dur||.6)));let dx=0,dy=(1-p)*(o.rise??34),s=1,al=clamp((a+.08)/.35)*(o.a??1),bl=(1-p)*10;   // syllables drift up out of a blur
    if(o.st==='track')dx=(n-lo.its.length/2)*(1-p)*70;if(o.st==='pop')s=.6+.4*eBk(clamp((a+.08)/.4),1.8);if(o.st==='sink'){const q=Math.max(0,a-.5);dy+=q*q*150;al*=1-clamp(q/2.4)*.55}
    if(o.out!=null&&t>o.out)al*=1-clamp((t-o.out)/.5);if(al<=0)return;
    const px=o.vert?x:x0+it.x+n*tr+dx,py=o.vert?y+n*f*1.02-(lo.its.length-1)*f*.51+dx:y+dy;
    g.save();g.globalAlpha=al;g.translate(px+(o.vert?dy*.3:0),py);g.scale(s,s);if(bl>.4)g.filter=`blur(${bl.toFixed(1)}px)`;g.lineJoin='round';
    if(o.sh){g.fillStyle=o.sh;g.fillText(it.ch,f*.07,f*.07)}if(o.ol){g.lineWidth=f*.16;g.strokeStyle=o.ol;g.strokeText(it.ch,0,0)}g.fillStyle=o.col||'#fff';g.fillText(it.ch,0,0);g.restore()});g.restore()}
// every scene keeps moving: a slow drift and push, stronger on the near layers (parallax)
let S0=0;const drift=t=>{const u=t-S0;return {x:Math.sin(u*.33+S0)*22,y:Math.cos(u*.27+S0)*16,z:1+.045*Math.min(1,u/9)}};
function lyr(t,pf,fn){const d=drift(t);g.save();g.translate(CX,CY);g.scale(1+(d.z-1)*pf,1+(d.z-1)*pf);g.translate(-CX+d.x*pf,-CY+d.y*pf);fn();g.restore()}
const breathe=(t,k=0)=>({s:1+.012*Math.sin(t*1.6+k),r:.012*Math.sin(t*.9+k)});
function word(txt,x,y,font,col,a=1,sp=0){if(a<=0)return;g.save();g.globalAlpha=a;g.font=font;g.textAlign='center';g.textBaseline='middle';g.letterSpacing=sp+'px';g.fillStyle=col;g.fillText(txt,x+sp/2,y);g.restore()}
function arcs(t,x,y,r,col,a){g.save();g.strokeStyle=col;g.globalAlpha=a;g.lineWidth=2;for(let k=0;k<3;k++){g.beginPath();g.arc(x,y,r+k*70,t*.3*(k%2?1:-1)+k,t*.3*(k%2?1:-1)+k+2.2);g.stroke()}g.restore()}   // thin orbit lines, like the reference

// ---------- scenes (each draws a full frame at its own time) ----------
const SC={};
const STK={col:'#FFFFFF',ol:'#16143A',sh:'#FF4F9A'};   // default sticker look
SC.black=t=>{g.fillStyle='#0C0A1C';g.fillRect(0,0,W,H);spark(CX,CY,.7+.35*pulse(t),C.yel);tag('♪ NOW PLAYING',CX,CY+140,'rgba(255,255,255,.12)','#FFFFFF',since(t,.2,.4),24)};
SC.stage=t=>{lyr(t,.3,()=>{bgGrad('#1E1A55','#0C0A1C');tone(-100,H*.55,W+200,H*.6,'rgba(255,79,154,.35)',1,30);sparks(t,20,'rgba(255,228,92,.9)',7)});
  lyr(t,.6,()=>{focus(CX,CY-160,'rgba(255,255,255,.08)',1,t,48,420);const sp=eOutC(since(t,1.4,1.2))*(1+.03*Math.sin(t*1.3));const q=g.createRadialGradient(CX,CY-160,10,CX,CY-160,540*sp);q.addColorStop(0,'rgba(255,246,232,.95)');q.addColorStop(.6,'rgba(255,190,220,.5)');q.addColorStop(1,'rgba(255,79,154,0)');g.fillStyle=q;g.fillRect(-200,-200,W+400,H+400)});
  lyr(t,1,()=>{const fq=eInC(since(t,bt(10),.9)),ma=clamp((t-bt(2))/.5),yy=CY-230+fq*1000;
    if(fq<1){g.save();g.globalAlpha=ma*(1-fq);g.translate(CX,yy);g.rotate(fq*.6);g.font=DG(190);g.textAlign='center';g.textBaseline='middle';g.fillStyle=C.hot;g.fillText('MAIN',12,12);g.lineWidth=26;g.strokeStyle=C.navy;g.lineJoin='round';g.strokeText('MAIN',0,0);g.fillStyle='#FFFFFF';g.fillText('MAIN',0,0);
      const sl=eOutC(since(t,bt(8),.3));if(sl>0){g.fillStyle=C.hot;g.fillRect(-320,-14,640*sl,28)}g.restore()}   // struck out, then it falls
    const sb=eBk(since(t,bt(12),.45),2.2);if(sb>0){g.save();g.translate(CX,CY-230);g.scale(sb,sb);g.rotate(-.06);g.font=DG(210);g.textAlign='center';g.textBaseline='middle';g.fillStyle=C.navy;g.fillText('SUB',14,14);g.lineWidth=28;g.strokeStyle='#FFFFFF';g.lineJoin='round';g.strokeText('SUB',0,0);g.fillStyle=C.hot;g.fillText('SUB',0,0);g.restore()}
    word('CHARACTER',CX,CY-40,JO(600,74),'#FFFFFF',since(t,bt(4),.8),18+30*(1-eOutC(since(t,bt(4),1.4))));
    tag('CAST : EXTRA #7',CX-180,CY+120,C.yel,C.navy,since(t,bt(14),.4));tag('윤하  ·  YOUNHA',CX+170,CY+200,'#FFFFFF',C.navy,since(t,bt(16),.4),28)})};
// verse 1: over my shoulder, you far ahead in the light; the camera leans in toward you and I slide out of frame
function verseScene(t){const push=eIOs(since(t,15.1,L(2).e-15.1)),fx=CX+120,fy=640,z=1+.28*push;   // the whole verse is one slow dolly toward you
  const P=(pf,fn)=>{g.save();g.translate(fx,fy);g.scale(1+(z-1)*pf,1+(z-1)*pf);g.translate(-fx,-fy);lyr(t,pf,fn);g.restore()};
  P(.3,()=>{bgGrad('#9FD8FF','#FFC4DA');tone(-200,-200,W+400,1000,'rgba(255,255,255,.55)',-1,28);sparks(t,30,'#FFFFFF',8)});
  P(.55,()=>{circ(fx,fy,300*(1+.02*Math.sin(t*1.2)),'rgba(255,255,255,.95)');const b=breathe(t);art('you_back',fx+Math.sin(t*1.7)*5,fy+40,560*b.s,{rot:b.r,rim:'#FFFFFF'});   // you, walking into the light
    focus(fx,fy,'rgba(22,20,58,.16)',since(t,L(2).s,1.2),t,56,360)});                                                                         // the stare: focus lines close in on you
  P(1.5,()=>{const b=breathe(t,2);art('me_back',CX-250,H-560+60*push,1560*b.s,{rot:-.02+b.r*.4,rim:'#FFFFFF'})});                              // me, in the foreground
  lyr(t,1,()=>{tag('ME',150,300,C.hot,'#FFFFFF',since(t,L(0).s-.2,.3),28);say(t,0,r_(0,4),110,420,{size:'M',...STK,align:'left'});
    tag('YOU',fx+230,fy-330,C.cyan,C.navy,since(t,L(1).s,.3),28);say(t,1,r_(0,4),CX+170,1120,{size:'L',...STK,sh:C.cyan,st:'track'});
    say(t,2,r_(0,3),CX+170,1290,{size:'M',...STK,st:'track',track:10});say(t,2,r_(4,7),CX+170,1410,{size:'M',...STK,st:'track',track:10})})}
SC.verse=t=>verseScene(t);
SC.thought=t=>{lyr(t,.25,()=>{bgGrad('#B8A6FF','#6C5CFF');tone(-100,-100,W+200,H*.7,'rgba(255,255,255,.35)',-1,30);sparks(t,40,'#FFFFFF',8)});   // me, a thought orbiting
  lyr(t,.6,()=>{const b=breathe(t,1);art('me_profile',CX-170,1110,1380*b.s,{rot:b.r*.5,rim:'#FFFFFF'})});
  const fl=since(t,L(5).s-.5,1.5),or=t*1.4,px=lerp(CX+260+Math.cos(or)*80,CX+220,eIOs(fl)),py=lerp(600+Math.sin(or)*60,760,eIOs(fl)),pr=lerp(46,190,eOutC(fl));
  lyr(t,.85,()=>{circ(px,py,pr+10,'#FFFFFF');circ(px,py,pr,C.yel);spark(px+pr*.9,py-pr*.9,.5+.2*Math.sin(t*4),'#FFFFFF')});
  lyr(t,1,()=>{say(t,3,r_(0,5),CX+230,470,{size:'M',...STK});
    say(t,4,r_(0,4),CX+250,1440,{size:'M',...STK,st:'track',track:6});
    say(t,5,[0,1,2],px,py,{size:'S',col:C.navy,st:'pop'});say(t,5,r_(3,7),CX+250,1560,{size:'M',...STK,sh:C.cyan})})};
SC.sink=t=>{lyr(t,.2,()=>{bgGrad('#1E1A55','#0C0A1C');for(let k=0;k<60;k++){circ(R(k,1)*W,((R(k,2)*H-t*40)%H+H)%H,1.5+R(k,3)*2,'rgba(255,255,255,.4)')}tone(-100,H*.6,W+200,H*.5,'rgba(63,227,255,.18)',1,30)});
  const py=lerp(420,1250,eIOs(since(t,L(6).s-.2,3.2)));lyr(t,.8,()=>{circ(CX+60,py,70,'#FFFFFF');circ(CX+60,py,60,C.yel)});
  const hr=eOutC(since(t,L(6).s+1.1,1.4))-eInC(since(t,L(7).s+.5,1.3));lyr(t,.9,()=>art('me_hand',CX-40,H+240-600*hr,1250,{rot:.04*Math.sin(t*1.3),rim:'#FFFFFF'}));
  lyr(t,1,()=>{say(t,6,[0,1,2],CX-300,560,{size:'S',...STK,vert:1});say(t,6,r_(3,8),CX+300,700,{size:'L',...STK,st:'sink',vert:1});   // vertical writing
    say(t,7,r_(0,4),CX,1560,{size:'M',...STK,sh:C.cyan})})};
SC.ink=t=>{g.fillStyle='#0C0A1C';g.fillRect(0,0,W,H);focus(CX,920,'rgba(255,255,255,.85)',1,t,80,300);lyr(t,1,()=>say(t,8,r_(0,4),CX,920,{size:'L',col:'#0C0A1C',ol:'#FFFFFF',sh:C.hot,st:'sink'}))};
SC.cold=t=>{lyr(t,.3,()=>{bgGrad('#E6F7FF','#8ED0FF');tone(-100,-100,W+200,H+200,'rgba(255,255,255,.4)',1,34);sparks(t,50,'#FFFFFF',10)});
  lyr(t,1,()=>{say(t,9,[0,1,2],CX,800,{size:'M',...STK,sh:C.cyan,st:'track',track:10});say(t,9,[3,4,5],CX,960,{size:'L',col:'#FFFFFF',ol:'#1E3A6E',sh:C.cyan})})};

// ---------- transitions: each draws scene A and scene B together ----------
const OFF=[0,1].map(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c});
const ST0={};function into(k,id,t){const c=OFF[k],x=c.getContext('2d');const g0=g;g=x;g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.filter='none';g.clearRect(0,0,W,H);S0=ST0[id]??0;SC[id](t);g=g0;return c}
const SM=x=>x*x*x*(x*(x*6-15)+10);
const TR={
  expand(t,p,A,B,o){g.drawImage(into(0,A,t),0,0);const r=SM(p)**1.4*1300;g.save();g.beginPath();g.arc(o.x,o.y,Math.max(1,r),0,7);g.clip();g.drawImage(into(1,B,t),0,0);g.restore()},   // a dot grows into the next scene
  morphPush(t,p,A,B){g.drawImage(into(0,A,t),0,0);const m=eIO(clamp(p/.55)),k=eInC(clamp((p-.45)/.55));   // the spotlight becomes a card, then we fall into it
    const cw=lerp(520,460,m),bh=H*cw/W,ch=lerp(lerp(520,700,m),bh,k),rr=lerp(260,36,m)*(1-k),rot=Math.PI/2*m*(1-k),cy=CY-120*(1-k),s=1+k*(W/cw-1);
    g.save();g.translate(CX,cy);g.rotate(rot);g.scale(s,s);if(m>.3)panel(0,0,cw,ch,70*m*(1-k),0);else rrect(0,0,cw,ch,rr);g.lineWidth=18;g.strokeStyle='#FFFFFF';g.stroke();g.fillStyle=C.cream;g.globalAlpha=clamp(p/.2);g.fill();g.globalAlpha=1;g.clip();
    g.rotate(-rot);g.globalAlpha=clamp((p-.3)/.3);g.drawImage(into(1,B,t),-cw/2,-bh/2,cw,bh);g.restore()},
  wave(t,p,A,B){g.drawImage(into(0,A,t),0,0);const e=SM(p);g.save();g.beginPath();g.moveTo(W+10,-10);for(let y=-10;y<=H+10;y+=20){const x=W+60-e*(W+260)+Math.sin(y*.006+p*7)*90*(1-e*.6)+Math.sin(y*.013)*40;g.lineTo(x,y)}g.lineTo(W+10,H+10);g.closePath();g.clip();
    g.drawImage(into(1,B,t),0,0);g.restore()},
  follow(t,p,A,B,o){const e=SM(p),a=into(0,A,t),b=into(1,B,t),x=a.getContext('2d');x.save();x.globalCompositeOperation='destination-out';const q=x.createLinearGradient(0,H-520,0,H);q.addColorStop(0,'rgba(0,0,0,0)');q.addColorStop(1,'rgba(0,0,0,1)');x.fillStyle=q;x.fillRect(0,H-520,W,520);x.restore();   // no hard seam: the scenes melt into each other
    g.drawImage(b,0,(H-260)*(1-e));g.drawImage(a,0,-e*(H-260))},   // the camera chases the planet down
  burst(t,p,A,B){g.drawImage(into(0,A,t),0,0);const e=eOutC(clamp(p/.6));g.fillStyle=`rgba(255,255,255,${clamp(1-Math.abs(p-.35)/.25)})`;g.fillRect(0,0,W,H);   // manga impact: flash, focus lines, black
    focus(CX,900,'#0C0A1C',1,t,90,lerp(900,40,e));if(p>.7){g.globalAlpha=(p-.7)/.3;g.drawImage(into(1,B,t),0,0);g.globalAlpha=1}},
  light(t,p,A,B){g.drawImage(into(0,A,t),0,0);g.save();g.globalCompositeOperation='lighter';const e=eInC(clamp(p/.7));for(let k=0;k<6;k++){const an=-.9+k*.36+Math.sin(t*2+k)*.05;g.save();g.translate(CX+(k-2.5)*120,-80);g.rotate(an*.35);

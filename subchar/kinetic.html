/* Sub character — kinetic typography. The letters are the actors: one cut per sung line, flat colour,

const L=i=>Ln[i],bt=n=>B0+n*BEAT;

// ---------- type engine: every character is placed, timed on its syllable, and animated on its own ----------
function lay(i,ks,font,track,up){g.font=font;const sp=g.measureText(' ').width;const its=[];let x=0;
  ks.forEach((k,j)=>{const u=U(i,k),cs=[...(up?u[0].toUpperCase():u[0])];if(j>0&&u[4])x+=sp;cs.forEach((c,q)=>{const w=g.measureText(c).width;its.push({c,k,x,w,ts:u[1]+(cs.length>1?q*Math.min(.045,(u[2]-u[1])/cs.length):0)});x+=w+track})});
  return {its,w:Math.max(0,x-track)}}
const ANIM={
  slam:a=>{const p=eOutC(clamp(a/.14));return {s:1+1.2*(1-p)}},
  pop:a=>({s:Math.max(0,eBk(clamp(a/.24),2.4))}),
  rise:(a,n,o)=>({dy:(1-eOutX(clamp(a/.32)))*o.f*1.15}),
  drop:a=>({dy:-(1-oB(clamp(a/.5)))*360}),
  type:()=>({}),
  fade:a=>({al:clamp(a/.3)}),
  stretch:a=>{const p=eOutC(clamp(a/.22));return {sy:1+2.4*(1-p),sx:1-.45*(1-p)}},
  slideL:a=>({dx:-(1-eOutX(clamp(a/.36)))*700}),
  slideR:a=>({dx:(1-eOutX(clamp(a/.36)))*700}),
  spin:a=>{const p=eOutC(clamp(a/.32));return {rot:-1.3*(1-p),s:p}},
  jitter:(a,n,o,t)=>{const p=eOutC(clamp(a/.12));return {s:1+1.1*(1-p),dx:(R(n,Math.floor(t*15))-.5)*o.f*.12,dy:(R(n+9,Math.floor(t*15))-.5)*o.f*.12}},
  snap:(a,n,o)=>{const p=eOutX(clamp(a/.4));return {dx:(1-p)*(R(n,3)-.5)*900,dy:(1-p)*(R(n,4)-.5)*1200,rot:(1-p)*(R(n,5)-.5)*3}},
  scatter:(a,n,o,t)=>{const q=Math.max(0,a-.45);return {s:1+1.2*(1-eOutC(clamp(a/.14))),dx:(R(n,11)-.5)*260*q,dy:(R(n,12)-.5)*300*q,rot:(R(n,13)-.5)*1.2*q}},
  dissolve:a=>({al:clamp(a/.2)*(1-.85*clamp((a-.8)/.8)),dy:-30*clamp((a-.8)/.8)}),
  breath:a=>{const q=Math.max(0,a-.35);return {s:1+1.2*(1-eOutC(clamp(a/.14)))+q*.15,dy:-q*160,al:1-.6*clamp(q/1.6)}},
  fall:(a,n,o)=>{const q=Math.max(0,a-(o.hang??.35));return {s:1+1.2*(1-eOutC(clamp(a/.14))),dy:1400*q*q,rot:(R(n,6)-.5)*q*2}},
};
// kt: draw units ks of line i. o: font f(size) col st align maxW stroke lw track rot mask show out
function kt(t,i,ks,x,y,o){const f=o.f;g.save();const lo=lay(i,ks,o.font(f),o.track||0,o.up),sc=o.maxW&&lo.w>o.maxW?o.maxW/lo.w:1;
  g.translate(x,y);if(o.rot)g.rotate(o.rot);g.scale(sc,sc);g.font=o.font(f);g.textBaseline='middle';g.textAlign='center';
  const x0=o.align==='left'?0:o.align==='right'?-lo.w:-lo.w/2;
  if(o.mask){g.beginPath();g.rect(x0-f,-f*.62,lo.w+f*2,f*1.24);g.clip()}
  lo.its.forEach((it,n)=>{const a=t-it.ts;if(a<0&&!o.show)return;if(o.out!=null&&t>o.out)return;const r=ANIM[o.st||'slam'](Math.max(a,o.show&&a<0?99:a),n,o,t);const al=r.al??1;if(al<=0)return;
    g.save();g.translate(x0+it.x+it.w/2+(r.dx||0),r.dy||0);if(r.rot)g.rotate(r.rot);g.scale(r.sx??r.s??1,r.sy??r.s??1);g.globalAlpha=al*(o.a??1);
    const col=typeof o.col==='function'?o.col(it,n,t):o.col;if(o.stroke){g.lineWidth=o.lw||5;g.lineJoin='round';g.strokeStyle=col;g.strokeText(it.c,0,0)}else{g.fillStyle=col;g.fillText(it.c,0,0)}g.restore()});
  g.restore();return lo.w*sc}
// free text (not tied to a sung line)
function tx(txt,x,y,font,col,o={}){g.save();g.font=font;g.textAlign=o.align||'center';g.textBaseline='middle';if(o.sp)g.letterSpacing=o.sp+'px';g.globalAlpha=o.a??1;g.translate(x,y);if(o.rot)g.rotate(o.rot);if(o.s)g.scale(o.s,o.s);
  if(o.stroke){g.lineWidth=o.lw||5;g.strokeStyle=col;g.lineJoin='round';g.strokeText(txt,0,0)}else{g.fillStyle=col;g.fillText(txt,0,0)}const w=g.measureText(txt).width;g.restore();return w}

  g.fillStyle=PAPER;g.fillRect(0,1320,W,330);kt(t,i,[0,1,2,3,4],CX,1400,{font:w=>F(300,w),f:66,col:MID,st:'fade'});kt(t,i,[5,6],CX,1540,{font:HV,f:150,col:INK,st:'slam'})};

// chunk text -> the units it covers
function chunkUnits(i){const sp=KSPEC[i],u=L(i).u;let k=0;return sp.chunks.map(c=>{const want=c.txt.replace(/\s/g,'').length,ks=[];let got=0;while(k<u.length&&got<want){ks.push(k);got+=u[k][0].replace(/\s/g,'').length;k++}return {...c,ks}}).filter(c=>c.ks.length)}
const ZONE={T:[150,780],B:[1180,1820],C:[620,1300]};
const isLatin=s=>/^[\x00-\x7F]+$/.test(s.replace(/\s/g,''));
const KF=(c,f)=>isLatin(c.txt)?DG(f*.82):HV(f);
function chunkChars(i,c,font){g.font=font;const sp=g.measureText(' ').width*.9,its=[];let x=0;c.ks.forEach((k,j)=>{const u=U(i,k);if(j>0&&u[4])x+=sp;const txt=isLatin(c.txt)?u[0].toUpperCase():u[0];[...txt].forEach((ch,q)=>{const w=g.measureText(ch).width;its.push({ch,ts:u[1]+q*.035,x:x+w/2,w});x+=w})});return {its,w:x}}
const KL={};   // cached layouts per line
function layoutLine(i){if(KL[i])return KL[i];const sp=KSPEC[i],cs=chunkUnits(i),[z0,z1]=ZONE[sp.zone],zh=z1-z0,zw=W-140,out={cs,st:sp.st};
  if(sp.st==='tate'){const n=cs.length;cs.forEach((c,k)=>{const nch=[...c.txt.replace(/\s/g,'')].length;c.f=Math.min(c.emph?210:150,zh*.95/(nch*1.04));c.vert=1;c.cx=CX+((n-1)/2-k)*Math.min(260,zw/n);c.cy=(z0+z1)/2})}
  else{let tot=0;cs.forEach(c=>{const m=chunkChars(i,c,KF(c,100)).w/100;c.f=clamp(zw*(c.emph?.96:.8)/m,70,c.emph?(sp.st==='shout'?300:250):(sp.st==='shout'?120:180));tot+=c.f*1.1});
    const s=tot>zh?zh/tot:1;let y=(z0+z1)/2-tot*s/2;cs.forEach((c,k)=>{c.f*=s;y+=c.f*.55;c.cx=CX+(sp.st==='cam'?0:(k%2?1:-1)*20);c.cy=y;c.rot=sp.st==='cam'?0:(c.emph?-.05:(k%2?.025:-.025));y+=c.f*.55})
    if(sp.st==='cam'){cs.forEach((c,k)=>{c.cx=CX+(k%2?1:-1)*(k?90:0);c.cy=(z0+z1)/2+(k-(cs.length-1)/2)*Math.min(c.f*1.15,zh/cs.length);c.rot=(k%3===1?-Math.PI/2*0:0)})}}
  cs.forEach(c=>{c.lo=chunkChars(i,c,KF(c,c.f));c.t0=c.lo.its[0].ts});KL[i]=out;return out}
const ENTRY=['pop','flip','drop','fly'];
function charPose(style,a,n,c,t){   // entrance of one character; a = time since its syllable
  const p=clamp(a/.28);switch(style){
    case 'slam':{const q=eOutC(clamp(a/.14));return {s:1+1.6*(1-q),al:clamp(a/.05)}}
    case 'pop':return {s:Math.max(0,eBk(clamp(a/.3),2.4)),al:clamp(a/.06)}
    case 'flip':return {sy:Math.max(.02,eBk(clamp(a/.3),2)),al:clamp(a/.06)}
    case 'drop':return {dy:-(1-oB(clamp(a/.5)))*420,al:clamp(a/.05)}
    case 'fly':{const q=eOutX(clamp(a/.35));return {dx:(1-q)*(n%2?700:-700),sx:1+(1-q)*1.2,al:clamp(a/.08)}}
    case 'scatter':{const q=eOutX(clamp(a/.45));return {dx:(1-q)*(R(n,71)-.5)*1400,dy:(1-q)*(R(n,72)-.5)*1600,rot:(1-q)*(R(n,73)-.5)*6,al:clamp(a/.1)}}
    case 'bounce':{const q=clamp(a/.6),y=-(1-oB(q))*520,land=a>.35&&a<.55?Math.sin((a-.35)/.2*Math.PI)*.25:0;return {dy:y,sx:1+land,sy:1-land,al:clamp(a/.05)}}
    case 'tate':{const q=eOutC(clamp(a/.3));return {dy:-(1-q)*260,al:clamp(a/.1)}}}
  return {}}
const IMP=[];   // impacts: emphasis chunks shake, flash, ring and burst confetti
function buildImpacts(){for(let i=0;i<Ln.length;i++){const lo=layoutLine(i);lo.cs.forEach(c=>{if(c.emph)IMP.push({t:c.t0,x:c.cx,y:c.cy,big:lo.st==='shout'?1.4:1})})}IMP.sort((a,b)=>a.t-b.t)}
const lineOut=i=>Ln[i+1]?Math.min(Ln[i+1].s-.12,L(i).e+1.6):L(i).e+1.6;
function kineticLyrics(t){for(let i=0;i<Ln.length;i++){const s=L(i).s,o=lineOut(i);if(t<s-.4||t>o+.55)continue;const lo=layoutLine(i);
  // "cam": the whole line group glides so the chunk being sung sits in the middle of its zone
  let gx=0,gy=0;if(lo.st==='cam'){let k=0;lo.cs.forEach((c,j)=>{if(t>=c.t0-.1)k=j});const prev=lo.cs[Math.max(0,k-1)],cur=lo.cs[k],q=eIO(clamp((t-cur.t0+.1)/.3));const zc=(ZONE[KSPEC[i].zone][0]+ZONE[KSPEC[i].zone][1])/2;gy=zc-lerp(prev.cy,cur.cy,k?q:1);gx=CX-lerp(prev.cx,cur.cx,k?q:1)}
  const ex=t-o;   // exit: the letters explode
  lo.cs.forEach((c,ci)=>{const st=c.emph?'slam':lo.st==='stack'?ENTRY[ci%4]:lo.st==='shout'?'pop':lo.st==='cam'?(ci%2?'fly':'pop'):lo.st;const f=c.f,font=KF(c,f),col=c.emph?C.yel:'#FFFFFF',sh=c.emph?C.hot:C.hot;
    g.save();g.translate(gx,gy);g.font=font;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
    c.lo.its.forEach((it,n)=>{const a=t-it.ts;if(a<-.02)return;const P=charPose(st,a,n,c,t);let x,y;
      if(c.vert){x=c.cx;y=c.cy+(n-(c.lo.its.length-1)/2)*f*1.04}else{x=c.cx+(it.x-c.lo.w/2)*Math.cos(c.rot||0);y=c.cy+(it.x-c.lo.w/2)*Math.sin(c.rot||0)}
      let al=P.al??1,dx=P.dx||0,dy=P.dy||0,rot=(P.rot||0)+(c.vert?0:(c.rot||0)),s=P.s??1;
      if(ex>0){const q=clamp(ex/.5),an=Math.atan2(y-c.cy+(R(n,81)-.5)*80,x-CX+(R(n,82)-.5)*200);dx+=Math.cos(an)*q*(500+500*R(n,83));dy+=Math.sin(an)*q*(500+500*R(n,84))+q*q*300;rot+=(R(n,85)-.5)*q*8;al*=1-q}   // explode away
      if(al<=0)return;g.save();g.globalAlpha=clamp(al);g.translate(x+dx,y+dy);g.rotate(rot);g.scale((P.sx??s)*(1+(c.emph?.04*pulse(t):0)),(P.sy??s)*(1+(c.emph?.04*pulse(t):0)));
      g.fillStyle=sh;g.fillText(it.ch,f*.06,f*.06);g.lineWidth=f*.15;g.strokeStyle=C.navy;g.strokeText(it.ch,0,0);g.fillStyle=col;g.fillText(it.ch,0,0);g.restore()});
    g.restore()})}}
function impacts(t){let sh=0;for(const m of IMP){const a=t-m.t;if(a<0||a>1.3)continue;
    if(a<.3)sh=Math.max(sh,26*m.big*(1-a/.3));
    if(a<.16){g.fillStyle=`rgba(255,255,255,${.35*m.big*(1-a/.16)})`;g.fillRect(0,0,W,H)}
    for(let r=0;r<2;r++){const q=clamp((a-r*.1)/.7);if(q>0&&q<1){g.strokeStyle=r?rgba(C.hot,1-q):`rgba(255,255,255,${1-q})`;g.lineWidth=14*(1-q)+2;g.beginPath();g.arc(m.x,m.y,40+900*m.big*eOutC(q),0,7);g.stroke()}}
    for(let k=0;k<26*m.big;k++){const an=R(k,m.t*7)*6.283,v=500+900*R(k,m.t*7+1),q=clamp(a/1.2),x=m.x+Math.cos(an)*v*eOutC(q),y=m.y+Math.sin(an)*v*eOutC(q)+500*q*q;g.save();g.translate(x,y);g.rotate(q*8*(R(k,3)-.5));g.globalAlpha=1-q;g.fillStyle=[C.yel,C.hot,C.cyan,'#FFFFFF'][k%4];g.fillRect(-10,-5,20,10);g.restore()}}
  return sh}

const MEM=['mem_entrance','mem_class','mem_race','mem_festival','mem_rain','mem_library','mem_lunch','mem_sunset','mem_rooftop','mem_photo','mem_award'];
function memFrame(id,x,y,w,h,lit,cap){const im=ART[id];g.save();g.translate(x,y);g.fillStyle='#FFF7EA';g.fillRect(-w/2-12,-h/2-12,w+24,h+24);
  if(im){const sc=Math.max(w/im.width,h/im.height);g.save();g.beginPath();g.rect(-w/2,-h/2,w,h);g.clip();g.drawImage(im,-im.width*sc/2,-im.height*sc/2,im.width*sc,im.height*sc);g.restore()}else{g.fillStyle='#3A2A40';g.fillRect(-w/2,-h/2,w,h)}
  g.fillStyle=`rgba(255,170,90,${.14+.2*(1-lit)})`;g.globalCompositeOperation='multiply';g.fillRect(-w/2,-h/2,w,h);g.globalCompositeOperation='source-over';   // warm, faded like an old print
  g.fillStyle=`rgba(10,6,16,${.62*(1-lit)})`;g.fillRect(-w/2,-h/2,w,h);if(cap){g.font=JO(600,22);g.fillStyle='rgba(22,20,58,.7)';g.textAlign='left';g.fillText(cap,-w/2,h/2+30)}g.restore()}
function strip(y,h,w,gap,off,ids,dir,alpha,lit){g.save();g.globalAlpha=alpha;g.fillStyle='#120B14';g.fillRect(-100,y-h/2-70,W+200,h+140);g.fillStyle='#2A1E2C';
  for(let x=((off*.5)%60+60)%60-60;x<W+60;x+=60){g.fillRect(x,y-h/2-52,30,24);g.fillRect(x,y+h/2+28,30,24)}

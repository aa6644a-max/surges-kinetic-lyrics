function placeRow(c,f,cx,cy,rot){
  const w=c.n*f;let x=-w/2;

  Object.assign(c,{cx,cy,f,w,rot});

// classic kinetic type: each chunk is placed under the previous ones, sometimes turned 90deg;
// the camera follows the newest chunk and rotates so it always reads upright
function layoutCam(sc,spiral){
  let B=null,th=0;

    if(k>0&&(spiral||k%2===1))th+=spiral?-90:(k%4===1?-90:90);
    const Bp=B&&boxRot(B,-th);
    let f=Bp?clamp((Bp.x1-Bp.x0)/c.n,70,300):clamp(760/c.n,100,230);
    if(Bp&&c.emph)f=Math.min(f*1.2,340);
    const w=c.n*f,h=f*1.12;let cxp=0,cyp=0;
    if(Bp){cyp=Bp.y1+f*.1+h/2;const al=c.emph?0:(k%2?-1:1);cxp=al<0?Bp.x0+w/2:al>0?Bp.x1-w/2:(Bp.x0+Bp.x1)/2}

    B=boxU(B,boxOf([[-w/2,-h/2],[w/2,-h/2],[-w/2,h/2],[w/2,h/2]].map(p=>rotp(p[0]+cxp,p[1]+cyp,th))));
    c.z=clamp(820/w,Math.min(120,900/c.nc)/f,250/f);
  });

function layoutRows(sc){
  const MW=920;let best=null;
  for(let f=200;f>=80;f-=5){
    const rows=[];let cur=[],cw=0,split=false;
    const push=()=>{if(cur.length)rows.push(cur);cur=[];cw=0};
    for(const c of sc.chunks){const k=c.emph?1.2:1,w=c.n*f*k;
      if(cw+w<=MW){c.us.forEach(u=>cur.push([u,f*k]));cw+=w}
      else if(w<=MW){push();c.us.forEach(u=>cur.push([u,f*k]));cw=w}
      else{split=true;for(const u of c.us){const uw=u.wr*f*k;if(cw+uw>MW)push();cur.push([u,f*k]);cw+=uw}}}
    push();best=rows;if(rows.length<=3&&!split)break;
  }
  const rh=best.map(r=>Math.max(...r.map(([,f])=>f))*1.2);
  let y=-rh.reduce((a,b)=>a+b,0)/2;
  best.forEach((r,ri)=>{const rw=r.reduce((a,[u,f])=>a+u.wr*f,0);let x=-rw/2;const cy=y+rh[ri]/2;
    r.forEach(([u,f])=>{const w=u.wr*f;u.x=x+w/2;u.y=cy;u.f=f;u.rot=0;x+=w});y+=rh[ri]});

const ENT={cam:u=>u.emph?'slam':'pop',spiral:u=>u.emph?'slam':'pop',stack:u=>u.emph?'slam':['flip','pop','drop','pop'][u.ch%4],
  zoom:u=>u.emph?'slam':'far',scatter:()=>'fly',bounce:()=>'drop',tate:u=>u.emph?'slam':'slide',shout:u=>u.emph?'slam':'pop'};
const LEAD={pop:.04,slam:.03,far:.1,fly:.34,drop:.26,slide:.08,flip:.08};
const LAND={pop:.08,slam:.17,far:.25,fly:.18,drop:0,slide:.15,flip:.2};
const EXIT={cam:'cam',spiral:'cam',stack:'explode',zoom:'zoom',scatter:'explode',bounce:'fall',tate:'shutter',shout:'explode'};

/* ---------- scenes ---------- */
let S=[],TT=[],IMP=[];
function mkChar(parent,u,cls){
  const d=document.createElement('div'),f=u.f,w=u.vert?f*1.1:u.wr*f,h=u.vert?[...u.t].length*f:f*1.25;
  d.className='c'+cls;d.textContent=u.t;
  Object.assign(d.style,{fontSize:f+'px',width:w+'px',height:h+'px',lineHeight:(u.vert?w:h)+'px',marginLeft:-w/2+'px',marginTop:-h/2+'px',opacity:0});
  parent.appendChild(d);u.el=d;u.op=0;
}
function explodeVel(u,r,k=1){
  let dx=u.x,dy=u.y,l=Math.hypot(dx,dy);if(l<60){const a=r(6)*Math.PI*2;dx=Math.cos(a);dy=Math.sin(a);l=1}
  const sp=(700+900*r(7))*k;u.vx=dx/l*sp+(r(8)*2-1)*200;u.vy=dy/l*sp-450-300*r(9);u.spin2=(r(10)*2-1)*900;
}
function makeScene(L,i){
  const next=D.lines[i+1],sc={i,L,st:L.st,fl:new Set(L.fl),s:L.s,e:L.e};
  sc.inv=sc.fl.has('inv');
  sc.units=L.w.map(([t,s,e],k)=>({t,s,e,k,wr:em(t)}));
  sc.chunks=L.ch.map(([a,b,m],k)=>{const us=sc.units.slice(a,b),c={k,us,emph:!!m,s:us[0].s,e:us[us.length-1].e,n:us.reduce((x,u)=>x+u.wr,0),nc:us.length};
    us.forEach(u=>{u.ch=k;u.emph=c.emph});return c});
  sc.out=next&&next.s-L.e<2.5?next.s-.06:L.e+1.1;
  sc.exit=EXIT[sc.st];
  LAYOUT[sc.st](sc);
  sc.chunks.forEach(c=>{if(c.cx===undefined){c.cx=avg(c.us.map(u=>u.x));c.cy=avg(c.us.map(u=>u.y))}});
  sc.units.forEach(u=>{
    const r=j=>H(i*97+u.k*13+j,i);
    u.r1=r(1)*2-1;u.spin=(r(2)*2-1)*540;u.h0=750+350*r(3);u.ent=ENT[sc.st](u);u.lead=LEAD[u.ent];
    if(sc.fl.has('wind')){u.fx=-1300-500*r(4);u.fy=(r(5)*2-1)*350;u.spin=(r(2)*2-1)*160}
    else if(sc.fl.has('rise')){u.fx=(r(4)*2-1)*250;u.fy=1300+400*r(5);u.spin=(r(2)*2-1)*120}
    else{const a=r(4)*Math.PI*2,d=1200+500*r(5);u.fx=Math.cos(a)*d;u.fy=Math.sin(a)*d}
    explodeVel(u,r,sc.st==='shout'?1.5:1);
  });
  const el=document.createElement('div');el.className='sc'+(sc.inv?' inv':'');el.style.display='none';stage.appendChild(el);sc.el=el;sc.shown=false;
  sc.chunks.forEach(c=>{const g=document.createElement('div');g.className='grp';el.appendChild(g);c.g=g;
    c.us.forEach(u=>mkChar(g,u,(c.emph?' em':'')+(c.ol?' ol':'')+(u.vert?' v':'')+(c.emph&&sc.fl.has('fire')?' fire':'')))});
  sc.word=(sc.chunks.find(c=>c.emph)||sc.chunks[0]).us.map(u=>u.t).join('');
  return sc;
}
function makeTitle(a,b,v){
  const tt={a,b,v,units:[],ex:v===2?140.3:b-.5};
  const el=document.createElement('div');el.className='sc';el.style.display='none';stage.appendChild(el);tt.el=el;tt.shown=false;
  const add=(ch,f,x,y,k,big,s)=>{
    const r=j=>H(k*31+j+(big?0:500),v+11);
    const u={t:ch,x,y,k,f,big,s,e:s,rot:0,wr:em(ch),r1:r(1)*2-1,h0:900+300*r(2),spin:(r(3)*2-1)*540,ent:big?(v===1?'fly':'drop'):'pop'};
    u.lead=LEAD[u.ent];const an=r(4)*Math.PI*2;u.fx=Math.cos(an)*1400;u.fy=Math.sin(an)*1400;explodeVel(u,r,1.2);
    mkChar(el,u,big?(k%2?' em':''):' sub');tt.units.push(u)};
  const word=[...'SURGES'],gap=4,f=Math.min(240,860/word.reduce((a,c)=>a+em(c),0)),ws=word.map(c=>em(c)*f),W=ws.reduce((x,y)=>x+y,0)+gap*(word.length-1);
  let x=-W/2;word.forEach((c,k)=>{add(c,f,x+ws[k]/2,-80,k,true,a+.3+k*.24);x+=ws[k]+gap});
  const sub=[...'おとなりモンスター 歌ってみた'],f2=50,sw=sub.map(c=>c===' '?f2*.6:em(c)*f2),SW=sw.reduce((x,y)=>x+y,0);
  x=-SW/2;sub.forEach((c,j)=>{if(c!==' ')add(c,f2,x+sw[j]/2,110,j,false,a+1.9+j*.05);x+=sw[j]});

}
function buildImpacts(){
  IMP=[];
  S.forEach(sc=>{
    const lvl=PAL[SECT[secAt(sc.s+.01)][1]].int;
    IMP.push({t:sc.s,s:.35*lvl,x:0,y:0,n:0,fl:.25});
    const cam=sc.st==='cam'||sc.st==='spiral'||sc.st==='zoom';
    sc.chunks.forEach(c=>{if(!c.emph)return;
      if(sc.st==='shout')c.us.forEach(u=>IMP.push({t:u.s+.17,s:1.1*lvl,x:u.x,y:u.y,n:22,fl:.6}));
      else IMP.push({t:c.s+LAND[c.us[0].ent],s:lvl,x:cam?0:c.cx,y:cam?0:c.cy,n:20,fl:.45})});
  });
  TT.forEach(tt=>{tt.units.forEach(u=>{if(u.big)IMP.push({t:u.s+(tt.v===1?.18:0),s:.4,x:u.x,y:u.y+u.f*.45,n:10,fl:.15})});
    if(tt.v!==2)IMP.push({t:tt.ex+.02,s:.9,x:0,y:-80,n:30,fl:.5})});
  IMP.sort((a,b)=>a.t-b.t);
}

/* ---------- per-character motion ---------- */
function entry(u,t){
  const a=t-u.s+u.lead;if(a<0)return null;
  const o={dx:0,dy:0,ly:0,dr:0,sx:1,sy:1,rx:0,ry:0,op:1,bl:0};
  switch(u.ent){
    case 'pop':{const p=clamp(a/.35);o.sx=o.sy=spring(a);o.op=clamp(a/.05);o.dr=u.r1*28*(1-eOutC(p));o.ly=60*(1-eOutC(p));break}
    case 'slam':{const p=clamp(a/.2);let s=1+(u.big?2.6:1.6)*(1-eOutC(p));if(a>.2)s-=.14*Math.sin(clamp((a-.2)/.22)*Math.PI);
      o.sx=o.sy=s;o.op=clamp(a/.04);o.bl=4*(1-p);o.dr=u.r1*(u.big?30:14)*(1-eOutC(p));break}
    case 'far':{const p=clamp(a/.4);o.sx=o.sy=.12+.88*eBack(p,2);o.op=clamp(a/.1);o.bl=10*(1-clamp(a/.22));o.dr=u.r1*20*(1-p);break}
    case 'fly':{const p=clamp(a/.52),e=eBack(p,1.25);o.dx=u.fx*(1-e);o.dy=u.fy*(1-e);o.dr=u.spin*(1-e);o.sx=o.sy=1+1.4*(1-e);o.op=clamp(a/.1);o.bl=6*(1-clamp(a/.3));break}
    case 'drop':{const p=clamp(a/.7);o.ly=-u.h0*(1-eBounce(p));let q=0;
      for(const [c,m] of [[.3636,.34],[.7273,.17],[.9091,.08]])if(p>=c)q=Math.max(q,m*Math.exp(-(p-c)*26));
      o.sy=1-q;o.sx=1+q*.9;o.ly+=u.f*.55*q;o.dr=u.r1*14*(1-p);o.op=clamp(a/.04);break}
    case 'slide':{const p=clamp(a/.32),e=eOutX(p);o.ly=-320*(1-e);o.sy=1+.6*(1-e);o.op=clamp(a/.07);o.bl=8*(1-e);break}
    case 'flip':{const p=clamp(a/.42);o.rx=-110*(1-eBack(p,1.7));o.op=clamp(a/.08);break}
  }
  return o;
}
function exitFx(kind,out,u,t,o){
  const x=t-out;if(x<=0)return;
  if(kind==='explode'){o.dx+=u.vx*x;o.dy+=u.vy*x+1300*x*x;o.dr+=u.spin2*x;o.op*=1-clamp((x-.2)/.3);o.sx*=1+x*.8;o.sy*=1+x*.8}
  else if(kind==='fall'){const y=Math.max(0,x-u.k*.018);o.dy+=1600*y*y-200*y;o.dr+=u.r1*300*y;o.op*=1-clamp((y-.25)/.25)}
  else if(kind==='shutter'){const p=clamp(x/.4);o.dy+=(u.ch%2?1:-1)*1600*eInC(p);o.op*=1-clamp((p-.6)/.4);o.bl+=10*p}
}
const f1=v=>v.toFixed(1),f3=v=>v.toFixed(3);
function applyU(u,o){
  if(o.op!==u.op){u.el.style.opacity=o.op;u.op=o.op}
  u.el.style.transform=`translate(${f1(u.x+o.dx)}px,${f1(u.y+o.dy)}px) rotate(${(u.rot+o.dr).toFixed(2)}deg) translateY(${f1(o.ly)}px)`+
    (o.rx?` perspective(600px) rotateX(${f1(o.rx)}deg)`:'')+(o.ry?` perspective(900px) rotateY(${f1(o.ry)}deg)`:'')+` scale(${f3(o.sx)},${f3(o.sy)})`;
  u.el.style.filter=o.bl>.5?`blur(${f1(o.bl)}px)`:'';
}
function hideU(u){if(u.op!==0){u.el.style.opacity=0;u.op=0}}

/* ---------- camera for cam / spiral scenes ---------- */
function camAt(sc,t){
  const C=sc.chunks;let k=0;for(let j=1;j<C.length;j++)if(t>=C[j].s-.08)k=j;
  const T=j=>({x:C[j].cx,y:C[j].cy,a:-C[j].th,z:C[j].z});
  let cam;
  if(k===0){const p=eOutC(clamp((t-(C[0].s-.2))/.6)),A=T(0);cam={...A,z:A.z*(2.2-1.2*p),a:A.a+(1-p)*(sc.i%2?20:-20),mv:0}}
  else{const p=clamp((t-(C[k].s-.08))/.34),A=T(k-1),B=T(k),e=eIO(p);
    cam={x:lerp(A.x,B.x,e),y:lerp(A.y,B.y,e),a:lerp(A.a,B.a,eBack(p,1.2)),z:lerp(A.z,B.z,e)*(1-.22*Math.sin(Math.PI*p)),mv:Math.sin(Math.PI*p)}}

  const last=C[C.length-1],r0=Math.max(last.s+.55,sc.out-1);
  if(k===C.length-1&&t>r0&&sc.out-r0>.25){
    const p=eIO(clamp((t-r0)/Math.min(.6,sc.out-r0))),B=sc.B,Bp=boxRot(B,cam.a);
    const zo=Math.min(900/(Bp.x1-Bp.x0),1000/(Bp.y1-Bp.y0));
    cam.x=lerp(cam.x,(B.x0+B.x1)/2,p);cam.y=lerp(cam.y,(B.y0+B.y1)/2,p);cam.z=lerp(cam.z,zo,p);
  }
  return cam;
}

/* ---------- scene render ---------- */
function renderScene(sc,t){
  if(t<sc.s-.6||t>sc.out+.6){if(sc.shown){sc.el.style.display='none';sc.shown=false}return}
  if(!sc.shown){sc.el.style.display='';sc.shown=true}
  const x=t-sc.out;
  let tf,op=1,bl=0;
  if(sc.exit==='cam'){
    const c=camAt(sc,t);let z=c.z,a=c.a;
    if(x>0){const e=eInC(clamp(x/.42));z*=1-.75*e;a+=45*e*(sc.i%2?1:-1);op=1-e;bl=12*e}
    tf=`scale(${f3(z)}) rotate(${a.toFixed(2)}deg) translate(${f1(-c.x)}px,${f1(-c.y)}px)`;
  }else{
    const pr=clamp((t-sc.s)/Math.max(.6,sc.out-sc.s));let z=1+.07*pr;
    if(sc.st==='shout')z+=.3*(1-eOutC(clamp((t-sc.s+.1)/.45)));
    tf=`scale(${f3(z)}) rotate(${((sc.i%2?1:-1)*(1.5-3*pr)).toFixed(2)}deg)`;
  }
  sc.el.style.transform=tf;sc.el.style.opacity=op;sc.el.style.filter=bl>.4?`blur(${f1(bl)}px)`:'';
  let ak=0;sc.chunks.forEach((c,k)=>{if(t>=c.s-.05)ak=k});
  if(sc.st==='zoom')sc.chunks.forEach((c,k)=>{ // one chunk at a time, the old one flies past the camera
    const end=k<sc.chunks.length-1?sc.chunks[k+1].s-.04:sc.out,y=t-end;
    if(t<c.s-.3||y>.32){c.g.style.display='none';return}
    c.g.style.display='';
    if(y>0){const p=clamp(y/.3);c.g.style.transform=`scale(${f3(1+4.5*eInC(p))})`;c.g.style.opacity=1-p;c.g.style.filter=`blur(${f1(p*14)}px)`}
    else{c.g.style.transform=`scale(${f3(1+.05*Math.max(0,t-c.s))})`;c.g.style.opacity=1;c.g.style.filter=''}
  });
  for(const u of sc.units){
    const o=entry(u,t);if(!o){hideU(u);continue}
    if(t>u.s+.35){
      // every landed letter bounces on the beat (a wave through the line), the current chunk the most
      const bp=pulse(t-u.k*.025),amp=(u.ch===ak?24:10)*(.6+.4*PAL[SECT[secAt(t)][1]].int);
      o.ly-=amp*bp;if(u.ch===ak){o.sy*=1+.08*bp;o.sx*=1-.05*bp}
      if(sc.fl.has('wind')){o.ly+=8*Math.sin(t*3+u.k);o.dr+=4*Math.sin(t*2.2+u.k*.7)}
      if(u.big){o.dx+=6*nz(t*31,u.k);o.dy+=6*nz(t*29,u.k+5)}
    }
    exitFx(sc.exit,sc.out,u,t,o);
    const now=t>=u.s&&t<u.e+.04;
    if(now!==u.now){u.el.classList.toggle('now',now);u.now=now}
    if(now){o.sx*=1.12;o.sy*=1.12}
    applyU(u,o);
  }
}
function renderTitle(tt,t){
  if(t<tt.a-.1||t>tt.b+.1){if(tt.shown){tt.el.style.display='none';tt.shown=false}return}
  if(!tt.shown){tt.el.style.display='';tt.shown=true}
  const pb=pulse(t),bi=beatIdx(t),g=bi-(bi%8);
  tt.el.style.transform=`scale(${f3(1+.05*Math.sin((t-tt.a)*.6)+.035*pb)}) rotate(${(2.5*Math.sin((t-tt.a)*.45)).toFixed(2)}deg)`;
  for(const u of tt.units){
    const o=entry(u,t);if(!o){hideU(u);continue}
    if(u.big&&t>u.s+.3){
      o.ly-=38*pulse(t-u.k*.05);
      if(g>=0&&BT[g]>u.s+.3)o.ry=360*eIO(clamp((t-BT[g]-u.k*.06)/.55));
      const ol=((bi>>1)+u.k)%2===1;if(ol!==u.ol){u.el.classList.toggle('ol',ol);u.ol=ol}
    }else if(!u.big&&t>u.s+.3)o.ly-=10*pulse(t-u.k*.03);
    exitFx(tt.v===2?'fall':'explode',tt.ex,u,t,o);
    applyU(u,o);
  }
}

const SHAPES=['<circle cx="50" cy="50" r="42"/>','<polygon points="50,6 94,88 6,88"/>','<rect x="10" y="10" width="80" height="80"/>',

function lastImp(t){let lo=0,hi=IMP.length-1,b=-1;while(lo<=hi){const m=(lo+hi)>>1;if(IMP[m].t<=t){b=m;lo=m+1}else hi=m-1}return b}

function renderFx(t,P,A){

      d2.style.transform=`translate(${f1(x)}px,${f1(y)}px) rotate(${f1(rot)}deg) `+(spark?`scale(${f3(.4+.6*h3)},${f3((1.4+1.2*h2)*life)})`:`scale(${f3((.8+.9*h3)*life)})`);

  if(A){const ramp=d=>clamp((t-A.s+.08)/d)*(1-clamp((t-A.out)/.15));if(A.inv)inv=ramp(.08);if(A.fl.has('dawn'))dawn=ramp(.3)}

    sunEl.style.opacity=dawn;sunEl.style.transform=`translateY(${f1(1500-430*eOutC(clamp((t-A.s)/1.4)))}px) scale(${f3(1+.06*pb)})`}
  else{invEl.style.background=rgb(P.hi);invEl.style.opacity=inv;sunEl.style.opacity=0}
  raysEl.style.opacity=Math.min(.45,(P.ray+.25*ab)*(1+en));raysEl.style.transform=`rotate(${f1(t*8)}deg) scale(${f3(1+.12*pb)})`;
  cv.style.setProperty('--ray',inv>.5?'rgba(20,6,20,.9)':'rgba(255,255,255,.9)');
  // marquee of the current key word
  const word=A?A.word:'SURGES';
  if(word!==mqWord){mqWord=word;mqP=em(word+'　')*230;MQ.forEach(d=>d.textContent=(word+'　').repeat(Math.ceil(2600/mqP)+2))}
  MQ.forEach((d,j)=>{const sp=90+45*j,o=(t*sp)%mqP,x=j%2?-o:-mqP+o;d.style.transform=`translate(${f1(x)}px,${160+j*640}px)`;
    d.style.opacity=((.07+.07*pb)*(.6+.4*P.int)).toFixed(3);d.style.webkitTextStrokeColor=inv>.5?'rgba(20,6,20,.9)':''});
  // shapes tick on every beat
  const bi=beatIdx(t),tick=bi<0?0:bi+eOutC(clamp((t-BT[bi])/.18));
  SHP.forEach(({d,x,y},j)=>{d.style.color=rgb(j%2?P.acc:P.acc2);d.style.opacity=((.18+.3*pb)*(.5+.5*P.int)).toFixed(3);
    d.style.transform=`translate(${f1(x+30*Math.sin(t*.4+j))}px,${f1(y+30*Math.cos(t*.33+j*1.3))}px) rotate(${f1(45*tick*(j%2?1:-1)+t*10)}deg) scale(${f3(1+.3*pb)})`});
  // embers for "fire" lines
  let fire=0;if(A&&A.fl.has('fire'))fire=clamp((t-A.s+.1)/.3)*(1-clamp((t-A.out)/.3));
  EMB.forEach((d,j)=>{if(fire<=0){if(d.style.opacity!=='0')d.style.opacity=0;return}
    const sp=180+320*H(j,22),y=1980-((t*sp+H(j,23)*2400)%2400),x=H(j,24)*1080+50*Math.sin(t*2+j);
    d.style.transform=`translate(${f1(x)}px,${f1(y)}px)`;d.style.opacity=(fire*(.4+.6*H(j,25))).toFixed(3)});
}
function renderHud(t,P,A){
  if(A){
    if(koCur!==A){koT.textContent=A.L.ko;koCur=A}
    const p=clamp((t-A.s+.05)/.3),e=eBack(p,1.8),q=clamp((t-A.out)/.2);
    koEl.style.opacity=(p*(1-q)).toFixed(3);koEl.style.transform=`translateY(${f1((1-e)*50)}px) scale(${f3(.85+.15*e)})`;
    koBar.style.transform=`scaleX(${f3(clamp((t-A.s)/(A.e-A.s)))})`;
  }else koEl.style.opacity=0;
  if(A&&A.L.bk){
    if(bkCur!==A){bkJ.textContent=`(${A.L.bk})`;bkK.textContent=`(${A.L.bko})`;bkCur=A}
    const p=clamp((t-A.s-.3)/.4)*(1-clamp((t-A.out)/.2)),pr=clamp((t-A.s)/(A.out-A.s));
    bkEl.style.opacity=p;bkEl.style.transform=`translateX(${f1(70-140*pr)}px) rotate(-3deg)`;
  }else bkEl.style.opacity=0;
  progEl.style.width=(t/D.dur*100).toFixed(2)+'%';
  fadeEl.style.opacity=clamp((t-141.1)/1.3);
}
function render(t){
  const P=palAt(t),pb=pulse(t),en=energy(t),A=activeScene(t);
  cv.style.setProperty('--acc',rgb(P.acc));cv.style.setProperty('--acc2',rgb(P.acc2));cv.style.setProperty('--hi',rgb(P.hi));
  cv.style.setProperty('--txt',rgb(P.txt));cv.style.setProperty('--glow',rgb(P.acc,.55));cv.style.setProperty('--hig',rgb(P.hi,.7));
  bgEl.style.background=`radial-gradient(ellipse 110% 75% at 50% ${f1(40+5*Math.sin(t*.4))}%,${rgb(mix(P.b1.map(v=>v*(.75+.6*en)),P.acc,.1*pb))} 0%,${rgb(P.b2)} 78%)`;
  for(const sc of S)renderScene(sc,t);
  for(const tt of TT)renderTitle(tt,t);
  renderFx(t,P,A);
  renderHud(t,P,A);
}

/* ---------- boot ---------- */
const ALL=D.lines.map(L=>L.w.map(w=>w[0]).join('')+(L.bk||'')).join('')+'SURGESおとなりモンスター歌ってみた　()';
const KO=D.lines.map(L=>L.ko+(L.bko||'')).join('')+'()';
window.DUR=D.dur;
window.READY=(async()=>{
  try{await Promise.all([document.fonts.load('900 100px "Noto Sans JP"',ALL),document.fonts.load('700 46px "Noto Sans KR"',KO)])}catch(e){console.warn(e)}
  S=D.lines.map(makeScene);
  TT=[[50.6,62.75,0],[85.6,97.45,1],[120.6,142.5,2]].map(([a,b,v])=>makeTitle(a,b,v));
  buildImpacts();buildFx();
  window.renderAt=render;render(0);
})();

if(new URLSearchParams(location.search).has('render'))document.body.classList.add('render');
else{
  const au=$('au'),pp=$('pp');
  const loop=()=>{render(au.currentTime);$('fill').style.width=(au.currentTime/D.dur*100)+'%';
    $('time').textContent=Math.floor(au.currentTime/60)+':'+String(Math.floor(au.currentTime%60)).padStart(2,'0');requestAnimationFrame(loop)};
  pp.onclick=()=>{au.paused?au.play():au.pause()};au.onplay=()=>pp.textContent='❚❚';au.onpause=()=>pp.textContent='▶';
  $('bar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();au.currentTime=(e.clientX-r.left)/r.width*D.dur};
  document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pp.click()}if(e.code==='ArrowRight')au.currentTime+=5;if(e.code==='ArrowLeft')au.currentTime-=5});
  READY.then(()=>requestAnimationFrame(loop));
}
</script>

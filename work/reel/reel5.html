<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:BHS;src:url(fonts/bhs.ttf)}
@font-face{font-family:NSK;font-weight:400;src:url(fonts/nsk400.ttf)}
@font-face{font-family:NSK;font-weight:700;src:url(fonts/nsk700.ttf)}
:root{--p:#85499b;--c:#19b4e6;--y:#ffe14a;--k:#16141a}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff;font-family:NSK,sans-serif;color:var(--k)}
#root{position:absolute;inset:0;overflow:hidden;background:#fff}
.scene{position:absolute;inset:0;display:none}
.abs{position:absolute}
.tag{left:80px;right:80px;top:250px;display:flex;justify-content:space-between;font-weight:700;font-size:38px;color:var(--p);letter-spacing:.02em}
.frame{left:80px;top:340px;width:920px;height:575px;border:16px solid var(--p);overflow:hidden;background:#000}
.frame img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.title{left:80px;right:80px;top:960px;font-family:BHS;color:var(--p);line-height:1.08;white-space:nowrap}
.title .ln{display:block}
.title .ch{display:inline-block;white-space:pre;will-change:transform}
.sub{left:80px;top:1250px;font-size:36px;color:#7a7683;font-weight:400}
.pills{left:80px;top:1318px;display:flex;gap:14px}
.pill{font-weight:700;font-size:34px;border:3px solid var(--k);border-radius:999px;padding:6px 26px}
.cred{left:80px;top:1420px;font-size:40px;line-height:1.5;font-weight:400}
.cred b{font-weight:700}
.gv{line-height:1.4;left:80px;top:1580px;background:var(--p);color:#fff;font-weight:700;font-size:34px;padding:10px 24px}
.dots{left:0;right:0;top:215px;display:flex;justify-content:center;gap:14px}
.dot{width:14px;height:14px;border-radius:50%;background:#e8e4ec}
#wipe{position:absolute;inset:0;background:var(--p);z-index:50;transform:translateX(-101%)}
#wipe2{position:absolute;inset:0;background:var(--k);z-index:49;transform:translateX(-101%)}
#grain{position:absolute;inset:0;z-index:60;pointer-events:none;mix-blend-mode:multiply;opacity:.10}
/* intro */
#intro{background:#fff}
#posterbg{left:-130px;top:0;width:1340px;height:1920px;object-fit:cover}
.card{left:70px;right:70px;background:#fff;padding:30px 34px}
.big{font-family:BHS;color:var(--p);line-height:1.05}
.bar{display:inline-block;background:var(--p);color:#fff;font-weight:700;padding:6px 22px}
/* outro */
#outro{background:var(--p);color:#fff}
.o1{font-family:BHS;font-size:200px;line-height:1}
.li{font-size:42px;font-weight:700;line-height:1.55}
.li i{font-style:normal;font-family:BHS;opacity:.6;margin-right:18px}
</style></head><body>
<div id="root">
 <div id="intro" class="scene"></div>
 <div id="f1" class="scene film"></div>
 <div id="f2" class="scene film"></div>
 <div id="f3" class="scene film"></div>
 <div id="outro" class="scene"></div>
 <div id="wipe2"></div><div id="wipe"></div>
 <svg id="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.2"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-x,3);
const eb=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const rnd=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
const T=[0,3.4,8.2,13.0,17.8,22.2];   // scene boundaries; total 22.2s
const FILMS=[
 {id:'f1',img:'img/w1.png',lines:['초풍'],size:[300],en:'Electric Wind God Fist · 2025',pills:['코미디','28분'],dir:'이건희',cast:'김동하 · 최장천 · 윤영훈 · 한현준',n:1,pan:[-1,0]},
 {id:'f2',img:'img/w2.png',lines:['블랙홀을 여행하는','메탈밴드를 위한','안내서'],size:[98,98,98],en:"The Metal Band's Guide to the Black Hole · 2024",pills:['음악','판타지','코미디','26분'],dir:'전아현',cast:'아이언퍼피 · 장요훈 · 설준수 · 이성하 · Xavier Liaudet',cs:32,n:2,pan:[1,0]},
 {id:'f3',img:'img/w3.png',lines:['렙틸리언에 관한','짧은 수다'],size:[112,112],en:'Small talk about the Reptilian · 2026',pills:['SF','판타지','18분'],dir:'이지유',cast:'김연교 · 성환',n:3,pan:[0,-1]},
];
const GVTXT='10.25 일 16:30<br>GV 이건희, 전아현 감독, 장요훈, 설준수, 이성하 배우';

/* ---------- build ---------- */
const chars=[];            // {el,scene,k}
FILMS.forEach(f=>{
  const s=document.getElementById(f.id);
  const dots=[1,2,3].map(i=>`<div class="dot" data-i="${i}"></div>`).join('');
  s.innerHTML=`
   <div class="abs dots">${dots}</div>
   <div class="abs tag"><span>단편 × 장르 = 세상이 이상해</span><span>${String(f.n).padStart(2,'0')} / 03</span></div>
   <div class="abs frame"><img src="${f.img}"></div>
   <div class="abs title"></div>
   <div class="abs sub">${f.en}</div>
   <div class="abs pills">${f.pills.map(p=>`<span class="pill">${p}</span>`).join('')}</div>
   <div class="abs cred"${f.cs?` style="font-size:${f.cs}px"`:''}><b>감독</b>&nbsp;&nbsp;${f.dir}${f.cast?`<br><b>출연</b>&nbsp;&nbsp;${f.cast}`:''}</div>
   <div class="abs gv">${GVTXT}</div>`;
  const tt=s.querySelector('.title');let k=0;
  f.lines.forEach((ln,li)=>{
    const d=document.createElement('span');d.className='ln';d.style.fontSize=f.size[li]+'px';
    [...ln].forEach(c=>{const sp=document.createElement('span');sp.className='ch';sp.textContent=c;d.appendChild(sp);chars.push({el:sp,scene:f.id,k:k++})});
    tt.appendChild(d);
  });
  // position sub block under title: title height depends on lines
  const th=f.lines.reduce((a,_,i)=>a+f.size[i]*1.08,0);
  const base=960+th+10;
  s.querySelector('.sub').style.top=base+'px';
  s.querySelector('.pills').style.top=(base+66)+'px';
  s.querySelector('.cred').style.top=(base+160)+'px';
  s.querySelector('.gv').style.top=Math.max(base+330,1590)+'px';
});

document.getElementById('intro').innerHTML=`
  <div id="posterbg" class="abs" style="left:-130px;top:0;width:1340px;height:1920px;background:#16141a"><img src="img/w1.png" style="width:100%;height:640px;object-fit:cover;display:block"><img src="img/w2.png" style="width:100%;height:640px;object-fit:cover;display:block"><img src="img/w3.png" style="width:100%;height:640px;object-fit:cover;display:block"></div>
  <div class="abs card" id="ic1" style="top:980px"><div class="bar" style="font-size:76px;font-family:BHS;font-weight:400">10.25 일 16:30</div></div>
  <div class="abs card" id="ic2" style="top:1160px"><div class="big" style="font-size:112px">단편 × 장르</div><div class="big" style="font-size:112px;white-space:nowrap">= 세상이 이상해</div></div>
  <div class="abs" id="ic3" style="left:70px;top:1560px"><span class="bar" style="font-size:40px;background:#16141a">2026 오오극장 관객프로그래머 영화제</span></div>`;

document.getElementById('outro').innerHTML=`
  <div class="abs" id="o0" style="left:80px;top:260px;font-weight:700;font-size:46px">단편 × 장르 = 세상이 이상해</div>
  <div class="abs o1" id="o1" style="left:76px;top:330px">10.25 일<br>16:30</div>
  <div class="abs" id="o2" style="left:80px;top:790px;font-weight:700;font-size:54px;line-height:1.4">오오극장<br><span style="background:#fff;color:var(--p);padding:2px 18px;display:inline-block;margin-top:6px">GV 이건희, 전아현 감독<br>장요훈, 설준수, 이성하 배우</span></div>
  <div class="abs li" id="o3" style="left:80px;top:1130px">
   <div class="r"><i>01</i>초풍</div>
   <div class="r"><i>02</i>블랙홀을 여행하는 메탈밴드를 위한 안내서</div>
   <div class="r"><i>03</i>렙틸리언에 관한 짧은 수다</div></div>
  <div class="abs" id="o4" style="left:80px;top:1560px;font-size:34px;line-height:1.6;font-weight:400;opacity:.92">2026 오오극장 관객프로그래머 영화제 · 10.24 토 – 10.25 일<br>주최 대구경북영화영상사회적협동조합<br>주관 오오극장 관객프로그래머</div>`;

/* ---------- render ---------- */
const sc={intro:document.getElementById('intro'),f1:document.getElementById('f1'),f2:document.getElementById('f2'),f3:document.getElementById('f3'),outro:document.getElementById('outro')};
const order=['intro','f1','f2','f3','outro'];
const wipe=document.getElementById('wipe'),wipe2=document.getElementById('wipe2');
function fade(el,lt,t0,d=.4,dy=30){const p=eo(clamp((lt-t0)/d));el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dy}px)`}

function render(t){
  // which scene
  let si=0;for(let i=0;i<order.length;i++)if(t>=T[i])si=i;
  order.forEach((k,i)=>sc[k].style.display=i===si?'block':'none');
  const lt=t-T[si],id=order[si];
  // wipes: cover at each inner boundary
  let wx=-101,w2=-101;
  for(let i=1;i<order.length;i++){const b=T[i];
    if(t>=b-.28&&t<b){wx=-100+eo((t-(b-.28))/.28)*100;w2=-100+eo(clamp((t-(b-.28)-.06)/.28))*100}
    else if(t>=b&&t<b+.3){wx=eo((t-b)/.3)*101;w2=eo(clamp((t-b-.06)/.3))*101}}
  wipe.style.transform=`translateX(${wx}%)`;wipe2.style.transform=`translateX(${w2}%)`;

  if(id==='intro'){
    const bg=document.getElementById('posterbg');
    const s=1.22-.22*eo(clamp(lt/1.4));
    bg.style.transform=`scale(${s}) rotate(${(1-eo(clamp(lt/1.4)))*-4}deg)`;
    // misregistration glitch flicker in first 0.6s
    const g=lt<.7?Math.floor(lt*30):0;
    bg.style.filter=lt<.7&&g%3===0?`hue-rotate(${rnd(g)*60}deg)`:'none';
    bg.style.left=(-130+(lt<.7?(rnd(g+1)-.5)*30:0))+'px';
    ['ic1','ic2','ic3'].forEach((k,i)=>{const e=document.getElementById(k);
      const p=eb(clamp((lt-.55-i*.25)/.5));e.style.opacity=clamp((lt-.55-i*.25)/.15);
      e.style.transform=`translateX(${(1-p)*-900}px)`});
  }else if(id==='outro'){
    ['o0','o1','o2','o3','o4'].forEach((k,i)=>{
      const e=document.getElementById(k);
      if(k==='o3'){[...e.children].forEach((r,j)=>fade(r,lt,.9+j*.18,.4,40))}
      else fade(e,lt,.1+i*.18,.45,50)});
    const o1=document.getElementById('o1');
    o1.style.transform+=` scale(${1+.03*Math.sin(lt*6)})`;o1.style.transformOrigin='0 50%';
  }else{
    const f=FILMS.find(x=>x.id===id),s=sc[id];
    // dots
    s.querySelectorAll('.dot').forEach(d=>{const on=+d.dataset.i===f.n;d.style.background=on?'var(--p)':'#e8e4ec';d.style.width=on?'44px':'14px';d.style.borderRadius='7px'});
    fade(s.querySelector('.tag'),lt,.05,.35,-20);
    // frame clip reveal + ken burns
    const fr=s.querySelector('.frame'),im=fr.querySelector('img');
    const rv=eo(clamp((lt-.1)/.55));fr.style.clipPath=`inset(0 ${(1-rv)*100}% 0 0)`;
    const kb=clamp(lt/(T[si+1]-T[si]));
    const zoom=1.04+.13*kb;
    im.style.transform=`scale(${zoom}) translate(${f.pan[0]*-14*kb}px,${f.pan[1]*-10*kb}px)`;
    // title chars
    const base=.5;
    chars.filter(c=>c.scene===id).forEach(c=>{
      const p=clamp((lt-base-c.k*.07)/.5),e=eb(p);
      const jit=p<1?(rnd(c.k*7+Math.floor(lt*24))-.5)*8*(1-p):0;
      c.el.style.opacity=clamp(p*4);
      c.el.style.transform=`translate(${jit}px,${(1-e)*120}px) scale(${.3+.7*e}) rotate(${(1-e)*(c.k%2?14:-14)}deg)`;
      // CMYK misregistration echo
      const o=3+3*(1-eo(p))*4;
      c.el.style.textShadow=`${o}px ${o*.5}px 0 rgba(255,150,60,.5), ${-o*.7}px ${o*.6}px 0 rgba(255,214,90,.7)`;
    });
    fade(s.querySelector('.sub'),lt,1.15,.4,24);
    s.querySelectorAll('.pill').forEach((p,i)=>fade(p,lt,1.3+i*.1,.35,24));
    fade(s.querySelector('.cred'),lt,1.55,.45,24);
    const gv=s.querySelector('.gv');const gp=eo(clamp((lt-1.9)/.4));gv.style.opacity=gp;gv.style.clipPath=`inset(0 ${(1-gp)*100}% 0 0)`;
  }
}
window.render=render;render(0);
</script></body></html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surges Kinetic Lyrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a12;--fg:#f4f1ff;--dim:#5b5670;--a1:#ff3d7f;--a2:#3de0ff;--a3:#ffd23d}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:"Zen Kaku Gothic New",sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;perspective:900px}
#ring{position:absolute;width:60vmin;height:60vmin;border-radius:50%;border:2px solid var(--a1);opacity:0;pointer-events:none}
#ring.hit{animation:ring .5s ease-out}
@keyframes ring{from{transform:scale(.6);opacity:.55}to{transform:scale(1.6);opacity:0}}
#flash{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,61,127,.18),transparent 60%);opacity:0;transition:opacity .25s}
#line{position:relative;max-width:88vw;text-align:center;line-height:1.25;font-family:"Dela Gothic One",sans-serif;font-size:clamp(28px,7vw,92px);transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.9,.2,1)}
#line.out{animation:out .45s forwards cubic-bezier(.6,0,.8,.4)}
@keyframes out{to{opacity:0;filter:blur(12px);transform:translateY(-40px) scale(1.1)}}
.w{display:inline-block;opacity:0;transform:translateY(.6em) scale(.4) rotate(var(--r,0deg));filter:blur(8px);transition:opacity .12s,transform .38s cubic-bezier(.2,1.6,.4,1),filter .2s,color .3s}
.w.on{opacity:1;transform:none;filter:none}
.w.now{color:var(--a3);text-shadow:0 0 24px rgba(255,210,61,.6)}
.w.key{color:var(--a1);font-size:1.35em}
.v1 .w{--r:-18deg}.v2 .w{transform:translateX(-1.2em) skewX(-20deg);}
.v3 .w{transform:translateZ(300px) scale(2.2)}
.v1 .w.on,.v2 .w.on,.v3 .w.on{transform:none}
#gap{position:absolute;font-family:"Dela Gothic One";font-size:clamp(40px,14vw,200px);color:transparent;-webkit-text-stroke:1.5px var(--dim);opacity:0;transition:opacity .8s;letter-spacing:.1em}
#gap.show{opacity:1}
#ui{position:fixed;left:16px;right:16px;bottom:16px;display:flex;gap:12px;align-items:center;font:13px/1 system-ui;color:var(--dim)}
#ui button{background:var(--a1);color:#fff;border:0;border-radius:999px;width:44px;height:44px;font-size:18px;cursor:pointer;flex:none}
#bar{flex:1;height:6px;background:#221f30;border-radius:3px;position:relative;cursor:pointer}
#fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--a2),var(--a1));border-radius:3px}
#pick{position:fixed;top:16px;right:16px;font:12px system-ui;color:var(--dim)}
#pick input{display:none}#pick label{cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div id="stage"><div id="flash"></div><div id="ring"></div><div id="gap">SURGES</div><div id="line"></div></div>
<div id="pick"><label>음원 다시 선택<input type="file" accept="audio/*" id="file"></label></div>
<div id="ui"><button id="pp">▶</button><div id="bar"><div id="fill"></div></div><span id="time">0:00</span></div>
<audio id="au" src="song.m4a" preload="auto"></audio>
<script>
const D=/*DATA*/null;
const KEY=/最高|未来|燃え|心|空|明日|日常|上等|夜明け/;
const au=document.getElementById('au'),lineEl=document.getElementById('line'),gap=document.getElementById('gap'),
ring=document.getElementById('ring'),flash=document.getElementById('flash'),fill=document.getElementById('fill'),tm=document.getElementById('time');
let cur=-1,spans=[],bi=0;
function build(i){
  const L=D.lines[i];lineEl.className='v'+(i%4);lineEl.innerHTML='';
  lineEl.style.transform=`rotate(${[0,-3,2,-1][i%4]}deg) translateY(${[0,-4,3,-2][i%4]}vh)`;
  spans=L.w.map(([t])=>{const s=document.createElement('span');s.className='w'+(KEY.test(t)?' key':'');s.textContent=t;lineEl.appendChild(s);return s});
  // mark multi-token keywords
  const txt=L.w.map(w=>w[0]).join('');let m,re=new RegExp(KEY.source,'g');
  while((m=re.exec(txt))){let p=0;L.w.forEach((w,k)=>{const a=p,b=p+w[0].length;if(b>m.index&&a<m.index+m[0].length)spans[k].classList.add('key');p=b})}
}
function lineAt(t){for(let i=D.lines.length-1;i>=0;i--){const L=D.lines[i];if(t>=L.s-0.05)return t<L.e+0.8?i:-1}return -1}
function tick(){
  const t=au.currentTime,i=lineAt(t);
  if(i!==cur){
    if(i<0){lineEl.classList.add('out')}else{build(i)}
    cur=i;gap.classList.toggle('show',i<0);
  }
  if(i>=0){const W=D.lines[i].w;W.forEach(([,s,e],k)=>{spans[k].classList.toggle('on',t>=s);spans[k].classList.toggle('now',t>=s&&t<e+.05)})}
  while(bi<D.beats.length&&D.beats[bi]<t){if(t-D.beats[bi]<.1&&!au.paused){ring.classList.remove('hit');void ring.offsetWidth;ring.classList.add('hit');flash.style.opacity=1;setTimeout(()=>flash.style.opacity=0,90)}bi++}
  fill.style.width=(t/(au.duration||1)*100)+'%';tm.textContent=Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
  requestAnimationFrame(tick);
}
au.addEventListener('seeked',()=>{bi=D.beats.findIndex(b=>b>=au.currentTime);if(bi<0)bi=D.beats.length;cur=-2});
document.getElementById('pp').onclick=()=>{au.paused?au.play():au.pause()};
au.onplay=()=>pp.textContent='❚❚';au.onpause=()=>pp.textContent='▶';
document.getElementById('bar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();au.currentTime=(e.clientX-r.left)/r.width*au.duration};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pp.click()}if(e.code==='ArrowRight')au.currentTime+=5;if(e.code==='ArrowLeft')au.currentTime-=5});
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(f){au.src=URL.createObjectURL(f);au.play()}};
requestAnimationFrame(tick);
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ashita Night Flight</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;300;600&family=Noto+Sans+JP:wght@300;700;900&family=Noto+Sans+KR:wght@300;700&display=swap" rel="stylesheet">
<style>*{margin:0}html,body{height:100%;background:#000;overflow:hidden}#cv{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:0 0}</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<script src="../shared/cine.js"></script>
<script>
/* 明日の夜空哨戒班 — one continuous night flight (single camera path, no cuts) */
const D=/*DATA*/null;
CINE.init(document.getElementById('cv'),D);
ACC='#8FE3FF';const ORG='#FFB547';B0=1.24%BEAT;
const L=i=>Ln[i];
// ---------- the one camera path (absolute time, world coords; up = negative y) ----------
const K=[
 [0,   -80,-260,1.18,.0],
 [T(0,0),0,-280,1.15,.0],
 [T(4,0),520,-360,1.12,.02],          // drifting along the rooftop through the verse
 [T(7,0)-.3,640,-980,1.2,.0,eIOs],     // pre-chorus: tilt up toward the moon
 [T(8,0),640,-1000,1.28,-.03],         // the shout
 [T(9,0),600,-820,.95,.0],             // the world leaves me behind (pull back)
 [T(10,0),600,-760,.98,.0],
 [T(11,4)-.1,600,-880,1.1,.0],         // "that night was different": slow push, stillness
 [T(11,4)+.2,600,-1000,1.12,.0,eInC],  // the hands touch -> lift-off
 [T(13,0),900,-3300,1.0,-.06,eIO],     // through the clouds
 [T(14,0),1500,-4300,1.02,.0],         // above the clouds, the leading star ahead
 [T(18,0),3600,-4700,1.04,.04],
 [61,4400,-4800,1.0,-.02],
 [66,6200,-5000,1.06,.14],             // instrumental: the chase — banking left and right
 [70,8200,-4600,1.0,-.16],
 [74,10200,-5100,1.08,.12],
 [77.5,11400,-4900,.94,0],             // break: we hover over the sea of clouds
 [85.2,11800,-4900,.9,.0],
 [98,13600,-4200,1.0,-.04],            // verse 2: gliding down toward the cloud tops
 [105.3,14600,-3900,1.02,.03],
 [108,16200,-3200,1.0,-.1],            // fast section: diving in and out of the clouds
 [111,17800,-3900,1.04,.1],
 [115,19400,-3100,1.0,-.12],
 [118.8,21000,-3800,1.06,.08],
 [123.8,22200,-4400,1.0,0],            // "you said it" — climbing back above the clouds
 [128.8,23000,-4600,1.0,0],
 [132,25200,-4900,1.04,-.08,eInC],     // climax: the flight accelerates
 [135,27600,-5300,1.0,.1],
 [138.8,30400,-5600,1.06,-.08],
 [143.8,33400,-6600,1.02,.08],         // Sky Arrow: the steep climb into the dawn
 [147.4,36000,-7200,1.06,-.06],
 [152.5,38600,-7900,1.1,.02],
 [165,39400,-8200,.86,0],              // the vocalise: pull back over the dawn
 [180,39800,-8300,.8,0]];
function cam(t){const c=camAt(K,t);return {x:c[1],y:c[2],z:c[3],r:c[4]}}
function camVel(t){const a=cam(t-.04),b=cam(t+.04);return {x:(b.x-a.x)/.08,y:(b.y-a.y)/.08}}
// ---------- world ----------
let DK=0;
function skyAt(t){const alt=clamp(-CAM.y/4600);DK=eIO(P(t,T(37,3)-1,6));const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,mix(mix('#070B26','#03051A',alt),'#1B1F5C',DK));gr.addColorStop(.6,mix(mix('#101A55','#0A0F33',alt),'#7A4F8C',DK));gr.addColorStop(1,mix(mix('#26306E','#1B2560',alt),'#F29A7A',DK));g.fillStyle=gr;g.fillRect(0,0,W,H);
  if(DK>0){const sun=g.createRadialGradient(CX,H+120,40,CX,H+120,1100);sun.addColorStop(0,`rgba(255,236,214,${.75*DK})`);sun.addColorStop(.3,`rgba(255,160,90,${.6*DK})`);sun.addColorStop(1,'rgba(255,181,71,0)');g.fillStyle=sun;g.fillRect(0,H-1100,W,1100+120)}}
function moonLayer(t){ // far layer; the moon sinks during "月は沈み", the sky warms at "陽は昇る"
  const s0=T(9,1),set=eIO(P(t,s0,1.8)),rise=eIO(P(t,T(9,4),2.2))*(1-P(t,T(11,4)+1,3));
  layer(.08,()=>{const mx=780,my=lerp(-1900,-400,set);const gl=g.createRadialGradient(mx,my,80,mx,my,420);gl.addColorStop(0,`rgba(220,235,255,${.35*(1-set)})`);gl.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gl;g.fillRect(mx-420,my-420,840,840);g.globalAlpha=1-clamp((set-.85)/.15);g.fillStyle='#EAF2FF';g.beginPath();g.arc(mx,my,110,0,7);g.fill();g.globalAlpha=1;
    if(rise>0){const gl2=g.createRadialGradient(200,-150,20,200,-150,1100);gl2.addColorStop(0,rgba(ORG,.45*rise));gl2.addColorStop(1,rgba(ORG,0));g.fillStyle=gl2;g.fillRect(-900,-1250,2200,2200)}});
}
function city(t){ // skyline far and near; the rooftop the camera starts on
  for(const [pf,col,seed,base] of [[.45,'#070A26',3,200],[.75,'#04061A',7,120]])layer(pf,()=>{g.fillStyle=col;g.beginPath();g.moveTo(-2600,base+3000);g.lineTo(-2600,base);let x=-2600;while(x<5200){const w=50+100*R(Math.floor(x),seed),h=80+320*R(Math.floor(x),seed+1)**2;g.lineTo(x,base-h);g.lineTo(x+w,base-h);x+=w}g.lineTo(5200,base+3000);g.fill();
    for(let k=0;k<260;k++){if(R(k,seed+5)>.5)continue;g.fillStyle=`rgba(255,${200+40*R(k,9)|0},140,${.3+.4*R(k,8)*(.7+.3*Math.sin(t*.7+k))})`;g.fillRect(-2600+R(k,seed+6)*7800,base-20-R(k,seed+7)*300,5,6)}});
  layer(1,()=>{g.fillStyle='#02030E';g.fillRect(-1200,0,4000,1600);g.strokeStyle=rgba(ACC,.3);g.lineWidth=3;g.beginPath();g.moveTo(-1200,0);g.lineTo(2800,0);g.stroke();
    for(let k=0;k<8;k++){const x=-600+k*380;g.fillStyle='#050716';g.fillRect(x,-70,10,70);g.fillRect(x-60,-74,130,8)}});
}
function clouds(t,pf,y0,a,col,seed,scale){if(a<=0)return;layer(pf,()=>{for(let k=0;k<26;k++){const x=-800+R(k,seed)*6800,y=y0+(R(k,seed+2)-.5)*420,rx=(260+360*R(k,seed+3))*scale,ry=rx*.26;const gl=g.createRadialGradient(x,y,0,x,y,rx);gl.addColorStop(0,rgba(col,a*(.45+.45*R(k,seed+4))));gl.addColorStop(1,rgba(col,0));g.save();g.translate(x,y);g.scale(1,ry/rx);g.fillStyle=gl;g.beginPath();g.arc(0,0,rx,0,7);g.fill();g.restore()}})}
function windLines(t,v){const sp=Math.hypot(v.x,v.y);const a=clamp((sp-300)/2200);if(a<=0)return;const ang=Math.atan2(-v.y,-v.x);g.save();g.globalCompositeOperation='lighter';
  for(let k=0;k<70;k++){const ph=(t*1.8+R(k,40))%1,x=R(k,41)*W,y=R(k,42)*H,l=(120+500*R(k,43))*a;const px=x+Math.cos(ang)*ph*900,py=y+Math.sin(ang)*ph*900;g.strokeStyle=rgba(ACC,a*(.15+.45*R(k,44))*Math.sin(ph*Math.PI));g.lineWidth=1+2.5*R(k,45);g.beginPath();g.moveTo(px,py);g.lineTo(px+Math.cos(ang)*l,py+Math.sin(ang)*l);g.stroke()}g.restore()}
// the two lights: mine (cyan) and yours (orange). Before the touch they approach; afterwards they fly
// like a pair of fighters — helixes, crossings, loops, chases — sampled as trails from the same function.
const SEG=[ // [t0, mode] ; modes blend over 1.2 s
 [0,'helix'],[37.1,'weave'],[58,'dogfight'],[64.2,'write'],[70.8,'dogfight'],[77.5,'hover'],[85.2,'weave'],[105.3,'chase'],[123.8,'weave'],[136.5,'merge'],[138.8,'arrow'],[143.8,'helix'],[152.5,'dogfight'],[165,'hover']];
function modePos(m,t,who){const s=who?1:-1,ph=who?Math.PI:0;
  switch(m){
    case 'helix':{const w=3.2*(1+1.2*BOOST(t));return {x:Math.cos(w*t+ph)*260,y:-420+Math.sin(w*2*t)*40,z:Math.sin(w*t+ph)}}
    case 'weave':{const w=1.6;return {x:Math.sin(w*t+ph*.6)*380,y:-380+Math.sin(2*w*t+who)*220,z:Math.cos(w*t+ph*.6)}}
    case 'dogfight':{const w=2.1,a={x:Math.sin(w*t)*420+Math.sin(3.7*t)*160,y:-300+Math.sin(1.3*w*t)*380+Math.cos(2.9*t)*120};
      if(!who)return {...a,z:Math.sin(2.3*t)};const d=.38,b={x:Math.sin(w*(t-d))*420+Math.sin(3.7*(t-d))*160,y:-300+Math.sin(1.3*w*(t-d))*380+Math.cos(2.9*(t-d))*120};
      return {x:b.x+Math.cos(6*t)*90,y:b.y+Math.sin(6*t)*90,z:Math.cos(2.3*t)}}
    case 'chase':{const w=2.8;return {x:Math.sin(w*t+who*.9)*360+s*60,y:-200+Math.sin(w*1.7*t+who)*320,z:Math.sin(w*t)}}
    case 'write':{const p=clamp((t-64.4)/5.8);return {x:lerp(-360,360,p)+(who?18:-18),y:-520+Math.sin(t*11+who*2)*120+(who?30:-30),z:0}}
    case 'hover':{return {x:s*140+Math.sin(t*.7+who)*50,y:-420+Math.cos(t*.9+who)*40,z:0}}
    case 'merge':{return {x:s*18+Math.sin(t*4)*6,y:-420,z:0}}
    case 'arrow':{const p=clamp((t-138.8)/2.5);return {x:lerp(-360,420,eIOs(p))+s*14,y:lerp(300,-760,eIOs(p))+s*10,z:0}}
  }}
function pairPos(t,who){let k=0;for(let j=0;j<SEG.length;j++)if(t>=SEG[j][0])k=j;const cur=modePos(SEG[k][1],t,who);if(k===0)return cur;
  const bl=eIOs(clamp((t-SEG[k][0])/1.2));if(bl>=1)return cur;const prev=modePos(SEG[k-1][1],t,who);return {x:lerp(prev.x,cur.x,bl),y:lerp(prev.y,cur.y,bl),z:lerp(prev.z,cur.z,bl)}}
function lights(t){const a=t-T(11,0),touch=T(11,4);if(a<-.3)return;
  if(t<touch){const p=eIO(clamp((t-T(11,0))/(touch-T(11,0))));layer(1,()=>{const y=-880;flare(lerp(170,560,p),y,6+2*pulse(t),rgba(ACC,.9),clamp((a+.3)/.4));flare(lerp(1030,640,p),y,6+2*pulse(t),rgba(ORG,.9),clamp((a+.3)/.4));
    g.strokeStyle=rgba('#FFFFFF',.35*p);g.lineWidth=2;g.beginPath();g.moveTo(lerp(170,560,p),y);g.quadraticCurveTo(600,y-120*p,lerp(1030,640,p),y);g.stroke()});return}
  const b=t-touch;if(b<.5){g.fillStyle=`rgba(255,255,255,${.8*(1-b/.5)})`;g.fillRect(0,0,W,H)}
  const fade=(1-P(t,168,4))*LA(t);if(fade<=0)return;const rise=eOutC(clamp(b/.8));
  g.save();g.globalCompositeOperation='lighter';
  for(const who of [0,1]){const col=who?ORG:ACC;let prev=null;
    for(let k=0;k<=36;k++){const tt=t-k*.028;if(tt<touch)break;const p=pairPos(tt,who),sc=1+.25*p.z,x=CX+p.x*rise,y=CY+p.y*rise+k*14;   // trail streams back as we fly
      if(prev){g.strokeStyle=rgba(col,.55*(1-k/36)*fade);g.lineWidth=(7*(1-k/36)+1)*sc;g.beginPath();g.moveTo(prev[0],prev[1]);g.lineTo(x,y);g.stroke()}prev=[x,y]}}
  g.restore();
  const A=pairPos(t,0),Bp=pairPos(t,1);for(const [p,col] of [[A,ACC],[Bp,ORG]])flare(CX+p.x*rise,CY+p.y*rise,(5+2*p.z)*(1+.3*pulse(t)),rgba(col,.95),fade,.8+.3*p.z);
  const d=Math.hypot(A.x-Bp.x,A.y-Bp.y);if(d<70){const q=1-d/70;flare(CX+(A.x+Bp.x)/2*rise,CY+(A.y+Bp.y)/2*rise,10*q,'rgba(255,255,255,.9)',q*fade,1.2)}}
// the leading star (魁星) waits above the clouds and then leads the way
function leadStar(t){const a=t-T(13,4)+.6;if(a<0)return;layer(1,()=>{const c=cam(t);const x=c.x+320*Math.sin(t*.23+1)+Math.sin(t*.8)*80,y=c.y-560+220*Math.cos(t*.19)+Math.cos(t*.6)*40;
  for(let k=0;k<40;k++){const q=k/40;g.fillStyle=rgba(ORG,.45*(1-q)*clamp(a/.8)*(1-DK)*LA(t));g.beginPath();g.arc(x-q*700,y+q*260,14*(1-q)+2,0,7);g.fill()}flare(x,y,12+3*pulse(t),rgba(ORG,.95),clamp(a/.6)*(1-DK)*LA(t),1.4)})}
// ---------- painted plates (generated scene art, plates/*.webp) under the code layers ----------
// Every scene is a stack of plates [id, parallax, opts] that drift with the one camera path (clamped so
// the edges never show, or tiled with opts.wrap), crossfading at t0 over f seconds. Scenes whose plates
// are missing fall back to the code-drawn world, so the page renders with or without art.
const PL={img:{},off:/noplates/.test(location.search)};
const PIDS=['s01_sky','s01_city','s01_roof','s02_sky','s02_roof','s04_hands','cl_mid','cl_near','s06_sea','s07_rain','s09_city','s10_glass','s11_dawn','cl_dawn','s12_sky','s12_roof'];
const has=id=>!!PL.img[id];
const SHATTER=L(33).s-.03;
const SC=[
 {n:'roof',t0:0,f:0,L:[['s01_sky',.08],['s01_city',.3],['s01_roof',.75]]},
 {n:'clock',t0:T(4,0)-.6,f:1.4,L:[['s02_sky',.1],['s02_roof',.7]]},
 {n:'lapse',t0:T(8,0)-.4,f:1.2,op:0,L:[['s01_city',.3],['s02_roof',.7]]},          // code sky runs the moon-set / sunrise
 {n:'hands',t0:T(11,0)-.5,f:.9,L:[['s04_hands',.2,{push:.1}]]},
 {n:'rise',t0:T(11,4)+.05,f:0,op:0,L:[['cl_mid',.5,{wrap:'y'}],['cl_near',.9,{wrap:'y',a:.8}]]},
 {n:'sea',t0:T(13,2),f:1.6,L:[['s06_sea',.12,{wrap:'x',mirror:1}],['cl_near',1.1,{wrap:'x',a:.45,over:1}]]},
 {n:'rain',t0:84.4,f:1.6,L:[['s07_rain',.15,{push:.08}]]},
 {n:'photo',t0:L(25).s-.15,f:.25,L:[]},
 {n:'wind',t0:L(27).s-.3,f:.5,L:[['s09_city',.25,{wrap:'x',mirror:1}],['cl_near',1.3,{wrap:'x',a:.3,over:1}]]},
 {n:'glass',t0:T(30,0)-.5,f:1,L:[['s10_glass',.12,{push:.12}]]},
 {n:'dawn',t0:SHATTER,f:0,dim:1,L:[['s11_dawn',.1,{wrap:'x',mirror:1}],['cl_dawn',.6,{wrap:'x'}],['cl_near',1.2,{wrap:'x',a:.3,over:1}]]},
 {n:'home',t0:152.2,f:2.6,L:[['s12_sky',.06],['s12_roof',.6]]}];
SC.forEach((s,k)=>{s.t1=SC[k+1]?SC[k+1].t0+SC[k+1].f:D.dur;s.op=s.op??1;const m=cam((s.t0+s.t1)/2);s.cx=m.x;s.cy=m.y;let dx=1,dy=1;
  for(let q=0;q<=40;q++){const c=cam(lerp(s.t0,s.t1,q/40));dx=Math.max(dx,Math.abs(c.x-s.cx));dy=Math.max(dy,Math.abs(c.y-s.cy))}s.dx=dx;s.dy=dy});
const ready=s=>s.n==='photo'?has('s01_sky'):s.L.length&&s.L.every(l=>has(l[0]));
function sceneA(s,t){return t<s.t0||t>=s.t1?0:s.f?clamp((t-s.t0)/s.f):1}
function sceneAlpha(n,t){const k=SC.findIndex(s=>s.n===n),s=SC[k];if(!ready(s))return 0;const nx=SC[k+1];return sceneA(s,t)*(nx&&ready(nx)&&!nx.op?1-sceneA(nx,t):1)*(nx&&t>=nx.t0+nx.f?0:1)}
function plate(id,pf,o,s,t,al){const im=PL.img[id];if(!im||al<=0)return;
  const r=CAM.r*Math.min(1,pf),cr=Math.abs(Math.cos(r)),sr=Math.abs(Math.sin(r)),rw=W*cr+H*sr,rh=W*sr+H*cr;   // screen footprint after the roll
  const push=1+(o.push||0)*eIOs(clamp((t-s.t0)/(s.t1-s.t0)));
  let S=Math.max(W/im.width,H/im.height)*1.04*(1+(CAM.z-1)*pf*.7)*push;
  if(o.wrap!=='x')S=Math.max(S,rw*1.01/im.width);if(o.wrap!=='y')S=Math.max(S,rh*1.01/im.height);
  const iw=im.width*S,ih=im.height*S;let ox=-(CAM.x-s.cx)*pf,oy=-(CAM.y-s.cy)*pf;
  if(o.wrap!=='x'){const m=(iw-rw)/2;ox*=Math.min(1,.95*m/(s.dx*pf))}
  if(o.wrap!=='y'){const m=(ih-rh)/2;oy*=Math.min(1,.95*m/(s.dy*pf))}
  g.save();g.globalAlpha=al*(o.a??1);g.translate(CX,CY);g.rotate(r);
  const draw=(x,y,fx)=>{if(fx){g.save();g.translate(x+iw,y);g.scale(-1,1);g.drawImage(im,0,0,iw,ih);g.restore()}else g.drawImage(im,x,y,iw,ih)};
  if(o.wrap==='x'){const x0=ox-iw/2,i0=Math.floor((-rw/2-x0)/iw),i1=Math.floor((rw/2-x0)/iw);for(let i=i0;i<=i1;i++)draw(x0+i*iw,oy-ih/2,o.mirror&&Math.abs(i)%2)}
  else if(o.wrap==='y'){const gap=ih*1.1,y0=oy-ih/2,i0=Math.floor((-rh/2-y0)/gap)-1,i1=Math.floor((rh/2-y0)/gap);for(let i=i0;i<=i1;i++)draw(ox-iw/2+(i%2?iw*.18:0),y0+i*gap,i%2)}
  else draw(ox-iw/2,oy-ih/2,0);
  g.restore()}
function plates(t,over){for(const s of SC){if(!ready(s))continue;const a=sceneAlpha(s.n,t);if(a<=0)continue;
  for(const [id,pf,o={}] of s.L)if(!!o.over===over)plate(id,pf,o,s,t,a);
  if(!over&&s.dim){g.fillStyle=`rgba(6,8,34,${.5*(1-DK)*a})`;g.fillRect(0,0,W,H)}
  if(!over&&s.op){g.fillStyle=`rgba(3,4,16,${.14*a})`;g.fillRect(0,0,W,H)}}}   // push the art back behind the type
const LA=t=>PL.off?1:1-Math.max(sceneAlpha('rain',t),sceneAlpha('photo',t));   // the two lights are absent in the lonely scenes
// scene overlays drawn in code on top of the art
function clockFx(t){const a=sceneAlpha('clock',t)+sceneAlpha('lapse',t)*(1-P(t,T(8,0),1.2));if(a<=0)return;   // a clock in the sky, running backward
  const t0=T(4,0)-.6,sp=t-t0,wild=P(t,T(7,0),1),ang=-(sp*.35+sp*sp*.05+wild*wild*40),hr=ang/12;
  g.save();g.globalCompositeOperation='lighter';g.translate(CX-(CAM.x-SC[1].cx)*.1,700-(CAM.y-SC[1].cy)*.1);const R0=360;g.globalAlpha=a*.55;
  g.strokeStyle='rgba(190,225,255,.8)';g.lineWidth=5;g.beginPath();g.arc(0,0,R0,0,7);g.stroke();g.lineWidth=2;g.beginPath();g.arc(0,0,R0-26,0,7);g.stroke();
  for(let k=0;k<60;k++){const q=k*Math.PI/30,l=k%5?12:36;g.lineWidth=k%5?2:5;g.beginPath();g.moveTo(Math.sin(q)*(R0-l-6),-Math.cos(q)*(R0-l-6));g.lineTo(Math.sin(q)*(R0-6),-Math.cos(q)*(R0-6));g.stroke()}
  for(let k=0;k<12;k++){g.strokeStyle=rgba(ACC,.4*(1-k/12));g.lineWidth=9;g.beginPath();g.moveTo(0,0);const q=ang+k*.07;g.lineTo(Math.sin(q)*R0*.84,-Math.cos(q)*R0*.84);g.stroke()}   // backward motion trail
  g.strokeStyle='#fff';g.lineWidth=10;g.beginPath();g.moveTo(0,0);g.lineTo(Math.sin(ang)*R0*.84,-Math.cos(ang)*R0*.84);g.stroke();
  g.lineWidth=15;g.beginPath();g.moveTo(0,0);g.lineTo(Math.sin(hr)*R0*.52,-Math.cos(hr)*R0*.52);g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(0,0,12,0,7);g.fill();g.restore()}
function rainFx(t){const a=sceneAlpha('rain',t)*(1-P(t,L(24).s-.3,2.4));if(a<=0)return;   // the rain stops at "the world was beautiful"
  g.save();g.strokeStyle='rgba(190,210,245,.34)';g.lineCap='round';

const SW=document.createElement('canvas');SW.width=1080;SW.height=560;{const c=SW.getContext('2d');c.font=JP(900,300);c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';

const ECHO=['空','夜','星','明日','翔'];
function instrumental(t){if(t<61||t>77.6)return;

  const p=clamp((t-64.4)/5.8),fade=1-P(t,72.5,2.2);if(p>0&&fade>0){const drift=Math.max(0,t-70.3)*120;g.save();g.globalAlpha=fade;g.beginPath();g.rect(0,0,p*W+40,H);g.clip();

// ---------- climax (2:09–2:33): speed, punches, bursts ----------
const BOOST=t=>eIOs(P(t,128.4,2.2))*(1-eIOs(P(t,152.6,2.5)));
function warp(t,B){if(B<=0)return;g.save();g.globalCompositeOperation='lighter';for(let k=0;k<90;k++){const an=R(k,90)*6.28,ph=(t*(1.2+1.8*B)+R(k,91))%1,r0=120+ph*1400,r1=r0+(100+700*B)*ph;
  g.strokeStyle=`rgba(${k%4?'200,235,255':'255,210,150'},${B*ph*.7})`;g.lineWidth=1+3*ph*B;g.beginPath();g.moveTo(CX+Math.cos(an)*r0,CY+Math.sin(an)*r0*1.2);g.lineTo(CX+Math.cos(an)*r1,CY+Math.sin(an)*r1*1.2);g.stroke()}g.restore()}
function burst(t,t0,big=1,col='#FFFFFF'){const a=t-t0;if(a<0||a>2.2)return;g.save();g.globalCompositeOperation='lighter';
  for(let k=0;k<20;k++){const an=k*Math.PI/10+R(k,5)*.25,len=(700+900*R(k,6))*eOutX(clamp(a/.5))*big,w=(4+9*R(k,7))*(1-clamp(a/1.6))*big;if(w<=0)continue;const lg=g.createLinearGradient(CX,CY,CX+Math.cos(an)*len,CY+Math.sin(an)*len);lg.addColorStop(0,'rgba(255,255,255,.9)');lg.addColorStop(.3,rgba(k%3?ACC:ORG,.55));lg.addColorStop(1,'rgba(0,0,0,0)');g.strokeStyle=lg;g.lineWidth=w;g.beginPath();g.moveTo(CX,CY);g.lineTo(CX+Math.cos(an)*len,CY+Math.sin(an)*len);g.stroke()}
  g.restore();for(let r=0;r<3;r++)ring(CX,CY,clamp((a-r*.12)/1.1),1300*big,16-r*4,r===1?ORG:col);
  for(let k=0;k<50*big;k++){const an=R(k,11)*6.28,v=400+1200*R(k,12),q=clamp(a/1.6),x=CX+Math.cos(an)*v*eOutC(q),y=CY+Math.sin(an)*v*eOutC(q)+260*q*q,sz=(6+20*R(k,13))*(1+q);g.save();g.translate(x,y);g.rotate(q*7*(R(k,14)-.5));g.globalAlpha=1-q;g.fillStyle=k%3?rgba(ACC,.9):rgba(ORG,.9);g.beginPath();g.moveTo(-sz,-sz*.3);g.lineTo(sz*.6,-sz*.5);g.lineTo(sz*.2,sz*.6);g.closePath();g.fill();g.restore()}
  if(a<.25){g.fillStyle=`rgba(255,255,255,${.45*Math.min(1,big)*(1-a/.25)})`;g.fillRect(0,0,W,H)}}

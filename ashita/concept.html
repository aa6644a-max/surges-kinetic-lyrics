<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Ashita Concept</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;300;600&family=Noto+Sans+JP:wght@300;700;900&family=Noto+Sans+KR:wght@300;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<script src="../shared/cine.js"></script>
<script>
// Concept stills for "Ashita no Yozora Shoukaihan": one continuous night flight, frame k = renderAt(k)
CINE.init(document.getElementById('cv'),{lines:[]});cv.style.transform='none';
ACC='#8FE3FF';const ORG='#FFB547',NIGHT='#0A0F33';
function skyGrad(top,mid,bot){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,top);gr.addColorStop(.6,mid);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,W,H)}
function moon(x,y,r,a=1){g.save();g.globalAlpha=a;const gl=g.createRadialGradient(x,y,r*.8,x,y,r*3);gl.addColorStop(0,'rgba(220,235,255,.35)');gl.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gl;g.fillRect(x-r*3,y-r*3,r*6,r*6);g.fillStyle='#EAF2FF';g.beginPath();g.arc(x,y,r,0,7);g.fill();g.fillStyle='rgba(160,180,220,.25)';for(let k=0;k<6;k++){g.beginPath();g.arc(x+(R(k,1)-.5)*r,y+(R(k,2)-.5)*r,r*(.08+.12*R(k,3)),0,7);g.fill()}g.restore()}
function skyline(y,col,seed=1){g.fillStyle=col;g.beginPath();g.moveTo(-50,H+50);g.lineTo(-50,y);let x=-50;while(x<W+60){const w=40+80*R(x,seed),h=60+260*R(x,seed+1)**2;g.lineTo(x,y-h);g.lineTo(x+w,y-h);if(R(x,seed+2)>.8){g.lineTo(x+w*.5,y-h);g.lineTo(x+w*.5,y-h-60);g.lineTo(x+w*.5+3,y-h-60);g.lineTo(x+w*.5+3,y-h)}x+=w}g.lineTo(W+60,H+50);g.fill();
  for(let k=0;k<120;k++){if(R(k,seed+5)>.55)continue;g.fillStyle=`rgba(255,${200+40*R(k,9)|0},140,${.35+.4*R(k,8)})`;g.fillRect(R(k,seed+6)*W,y-20-R(k,seed+7)*240,4,5)}}
function clouds(t,y,a,col,seed,spd=0,scale=1){for(let k=0;k<14;k++){const x=((R(k,seed)*1800+t*spd*(0.5+R(k,seed+1)))%1800)-360,yy=y+(R(k,seed+2)-.5)*260,rx=(220+320*R(k,seed+3))*scale,ry=rx*.28;const gl=g.createRadialGradient(x,yy,0,x,yy,rx);gl.addColorStop(0,rgba(col,a*(.5+.4*R(k,seed+4))));gl.addColorStop(1,rgba(col,0));g.fillStyle=gl;g.save();g.translate(x,yy);g.scale(1,ry/rx);g.translate(-x,-yy);g.beginPath();g.arc(x,yy,rx,0,7);g.fill();g.restore()}}
function wind(t,n,a,ang=-.18,col=ACC){g.save();g.globalCompositeOperation='lighter';for(let k=0;k<n;k++){const y=R(k,40)*H,x=((R(k,41)*2600+t*1400*(0.6+R(k,42)))%2600)-800,l=200+500*R(k,43);g.strokeStyle=rgba(col,a*(.2+.5*R(k,44)));g.lineWidth=1+2.5*R(k,45);g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(ang)*l,y+Math.sin(ang)*l);g.stroke()}g.restore()}
function jp(txt,x,y,f,w=900,col='#fff',glow=30,sp=8,gcol=ACC){g.save();g.font=JP(w,f);g.textAlign='center';g.textBaseline='middle';g.letterSpacing=sp+'px';g.fillStyle=col;g.shadowColor=gcol;g.shadowBlur=glow;g.fillText(txt,x,y);g.restore()}
function ko(txt,x,y,f=38,a=.8){g.save();g.globalAlpha=a;g.font=KR(300,f);g.textAlign='center';g.textBaseline='middle';g.fillStyle='#CFE0F5';g.fillText(txt,x,y);g.restore()}
function label(k,txt){g.save();g.font=EN(300,24);g.fillStyle='rgba(255,255,255,.55)';g.textAlign='left';g.fillText(`SCENE ${k}  —  ${txt}`,60,110);g.textAlign='right';g.fillText('ASHITA NO YOZORA SHOUKAIHAN',W-60,110);g.restore()}
const F=[
// 1 — the ground: a rooftop at night, the camera low and handheld; the boy's words are small
t=>{skyGrad('#060A24',NIGHT,'#1A2150');stars(t,.1,180,3,.8);moon(760,420,90);
  skyline(1480,'#04061A',3);g.fillStyle='#02030E';g.fillRect(0,1700,W,220);g.strokeStyle='rgba(143,227,255,.25)';g.lineWidth=3;g.beginPath();g.moveTo(0,1700);g.lineTo(W,1700);g.stroke();
  jp('気分次第です',540,980,96,300,'#E6EEFF',14,10);jp('僕は',700,1110,120,900,'#fff',26,6);ko('기분 내키는 대로인 나는',540,1220);label(1,'ROOFTOP · HANDHELD')},
// 2 — the shout: the word fills the frame, the moon trembles behind it
t=>{skyGrad('#060A24','#101A55','#1A2150');stars(t,.1,180,5,.8);moon(760,420,120,.55);ring(540,960,.35,900,24);ring(540,960,.55,900,14);
  g.save();g.translate(540,960);g.rotate(-.06);jp('明日よ！',0,-40,230,900,'#fff',70,4);g.restore();ko('내일아!',540,1200,48,.9);skyline(1640,'#04061A',7);label(2,'THE SHOUT · CAMERA SHAKE')},
// 3 — that night was different: two lights meet, the moon sinks, the first light rises
t=>{skyGrad('#070C2A','#18205A','#3A3A70');stars(t,.1,160,9,.7);moon(300,1380,120,.9);
  const gl=g.createRadialGradient(540,1600,10,540,1600,900);gl.addColorStop(0,'rgba(255,181,71,.35)');gl.addColorStop(1,'rgba(255,181,71,0)');g.fillStyle=gl;g.fillRect(0,700,W,1220);skyline(1600,'#05071C',11);
  g.strokeStyle=rgba(ACC,.7);g.lineWidth=3;g.beginPath();g.moveTo(330,900);g.quadraticCurveTo(540,800,750,900);g.stroke();flare(330,900,7,rgba(ACC,.9));flare(750,900,7,'rgba(255,181,71,.9)');flare(540,840,12,'rgba(255,255,255,.9)',1,1.4);
  jp('君は僕の手を',540,1100,100,700,'#fff',24,10);ko('너는 나의 손을',540,1210);label(3,'TWO LIGHTS MEET · LIFT-OFF')},
// 4 — take-off through the clouds: wind lines rush past, the words ride the wind
t=>{skyGrad('#0B1240','#1C2A6E','#2A3C88');stars(t,.1,80,13,.4);clouds(1.3,1500,.55,'#9FB4E8',21,0,1.4);clouds(2.1,500,.35,'#C9D6FF',31,0,1.1);wind(1.7,70,.9);
  g.save();g.translate(540,900);g.rotate(-.12);jp('空へ舞う',0,0,170,900,'#fff',40,10);g.restore();jp('世界の彼方',600,1110,86,300,'#E6EEFF',16,14);ko('하늘로 흩날리는 세계의 저편',540,1230);label(4,'THROUGH THE CLOUDS · WIND')},
// 5 — above the clouds: the leading star (orange) pulls a long trail; we follow it
t=>{skyGrad('#050820','#0A0F33','#1B2560');stars(t,.1,240,17,.9);clouds(0,1500,.7,'#3A4B90',41,0,1.8);clouds(0,1650,.6,'#566AB8',51,0,2.2);
  for(let k=0;k<40;k++){const q=k/40;g.fillStyle=`rgba(255,181,71,${.5*(1-q)})`;g.beginPath();g.arc(760-q*620,520+q*360,16*(1-q)+2,0,7);g.fill()}flare(760,520,16,'rgba(255,181,71,.95)',1,1.5);
  jp('魁星',540,980,300,900,'#fff',60,20,ORG);jp('闇を照らす',540,760,76,300,'#E6EEFF',14,16);ko('어둠을 비추는 괴성',540,1190);label(5,'ABOVE THE CLOUDS · THE LEADING STAR')},
// 6 — dawn: an arrow of light cuts the sky, the sun comes up
t=>{skyGrad('#141A4A','#6A4A8A','#FFB547');stars(t,.1,80,19,.35);const sun=g.createRadialGradient(540,1560,20,540,1560,700);sun.addColorStop(0,'rgba(255,240,200,1)');sun.addColorStop(.25,'rgba(255,181,71,.7)');sun.addColorStop(1,'rgba(255,181,71,0)');g.fillStyle=sun;g.fillRect(0,860,W,1060);
  clouds(0,1500,.5,'#FFD9A8',61,0,1.6);g.save();g.globalCompositeOperation='lighter';const lg=g.createLinearGradient(-100,1500,1180,300);lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(.8,'rgba(255,255,255,.95)');lg.addColorStop(1,'rgba(255,255,255,0)');g.strokeStyle=lg;g.lineWidth=10;g.beginPath();g.moveTo(-100,1700);g.lineTo(1000,1000);g.stroke();g.restore();flare(1000,1000,12,'rgba(255,220,160,.9)',1,1.4);
  jp('Sky Arrow',540,800,0,300);g.save();g.font=EN(100,170);g.textAlign='center';g.textBaseline='middle';g.fillStyle='#fff';g.shadowColor=ORG;g.shadowBlur=40;g.letterSpacing='14px';g.fillText('Sky Arrow',540,860);g.restore();
  jp('またね',540,1060,96,700,'#fff',24,12,ORG);ko('또 보자',540,1160);label(6,'DAWN · SKY ARROW')},
// 7 — the one-take camera path: altitude over the whole song
t=>{skyGrad('#060A24',NIGHT,'#1A2150');label(7,'ONE CONTINUOUS CAMERA PATH');
  const X=x=>120+x*840/180,Y=a=>1500-a*1000;const pts=[[0,0],[22,.02],[34,.05],[38,.18],[46,.55],[60,.72],[77,.66],[86,.62],[100,.8],[118,.86],[128,.95],[150,1.0],[172,1.05],[180,1.08]];
  g.strokeStyle='rgba(255,255,255,.15)';g.lineWidth=1;for(const a of [0,.5,1]){g.beginPath();g.moveTo(120,Y(a));g.lineTo(960,Y(a));g.stroke()}
  g.font=EN(300,24);g.fillStyle='rgba(255,255,255,.55)';g.textAlign='right';g.fillText('GROUND',110,Y(0)+8);g.fillText('CLOUDS',110,Y(.5)+8);g.fillText('ABOVE',110,Y(1)+8);
  g.strokeStyle=ACC;g.lineWidth=5;g.shadowColor=ACC;g.shadowBlur=20;g.beginPath();pts.forEach(([x,a],k)=>k?g.lineTo(X(x),Y(a)):g.moveTo(X(x),Y(a)));g.stroke();g.shadowBlur=0;
  const marks=[[0,'ROOFTOP'],[34,'SHOUT'],[38,'HAND · LIFT-OFF'],[46,'CLOUDS'],[60,'LEADING STAR'],[77,'HOVER · BREAK'],[100,'WIND RUSH'],[150,'SKY ARROW'],[172,'DAWN']];
  g.font=EN(300,22);g.textAlign='left';marks.forEach(([x,s],k)=>{const a=pts.reduce((p,q)=>q[0]<=x?q:p)[1];g.fillStyle=k===8||k===7?ORG:'#fff';g.beginPath();g.arc(X(x),Y(a),7,0,7);g.fill();g.save();g.translate(X(x)+10,Y(a)-16);g.rotate(-.6);g.fillText(s,0,0);g.restore()});
  g.textAlign='center';g.font=EN(300,26);g.fillStyle='rgba(255,255,255,.6)';for(const s of [0,30,60,90,120,150,180])g.fillText(`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`,X(s),1560);
  jp('ひと続きの夜間飛行',540,1720,56,300,'#E6EEFF',10,10);ko('끊기지 않는 하나의 비행',540,1800,34)}
];
function renderAt(t){CINE.begin();const k=Math.max(0,Math.min(F.length-1,Math.floor(t)));F[k](t);post(t)}
window.DUR=7;
window.READY=(async()=>{try{await Promise.all([document.fonts.load(JP(900,100),'気分次第です僕は明日よ！君の手を空へ舞う世界の彼方魁星闇を照らすまたねひと続きの夜間飛行'),document.fonts.load(JP(300,100),'気分次第です世界の彼方闇を照らすひと続きの夜間飛行'),document.fonts.load(JP(700,100),'君は僕の手をまたね'),document.fonts.load(KR(300,40),'기분내키는대로인나는내일아너는나의손을하늘로흩날리는세계의저편어둠을비추는괴성또보자끊기지않는하나의비행'),document.fonts.load(EN(100,100),'Sky Arrow'),document.fonts.load(EN(300,40),'SCENE ROOFTOP HANDHELD 0123456789:—·')])}catch(e){}window.renderAt=renderAt;renderAt(0)})();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>劣等感 Road Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&family=Noto+Sans+KR:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
#cv{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:0 0}
#ui{position:fixed;left:16px;right:16px;bottom:16px;display:flex;gap:12px;align-items:center;font:13px/1 system-ui;color:#ccc}
#ui button{background:#ff2a2a;color:#fff;border:0;border-radius:999px;width:44px;height:44px;font-size:18px;cursor:pointer}
#bar{flex:1;height:6px;background:#333;border-radius:3px;position:relative;cursor:pointer}
#fill{position:absolute;inset:0 auto 0 0;background:#ff2a2a;border-radius:3px}
.render #ui{display:none}
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="ui"><button id="pp">▶</button><div id="bar"><div id="fill"></div></div><span id="time">0:00</span></div>
<audio id="au" src="song.mp3" preload="auto"></audio>
<script>
const D=/*DATA*/null;
const cv=document.getElementById('cv'),g=cv.getContext('2d');
const W=1080,H=1920,HOR=800,FOC=900,SEG=200,RW=620,CAMH=850,DRAW=240;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.transform=`scale(${s}) translate(-50%,-50%)`}
addEventListener('resize',fit);fit();

/* ---------- helpers ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x,lerp=(a,b,x)=>a+(b-a)*x;
const eOutC=x=>1-(1-x)**3,eInC=x=>x*x*x,eIO=x=>x<.5?4*x*x*x:1-(-2*x+2)**3/2;
const eBack=(x,c=1.7)=>{x-=1;return 1+(c+1)*x*x*x+c*x*x};
const H1=(i,s=0)=>{const x=Math.sin(i*127.1+s*311.7+.5)*43758.5453;return x-Math.floor(x)};
const nz=(x,s=0)=>Math.sin(x+s*1.3)*.6+Math.sin(x*2.31+s*4.1+1.7)*.4;
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mixc=(a,b,x)=>a.map((v,i)=>lerp(v,b[i],x));
const css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const BT=D.beats;
function beatIdx(t){let lo=0,hi=BT.length-1,b=-1;while(lo<=hi){const m=(lo+hi)>>1;if(BT[m]<=t){b=m;lo=m+1}else hi=m-1}return b}
function pulse(t){const b=beatIdx(t);return b<0?0:Math.exp(-(t-BT[b])*7)}

/* ---------- journey: speed and distance ---------- */
const SPD=[[0,1500],[28.5,2000],[42.5,2300],[55.6,3300],[61.8,3900],[78.4,3000],[96.5,2200],[99.5,4600],[112,2600],[126,900],[132.2,4100],[162,3200],[172.7,2400],[196,1700],[208.5,500],[212.5,0]];
function spd(t){let i=0;for(let j=0;j<SPD.length;j++)if(t>=SPD[j][0])i=j;if(i===0)return SPD[0][1];
  return lerp(SPD[i-1][1],SPD[i][1],eIO(clamp((t-SPD[i][0])/1.5)))}
const DT=.01,NZ=Math.ceil((D.dur+2)/DT),ZT=new Float64Array(NZ+1);
for(let k=0;k<NZ;k++)ZT[k+1]=ZT[k]+spd(k*DT)*DT;
function Z(t){const k=clamp(t/DT,0,NZ-1),i=Math.floor(k);return lerp(ZT[i],ZT[i+1],k-i)}
function tOfZ(z){let lo=0,hi=NZ;while(lo<hi){const m=(lo+hi)>>1;if(ZT[m]<z)lo=m+1;else hi=m}return lo*DT}

/* ---------- places along the way ---------- */
const BIO=[[0,'city'],[28.5,'suburb'],[42.5,'field'],[55.6,'tunnel'],[61.8,'highway'],[78.4,'bridge'],[96.5,'highway'],[99.5,'neon'],[112,'mountain'],[126,'fog'],[132.2,'highway'],[162,'tunnel'],[168.1,'light'],[172.7,'coast'],[196,'town']];
function bioIdxT(t){let i=0;for(let j=0;j<BIO.length;j++)if(t>=BIO[j][0])i=j;return i}
const SKY={ // top, horizon, ground a/b, road, rumble a/b, lane, fog, sun [x,y,r,color] , stars, lights(night)
  city:    {top:'#2b1b4f',hor:'#ff8a5c',ga:'#2a2a33',gb:'#25252d',road:'#3a3a44',ra:'#d9d9d9',rb:'#b0303a',lane:'#f2f2f2',fog:'#a86a78',sun:[540,760,120,'#ffb36b'],stars:.2,night:.6,curve:.5,hill:.3},
  suburb:  {top:'#5a3b8f',hor:'#ffb07a',ga:'#51603a',gb:'#4a5835',road:'#4a4a52',ra:'#eeeeee',rb:'#c23b3b',lane:'#ffffff',fog:'#d99a7a',sun:[760,700,150,'#ffcf8a'],stars:0,night:.3,curve:1,hill:.7},
  field:   {top:'#6fb7e8',hor:'#ffe0a8',ga:'#6f9a3a',gb:'#648c34',road:'#555560',ra:'#ffffff',rb:'#c23b3b',lane:'#ffffff',fog:'#e8d6b0',sun:[300,560,110,'#fff2c0'],stars:0,night:0,curve:1.2,hill:1},
  tunnel:  {top:'#0b0906',hor:'#1a140c',ga:'#2b2419',gb:'#241e15',road:'#2f2a24',ra:'#d0a040',rb:'#3a3025',lane:'#ffd27a',fog:'#140f08',sun:null,stars:0,night:1,curve:.3,hill:0},
  highway: {top:'#050a1f',hor:'#1d2a5c',ga:'#0d1226',gb:'#0b0f20',road:'#1c1f2b',ra:'#cfd6ff',rb:'#8a1f2a',lane:'#e8ecff',fog:'#1a2248',sun:null,stars:.9,night:1,curve:.5,hill:.2},
  bridge:  {top:'#060b24',hor:'#233a78',ga:'#0a1a3d',gb:'#0c1d44',road:'#20232e',ra:'#dfe4ff',rb:'#dfe4ff',lane:'#e8ecff',fog:'#1b2c60',sun:[760,520,70,'#f4f1d8'],stars:1,night:1,curve:.2,hill:0,water:1},
  neon:    {top:'#12001f',hor:'#5a0d5e',ga:'#140820',gb:'#10061a',road:'#1d1426',ra:'#ff2bd6',rb:'#1de9ff',lane:'#ff5ad9',fog:'#3a0a45',sun:null,stars:0,night:1,curve:.8,hill:.2},
  mountain:{top:'#0b1433',hor:'#3b4f8a',ga:'#16241f',gb:'#132019',road:'#262a33',ra:'#e6e6e6',rb:'#b0303a',lane:'#f2f2f2',fog:'#2f3f6a',sun:null,stars:.7,night:.8,curve:1.6,hill:1.3},
  fog:     {top:'#c9ccd2',hor:'#e9eaed',ga:'#8b9096',gb:'#858a90',road:'#6d7178',ra:'#f5f5f5',rb:'#c0c0c0',lane:'#fafafa',fog:'#e4e6ea',sun:null,stars:0,night:0,curve:.5,hill:.3,rain:1},
  light:   {top:'#ffffff',hor:'#fff6e0',ga:'#e8e2d0',gb:'#e2dccb',road:'#c9c4b8',ra:'#ffffff',rb:'#f0c0c0',lane:'#ffffff',fog:'#fffaf0',sun:null,stars:0,night:0,curve:.3,hill:0},
  coast:   {top:'#3b5ba8',hor:'#ffb36b',ga:'#d9b87a',gb:'#cfae70',road:'#5a5a64',ra:'#ffffff',rb:'#d13b3b',lane:'#ffffff',fog:'#f3b38a',sun:[540,780,190,'#ffd07a'],stars:0,night:0,curve:1,hill:.4,water:.5},
  town:    {top:'#8fd0ff',hor:'#fff1d6',ga:'#7aa04a',gb:'#709545',road:'#5c5c66',ra:'#ffffff',rb:'#d13b3b',lane:'#ffffff',fog:'#f2ecd8',sun:[820,420,120,'#fff6d0'],stars:0,night:0,curve:.6,hill:.4}};
for(const k in SKY){const o=SKY[k];for(const f of ['top','hor','ga','gb','road','ra','rb','lane','fog'])o[f]=hex(o[f])}
function skyAt(t){const i=bioIdxT(t),P=SKY[BIO[i][1]],a=clamp((t-BIO[i][0])/1.2);if(i===0||a>=1)return P;
  const Q=SKY[BIO[i-1][1]],o={...P};for(const f of ['top','hor','ga','gb','road','ra','rb','lane','fog'])o[f]=mixc(Q[f],P[f],a);
  for(const f of ['stars','night','curve','hill'])o[f]=lerp(Q[f]||0,P[f]||0,a);return o}

/* ---------- track ---------- */
const NSEG=Math.ceil(ZT[NZ]/SEG)+DRAW+5;
const SB=new Array(NSEG),CURV=new Float32Array(NSEG),HILL=new Float32Array(NSEG);
for(let i=0;i<NSEG;i++){const t=tOfZ(i*SEG);SB[i]=BIO[bioIdxT(t)][1]}
{let hsm=0,csm=0;for(let i=0;i<NSEG;i++){const P=SKY[SB[i]];csm=lerp(csm,P.curve,.02);hsm=lerp(hsm,P.hill,.02);
  CURV[i]=csm*(2.2*Math.sin(i/61)+1.3*Math.sin(i/23+1.3));HILL[i]=hsm*(700*Math.sin(i/130)+260*Math.sin(i/41+2))}}
const CUM=new Float32Array(NSEG);for(let i=1;i<NSEG;i++)CUM[i]=CUM[i-1]+CURV[i];

/* ---------- lyrics objects in the world ---------- */
let OBJ=[],OVER=[];
const FONT='900 100px "Noto Sans JP"';
g.font=FONT;
const em=s=>{g.font=FONT;return g.measureText(s).width/100||1};
function buildLyrics(){
  let side=1;
  D.lines.forEach((L,li)=>{
    const mode=L.fl[0],next=D.lines[li+1];
    const out=next&&next.s-L.e<2.5?next.s-.06:L.e+1;
    const chunks=L.ch.map(([a,b,m])=>({us:L.w.slice(a,b).map(([c,s,e])=>({c,s,e,wr:em(c)})),emph:!!m}));
    if(mode==='over'){OVER.push({li,L,out,chunks});return}
    chunks.forEach((c,k)=>{
      const s0=c.us[0].s,e0=c.us[c.us.length-1].e;
      const ahead=mode==='road'?1050:mode==='gantry'?1700:1450;
      const z=Math.max(Z(s0)+ahead,Z(e0+.25)+(mode==='road'?350:500));
      const n=c.us.reduce((a,u)=>a+u.wr,0);
      side=-side;
      OBJ.push({mode,z,side,c,n,li,k});
    });
  });
  OBJ.sort((a,b)=>a.z-b.z);
}

/* ---------- drawing ---------- */
function poly(c,pts){g.fillStyle=c;g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.closePath();g.fill()}
function fogc(c,f,P){return css(mixc(c,P.fog,f))}
function drawSky(t,P,bgOff){
  const gr=g.createLinearGradient(0,0,0,HOR+40);gr.addColorStop(0,css(P.top));gr.addColorStop(1,css(P.hor));
  g.fillStyle=gr;g.fillRect(0,0,W,HOR+400);
  if(P.stars>0){g.fillStyle=`rgba(255,255,255,${.8*P.stars})`;for(let j=0;j<90;j++){const x=((H1(j,1)*1400+bgOff*.05)%1400+1400)%1400-160,y=H1(j,2)*HOR*.9,r=.8+H1(j,3)*2.2;
    g.globalAlpha=P.stars*(.4+.6*Math.abs(Math.sin(t*(1+H1(j,4)*2)+j)));g.fillRect(x,y,r,r)}g.globalAlpha=1}
  if(P.sun){const [sx,sy,r,c]=P.sun,x=sx+bgOff*.08;const rg=g.createRadialGradient(x,sy,0,x,sy,r*3);
    rg.addColorStop(0,c);rg.addColorStop(.3,c+'aa');rg.addColorStop(1,c+'00');g.fillStyle=rg;g.fillRect(x-r*3,sy-r*3,r*6,r*6);
    g.fillStyle=c;g.beginPath();g.arc(x,sy,r*.55,0,7);g.fill()}
}
function drawFar(P,bgOff,bio){ // silhouettes on the horizon, parallax with road curvature
  const col=css(mixc(P.hor,[0,0,0],bio==='fog'||bio==='light'?.12:.45));
  g.fillStyle=col;g.beginPath();g.moveTo(0,HOR+30);
  const off=bgOff*.25;
  for(let x=0;x<=W;x+=12){const u=(x-off)/1;let y;
    if(bio==='city'||bio==='neon'||bio==='town'){const b=Math.floor(u/70);y=HOR+20-(60+H1(b,7)*(bio==='town'?70:220))}
    else if(bio==='mountain'||bio==='suburb'||bio==='field'){y=HOR+10-(90+80*Math.sin(u/140)+60*Math.sin(u/57+1)+30*Math.sin(u/23))*(bio==='field'?.5:1)}
    else y=HOR+10-(18+8*Math.sin(u/90));
    g.lineTo(x,y)}
  g.lineTo(W,HOR+30);g.closePath();g.fill();
  if(bio==='neon'||bio==='city'){for(let j=0;j<60;j++){const b=j*3,x=((b*70+off)%1400+1400)%1400-160,h=H1(b,7);if(h<.35)continue;
    g.fillStyle=bio==='neon'?(j%2?'#ff2bd6':'#1de9ff'):'#ffd89a';g.globalAlpha=.6;g.fillRect(x+10,HOR-30-h*150,6,6);g.globalAlpha=1}}
}
function roundRect(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

// scenery sprite for segment i (world x on a side), drawn at projection (X ground, Y ground, s scale)
function scenery(i,bio,push){
  const r=q=>H1(i,q);
  const S=(x,kind,extra)=>push({x,kind,i,extra});
  switch(bio){
    case 'city': if(i%2===0){S(-(RW+500+r(1)*500),'bld',r(2));S(RW+500+r(3)*500,'bld',r(4))} if(i%5===0){S(-(RW+120),'lamp');S(RW+120,'lamp')} break;
    case 'suburb': if(i%6===0)S((r(1)<.5?-1:1)*(RW+220),'pole'); if(i%3===1&&r(2)<.6)S((r(3)<.5?-1:1)*(RW+400+r(4)*900),'tree',r(5)); if(i%9===4)S((r(6)<.5?-1:1)*(RW+700+r(7)*500),'house',r(8)); break;
    case 'field': if(i%2===0&&r(1)<.5)S((r(2)<.5?-1:1)*(RW+300+r(3)*1500),'tree',r(4)); if(i%1===0){S(-(RW+200+r(5)*1800),'flower',r(6));S(RW+200+r(7)*1800,'flower',r(8))} if(i%4===0){S(-(RW+90),'post');S(RW+90,'post')} break;
    case 'tunnel': case 'light': if(i%4===0)S(0,'tlight'); break;
    case 'highway': if(i%6===0){S(-(RW+80),'hlamp');S(RW+80,'hlamp')} if(i%2===0){S(-(RW+40),'rail');S(RW+40,'rail')} break;
    case 'bridge': if(i%2===0){S(-(RW+60),'brail');S(RW+60,'brail')} if(i%45===0){S(-(RW+160),'tower');S(RW+160,'tower')} break;
    case 'neon': if(i%2===0){S(-(RW+450+r(1)*400),'nbld',r(2));S(RW+450+r(3)*400,'nbld',r(4))} if(i%4===0){S(-(RW+100),'nlamp');S(RW+100,'nlamp')} break;
    case 'mountain': if(r(1)<.8)S(-(RW+250+r(2)*1200),'pine',r(3)); if(r(4)<.8)S(RW+250+r(5)*1200,'pine',r(6)); if(i%3===0){S(-(RW+60),'rail');S(RW+60,'rail')} break;
    case 'fog': if(i%7===0){S(-(RW+150),'post');S(RW+150,'post')} if(i%11===0)S((r(1)<.5?-1:1)*(RW+500),'tree',r(2)); break;
    case 'coast': if(i%5===0&&r(1)<.8)S(-(RW+300+r(2)*600),'palm',r(3)); if(i%3===0)S(RW+80,'rail'); break;
    case 'town': if(i%3===0){S(-(RW+500+r(1)*400),'house',r(2));S(RW+500+r(3)*400,'house',r(4))} if(i%3===1&&r(5)<.7)S((r(6)<.5?-1:1)*(RW+250),'tree',r(7)); break;
  }
}
function drawScenery(o,X,Y,s,fog,P,t){
  const x=X+o.x*s,night=P.night;g.globalAlpha=1;
  const F=(c)=>fogc(hex(c),fog,P);
  switch(o.kind){
    case 'bld':{const w=(500+o.extra*500)*s,h=(1400+o.extra*3000)*s,xx=o.x<0?x-w:x;g.fillStyle=F('#1d1b2a');g.fillRect(xx,Y-h,w,h);
      if(night>.2&&s>.05){g.fillStyle=`rgba(255,214,140,${(.8-fog)*night})`;const cw=Math.max(2,70*s),ch=Math.max(2,90*s);for(let yy=Y-h+cw;yy<Y-ch*2;yy+=ch*1.8)for(let xw=xx+cw;xw<xx+w-cw;xw+=cw*2)if(H1(o.i*7+Math.floor(xw)+Math.floor(yy),9)<.55)g.fillRect(xw,yy,cw,ch)}break}
    case 'nbld':{const w=(420+o.extra*400)*s,h=(1600+o.extra*2600)*s,xx=o.x<0?x-w:x;g.fillStyle=F('#150a22');g.fillRect(xx,Y-h,w,h);
      const cols=['#ff2bd6','#1de9ff','#ffe14d'];g.fillStyle=cols[o.i%3];g.globalAlpha=(1-fog);g.fillRect(xx+w*.1,Y-h*.7,w*.8,Math.max(2,70*s));g.fillRect(xx+w*.1,Y-h*.45,w*.5,Math.max(2,50*s));g.globalAlpha=1;break}
    case 'lamp': case 'hlamp': case 'nlamp':{const h=(o.kind==='hlamp'?1500:1100)*s,dir=o.x<0?1:-1;g.strokeStyle=F('#555a66');g.lineWidth=Math.max(1,22*s);g.beginPath();g.moveTo(x,Y);g.lineTo(x,Y-h);g.lineTo(x+dir*260*s,Y-h);g.stroke();
      if(night>.2){const c=o.kind==='nlamp'?(o.i%8<4?'255,43,214':'29,233,255'):'255,214,140';const rg=g.createRadialGradient(x+dir*260*s,Y-h,0,x+dir*260*s,Y-h,170*s);rg.addColorStop(0,`rgba(${c},${.55*night*(1-fog)})`);rg.addColorStop(1,`rgba(${c},0)`);g.fillStyle=rg;g.fillRect(x+dir*260*s-170*s,Y-h-170*s,340*s,340*s)}break}
    case 'pole':{g.strokeStyle=F('#3b2f25');g.lineWidth=Math.max(1,26*s);g.beginPath();g.moveTo(x,Y);g.lineTo(x,Y-1500*s);g.moveTo(x-200*s,Y-1400*s);g.lineTo(x+200*s,Y-1400*s);g.stroke();break}
    case 'tree':{const h=(700+o.extra*700)*s;g.fillStyle=F('#4a3322');g.fillRect(x-20*s,Y-h*.45,40*s,h*.45);g.fillStyle=F(P===SKY.suburb?'#2f4a26':'#3c6b2a');g.beginPath();g.arc(x,Y-h*.62,h*.32,0,7);g.fill();break}
    case 'pine':{const h=(900+o.extra*900)*s;g.fillStyle=F('#0f2418');poly(g.fillStyle,[x,Y-h,x-h*.28,Y-h*.1,x+h*.28,Y-h*.1]);g.fillStyle=F('#2a1d14');g.fillRect(x-15*s,Y-h*.12,30*s,h*.12);break}
    case 'palm':{const h=(1300+o.extra*600)*s;g.strokeStyle=F('#6b4a2b');g.lineWidth=Math.max(1,34*s);g.beginPath();g.moveTo(x,Y);g.quadraticCurveTo(x+120*s,Y-h*.5,x+60*s,Y-h);g.stroke();
      g.strokeStyle=F('#2f6b35');g.lineWidth=Math.max(1,40*s);for(let k=0;k<5;k++){const a=-Math.PI/2+(k-2)*.6;g.beginPath();g.moveTo(x+60*s,Y-h);g.quadraticCurveTo(x+60*s+Math.cos(a)*300*s,Y-h+Math.sin(a)*300*s-60*s,x+60*s+Math.cos(a)*520*s,Y-h+Math.sin(a)*520*s+160*s);g.stroke()}break}
    case 'house':{const w=(600+o.extra*300)*s,h=(420+o.extra*200)*s,xx=x-w/2;g.fillStyle=F(['#d9c7a8','#c9a07a','#e3d9c9'][o.i%3]);g.fillRect(xx,Y-h,w,h);poly(F('#8a3b2b'),[xx-30*s,Y-h,xx+w/2,Y-h-h*.6,xx+w+30*s,Y-h]);break}
    case 'flower':{const c=['#ffd23d','#ff7aa8','#ffffff','#ff5a3d'][o.i%4];g.fillStyle=F(c);const r=Math.max(1,26*s);g.fillRect(x-r,Y-r*2,r*2,r*2);break}
    case 'post':{g.fillStyle=F('#e8e8e8');g.fillRect(x-10*s,Y-260*s,20*s,260*s);g.fillStyle=F('#d13b3b');g.fillRect(x-10*s,Y-260*s,20*s,40*s);break}
    case 'rail':{g.fillStyle=F('#9aa0ab');g.fillRect(x-8*s,Y-240*s,16*s,240*s);g.fillRect(x-(o.x<0?0:1)*SEG*s*.0,Y-230*s,Math.max(1,12*s),30*s);break}
    case 'brail':{g.fillStyle=F('#c9ced8');g.fillRect(x-8*s,Y-320*s,16*s,320*s);break}
    case 'tower':{g.fillStyle=F('#b8bcc8');g.fillRect(x-40*s,Y-4200*s,80*s,4200*s);g.strokeStyle=F('#b8bcc8');g.lineWidth=Math.max(1,8*s);g.beginPath();g.moveTo(x,Y-4200*s);g.lineTo(x+(o.x<0?1:-1)*2500*s,Y-600*s);g.stroke();break}
    case 'tlight':{const c=P.night>.5?'255,190,90':'255,255,255';g.fillStyle=`rgba(${c},${1-fog})`;g.fillRect(x-120*s,Y-1700*s,240*s,40*s);break}
  }
}
function lyricVisual(o,t){ // text of a chunk revealed as it is sung

function drawText(chars,cx,cy,f,colFill,colNow,shadow,ghost=0){

function drawObj(o,X,Y,s,fog,P,t){

let camZ=0;
function drawRoad(t,P,sh){
  camZ=Z(t);const base=Math.floor(camZ/SEG),pct=(camZ%SEG)/SEG;
  const camY=CAMH+lerp(HILL[base],HILL[base+1],pct)+sh.y;
  const bgOff=-(CUM[base]+CURV[base]*pct)*18;
  const bio=SB[base];

  if(P.water){g.fillStyle=css(mixc(P.hor,[10,30,80],.55));g.fillRect(0,HOR+10,W,H)}
  else{g.fillStyle=css(P.ga);g.fillRect(0,HOR+10,W,H)}

  for(let n=0;n<DRAW;n++){
    const i=base+n,z1=i*SEG-camZ,z2=z1+SEG;if(z2<=10){x+=dx;dx+=CURV[i];continue}
    const s1=FOC/Math.max(10,z1),s2=FOC/z2;
    const X1=W/2+s1*(-x)+sh.x,Y1=HOR-s1*(HILL[i]-camY),X2=W/2+s2*(-x-dx)+sh.x,Y2=HOR-s2*(HILL[i+1]-camY);
    const fog=clamp(1-Math.exp(-n/DRAW*2.4)),Pi=SKY[SB[i]];
    seg.push({i,X1,Y1,s1,X2,Y2,s2,clip:maxy,fog,Pi});
    x+=dx;dx+=CURV[i];
    if(Y2>=maxy||Y2>=Y1)continue;
    const alt=Math.floor(i/3)%2;
    if(!Pi.water||SB[i]==='coast'){g.fillStyle=fogc(alt?P.ga:P.gb,fog,P);g.fillRect(0,Y2,W,Y1-Y2+1)}
    if(SB[i]==='bridge'||SB[i]==='coast'){g.fillStyle=fogc(mixc(P.hor,[10,30,80],.55+.1*alt),fog,P);if(SB[i]==='coast')g.fillRect(X2+s2*RW*1.6,Y2,W,Y1-Y2+1);else g.fillRect(0,Y2,W,Y1-Y2+1)}
    const w1=s1*RW,w2=s2*RW,r1=w1*.1,r2=w2*.1;
    poly(fogc(alt?P.ra:P.rb,fog,P),[X1-w1-r1,Y1,X1-w1,Y1,X2-w2,Y2,X2-w2-r2,Y2]);
    poly(fogc(alt?P.ra:P.rb,fog,P),[X1+w1+r1,Y1,X1+w1,Y1,X2+w2,Y2,X2+w2+r2,Y2]);
    poly(fogc(P.road,fog,P),[X1-w1,Y1,X1+w1,Y1,X2+w2,Y2,X2-w2,Y2]);
    if(alt){const l1=w1*.03,l2=w2*.03;for(const k of [-1/3,1/3])poly(fogc(P.lane,fog,P),[X1+k*2*w1-l1,Y1,X1+k*2*w1+l1,Y1,X2+k*2*w2+l2,Y2,X2+k*2*w2-l2,Y2])}

  for(const S of seg){const bi=SB[S.i];scenery(S.i,bi,o=>items.push({z:S.i*SEG,sc:o,S}));
    if(bi==='tunnel'||bi==='light')items.push({z:S.i*SEG+1,tun:S})}
  items.sort((a,b)=>b.z-a.z);
  const segAt=z=>{const n=Math.floor(z/SEG)-base;return seg.find(q=>q.i===base+n)||null};

    if(it.tun){const T=it.tun,wall=1900,hc=T.s1*wall,hc2=T.s2*wall,w1=T.s1*RW*1.3,w2=T.s2*RW*1.3;
      const c=fogc(SB[T.i]==='light'?[245,240,225]:(Math.floor(T.i/2)%2?[58,50,40]:[50,43,34]),T.fog,P);
      poly(c,[T.X1-w1,T.Y1,T.X2-w2,T.Y2,T.X2-w2,T.Y2-hc2,T.X1-w1,T.Y1-hc]);
      poly(c,[T.X1+w1,T.Y1,T.X2+w2,T.Y2,T.X2+w2,T.Y2-hc2,T.X1+w1,T.Y1-hc]);
      poly(fogc(SB[T.i]==='light'?[250,248,240]:[34,29,22],T.fog,P),[T.X1-w1,T.Y1-hc,T.X2-w2,T.Y2-hc2,T.X2+w2,T.Y2-hc2,T.X1+w1,T.Y1-hc])}
    else if(it.sc)drawScenery(it.sc,S.X1,S.Y1,S.s1,S.fog,S.Pi,t);
    else{const s=FOC/zr,fr=(it.z-S.i*SEG)/SEG,Xc=lerp(S.X1,S.X2,fr),Yc=lerp(S.Y1,S.Y2,fr);drawObj(it.obj,Xc,Yc,s,S.fog*.5,P,t)}

}
function drawWeather(t,info){
  const b=info.bio;
  if(b==='field'&&t>43.5&&t<47.5){const a=clamp((t-43.5)/.4)*(1-clamp((t-47)/.5));g.fillStyle=`rgba(255,255,255,${.85*a})`;
    for(let j=0;j<160;j++){const x=((H1(j,11)*1300+t*(-260-200*H1(j,12)))%1300+1300)%1300-110,y=((H1(j,13)*2100+t*(500+400*H1(j,14)))%2100),r=3+H1(j,15)*7;g.beginPath();g.arc(x,y,r,0,7);g.fill()}}
  if(b==='fog'){g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=2;g.beginPath();for(let j=0;j<120;j++){const x=H1(j,21)*W,y=((H1(j,22)*2200+t*1800)%2200)-100;g.moveTo(x,y);g.lineTo(x-8,y+60)}g.stroke()}
  if(info.speed>3300){const a=clamp((info.speed-3300)/1200)*.5;g.strokeStyle=`rgba(255,255,255,${a})`;g.lineWidth=3;g.beginPath();
    for(let j=0;j<48;j++){const an=H1(j,31)*Math.PI*2,ph=((t*3+H1(j,32))%1),r0=250+ph*1300,r1=r0+120+ph*300;g.moveTo(W/2+Math.cos(an)*r0,HOR+Math.sin(an)*r0*.8);g.lineTo(W/2+Math.cos(an)*r1,HOR+Math.sin(an)*r1*.8)}g.stroke()}
}
/* ---------- big overlay text (emphasis lines) ---------- */
function drawOver(t,sh){
  let flash=0;
  for(const O of OVER){
    const L=O.L;if(t<L.s-.3||t>O.out+.5)continue;
    const x=t-O.out,ex=clamp(x/.4);
    const rows=O.chunks.map(c=>({c,n:c.us.reduce((a,u)=>a+u.wr,0)}));
    const fs=rows.map(r=>Math.min(r.c.emph?360:170,940/r.n));let tot=fs.reduce((a,f)=>a+f*1.15,0);
    let y=620-tot/2;
    g.save();g.translate(W/2+sh.x*2,sh.y*2);
    rows.forEach((r,k)=>{const f=fs[k],cy=y+f*.575;y+=f*1.15;
      const chars=r.c.us.map(u=>({c:u.c,a:t-u.s,now:t>=u.s&&t<u.e+.05,wr:u.wr}));
      g.save();g.translate(0,cy);g.scale(1+ex*.4,1+ex*.4);g.globalAlpha=1-ex;
      g.rotate(((k%2?1:-1)*3)*Math.PI/180);
      drawText(chars,0,0,f,r.c.emph?'#ff2a2a':'#ffffff','#ffd23d','rgba(0,0,0,.85)');g.restore();
      for(const u of r.c.us){const a=t-u.s;if(r.c.emph&&a>0&&a<.25)flash=Math.max(flash,.35*(1-a/.25))}

function drawHud(t){

  const nx=D.lines[D.lines.indexOf(A)+1];if(nx&&t>=nx.s-.05)return;

  const w=Math.min(960,g.measureText(A.ko).width+60),x=W/2,y=1440;
  g.globalAlpha=p;g.fillStyle='rgba(0,0,0,.6)';roundRect(x-w/2,y-40,w,80,16);g.fill();

function drawTitle(t){

    g.font='700 40px "Noto Sans KR"';g.fillStyle='#fff';g.fillText('열 등 감',0,170);g.restore()}
}
function render(t){

  let shk=0;for(const L of D.lines)for(const [a,b,m] of L.ch){if(!m)continue;const a0=t-L.w[a][1];if(a0>0&&a0<.5)shk=Math.max(shk,Math.exp(-a0*8))}

window.DUR=D.dur;

else{const au=document.getElementById('au'),pp=document.getElementById('pp');

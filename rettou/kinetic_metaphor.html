/* ---------- math / time ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x,lerp=(a,b,x)=>a+(b-a)*x;
const eOutC=x=>1-(1-x)**3,eInC=x=>x*x*x,eIO=x=>x<.5?4*x*x*x:1-(-2*x+2)**3/2,eOutX=x=>x>=1?1:1-2**(-10*x),eInX=x=>x<=0?0:2**(10*x-10);
const eBack=(x,c=1.7)=>{x=clamp(x);x-=1;return 1+(c+1)*x*x*x+c*x*x};
const sprg=a=>a<=0?0:1-Math.exp(-9*a)*Math.cos(20*a);
const R=(i,s=0)=>{const x=Math.sin(i*127.1+s*311.7+.5)*43758.5453;return x-Math.floor(x)};
const B0=.302,BT=60/143.6;                       // 143.6 BPM grid
const beatAt=t=>(t-B0)/BT, pulse=t=>{const b=beatAt(t);return b<0?0:Math.exp(-(b-Math.floor(b))*BT*7)};
const P=(t,a,d)=>clamp((t-a)/d);                   // progress helper
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),rgba=(h,a=1)=>{const c=hex(h);return `rgba(${c[0]},${c[1]},${c[2]},${a})`};
const C={navy:'#1E2350',navy2:'#2E3A7A',blue:'#4655B8',org:'#FF8C42',apr:'#FFB26B',peach:'#FFD7A8',red:'#FF3B4E',mint:'#3FE0C5',cream:'#F7F1E4',dark:'#0B0D1A',rust:'#8A4B2A',gold:'#F2B233',pale:'#DCE3F2'};
const Ln=D.lines;
const uT=(i,k)=>Ln[i].w[Math.max(0,Math.min(Ln[i].w.length-1,k))][1];         // start time of unit k in line i
const cT=(i,ch,n=0)=>{let c=0;for(const u of Ln[i].w){if(u[0].includes(ch)){if(c===n)return u[1];c++}}return Ln[i].s};

/* ---------- drawing helpers ---------- */
const JP=(f,w=900)=>`${w} ${f}px "Noto Sans JP"`,KR=f=>`500 ${f}px "Noto Sans KR"`;
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function circ(x,y,r,fill,stroke,lw=2){g.beginPath();g.arc(x,y,Math.max(0,r),0,Math.PI*2);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function poly(pts,fill,stroke,lw=2){g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function lin(x1,y1,x2,y2,col,lw=2){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=col;g.lineWidth=lw;g.stroke()}
function bg(c1,c2){if(!c2){g.fillStyle=c1;g.fillRect(0,0,W,H);return}const gr=g.createLinearGradient(0,0,W*.4,H);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.fillRect(0,0,W,H)}
function grain(t,a=.05){g.fillStyle=`rgba(255,255,255,${a})`;const f=Math.floor(t*12);for(let i=0;i<140;i++){g.fillRect(R(i,f)*W,R(i+500,f)*H,2,2)}}
function stars(t,a=.7){for(let i=0;i<70;i++){g.fillStyle=`rgba(255,255,255,${a*(.3+.7*Math.abs(Math.sin(t*(.6+R(i,3))+i)))})`;g.fillRect(R(i,1)*W,R(i,2)*H*.7,2,2)}}

/* ---------- caption anchored to an object ---------- */
// chars pop in at their sung time; the sung char is tinted; Korean translation underneath
function cap(i,x,y,o={}){
  const L=Ln[i],f=o.f||76,col=o.col||'#fff',hi=o.hi||C.red,alpha=o.a??1;if(alpha<=0)return;
  const units=o.units||L.w,sp=o.sp||0;
  g.save();g.globalAlpha=alpha;g.font=JP(f,o.w||900);g.textBaseline='middle';g.textAlign='center';
  const ws=units.map(u=>g.measureText(u[0]).width+sp),tot=ws.reduce((a,b)=>a+b,0);
  let xx=x-tot/2;const t=o.t;
  units.forEach((u,k)=>{const a=t-u[1]+.06;const w=ws[k];
    if(a>0){const s=.55+.45*eBack(a/.16,2.2),now=t>=u[1]&&t<u[2]+.05;
      g.save();g.translate(xx+w/2,y+(o.float?Math.sin(t*2+k)*6:0));g.scale(s,s);
      if(o.shadow!==false){g.fillStyle='rgba(0,0,0,.35)';g.fillText(u[0],3,4)}
      g.fillStyle=now?hi:(o.cols&&o.cols[k])||col;g.fillText(u[0],0,0);g.restore()}
    xx+=w});
  if(o.ko!==false){const ka=clamp((t-L.s+.1)/.3);g.globalAlpha=alpha*ka*(o.koa??.85);g.font=KR(o.kf||44);g.fillStyle=o.kcol||col;g.fillText(L.ko,x,y+f*.5+46,1000)}
  g.restore();
}
// one caption per line: fade in with the line, out after the next line starts (or at `until`)
function capA(t,i,until){const L=Ln[i];const nx=Ln[i+1];const end=until??(nx?Math.min(nx.s-.05,L.e+1.4):L.e+1.4);return clamp((t-L.s+.25)/.2)*(1-clamp((t-end)/.2))}

/* ---------- ambient journey: the road that runs through every world ---------- */
const SPD=[[0,.6],[15,1.2],[28.7,.7],[61.9,1.6],[78.5,2.2],[99.6,2.6],[112.1,1.8],[126.2,.4],[132.3,1.6],[162.2,.3],[172.9,1],[179,.6],[196,.35],[208,.1]];
const DIST=[0];for(let k=1;k<=21500;k++){const t=k/100;let v=SPD[0][1];for(const [a,s] of SPD)if(t>=a)v=s;DIST.push(DIST[k-1]+v/100)}
const dist=t=>DIST[clamp(Math.round(t*100),0,21500)];
function road(t,col,a=1,hz=HZ){
  if(a<=0)return;g.save();g.globalAlpha=a;const d=dist(t);
  lin(0,hz,W,hz,col,2);
  lin(CX-18,hz,CX-620,H,col,2);lin(CX+18,hz,CX+620,H,col,2);
  for(let k=0;k<9;k++){const p=((k/9+d*.35)%1),z=p*p;const y=hz+(H-hz)*z,y2=hz+(H-hz)*Math.min(1,(p+.045)**2);
    g.strokeStyle=col;g.lineWidth=2+10*z;g.beginPath();g.moveTo(CX,y);g.lineTo(CX,y2);g.stroke()}
  for(let k=0;k<6;k++){const p=((k/6+d*.25)%1),z=p*p;for(const s of[-1,1]){circ(CX+s*(30+700*z),hz-4-160*z,2+6*z,col)}}
  g.restore();
}

else{const au=document.getElementById('au'),pp=document.getElementById('pp');const loop=()=>{render(au.currentTime);document.getElementById('fill').style.width=(au.currentTime/D.dur*100)+'%';document.getElementById('time').textContent=au.currentTime.toFixed(1);requestAnimationFrame(loop)};
  pp.onclick=()=>au.paused?au.play():au.pause();READY.then(()=>requestAnimationFrame(loop))}
</script>

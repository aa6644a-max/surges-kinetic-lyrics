<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surges Kinetic Lyrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&family=Noto+Sans+KR:wght@700&display=swap" rel="stylesheet">
<style>
:root{--acc:#ff3d7f;--acc2:#ffd23d;--hi:#ffe45c;--txt:#fff;--ink:#1a0716;--glow:rgba(255,61,127,.55);--ray:rgba(255,255,255,.9)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden}
/* fixed 1080x1920 canvas, scaled to fit the window in preview */
#cv{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:#05040a;font-family:"Noto Sans JP",sans-serif;font-weight:900;color:var(--txt)}
.L{position:absolute;inset:0;pointer-events:none}
#sun{position:absolute;left:170px;top:0;width:740px;height:740px;border-radius:50%;background:radial-gradient(circle,#fffbe0 0%,#ffe07a 30%,rgba(255,150,60,.35) 55%,rgba(255,120,60,0) 70%);opacity:0}
#mqw{position:absolute;left:-400px;top:-160px;width:1900px;height:2300px;transform:rotate(-10deg)}
.mq{position:absolute;left:0;top:0;white-space:nowrap;font-size:230px;line-height:1;color:transparent;-webkit-text-stroke:2.5px var(--txt)}
.shp{position:absolute;left:0;top:0;width:120px;height:120px;margin:-60px 0 0 -60px}
.shp svg{width:100%;height:100%;overflow:visible;fill:none;stroke:currentColor;stroke-width:8;stroke-linejoin:round;stroke-linecap:round}
.emb{position:absolute;left:0;top:0;border-radius:50%;background:#ffb300;box-shadow:0 0 18px 4px rgba(255,120,0,.8)}
#world{position:absolute;left:540px;top:860px;width:0;height:0}
#rays{position:absolute;left:-1500px;top:-1500px;width:3000px;height:3000px;background:repeating-conic-gradient(from 0deg,var(--ray) 0deg 1.4deg,transparent 1.4deg 10deg);-webkit-mask:radial-gradient(circle,transparent 5%,#000 20%,rgba(0,0,0,.35) 42%,transparent 60%);mask:radial-gradient(circle,transparent 5%,#000 20%,rgba(0,0,0,.35) 42%,transparent 60%);opacity:0}
#stage,#fx,.sc,.grp{position:absolute;left:0;top:0;width:0;height:0}
.c{position:absolute;left:0;top:0;text-align:center;white-space:nowrap}
.c.em{color:var(--acc);text-shadow:0 0 .15em var(--glow)}
.c.ol{color:transparent;-webkit-text-stroke:4px var(--txt);text-shadow:none}
.c.v{writing-mode:vertical-rl;text-orientation:upright}
.c.sub{color:var(--acc2)}
.c.fire{background:linear-gradient(180deg,#fff7a8 8%,#ffb300 45%,#ff3d1f 88%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.c.now{color:var(--hi);-webkit-text-stroke:0;text-shadow:0 0 .16em var(--hig)}
.c.fire.now{color:transparent;text-shadow:none}
.sc.inv .c{color:var(--ink);text-shadow:none}
.sc.inv .c.em{color:#fff;-webkit-text-stroke:5px var(--ink);text-shadow:12px 12px 0 var(--ink)}
.sc.inv .c.now{color:#fff;-webkit-text-stroke:5px var(--ink)}
.p{position:absolute;left:0;top:0;width:12px;height:24px;margin:-12px 0 0 -6px}
.rg{position:absolute;left:0;top:0;border-radius:50%;border:10px solid #fff}
#prog{display:none}
#grid{background:linear-gradient(rgba(128,128,128,.12) 1px,transparent 1px) 0 0/90px 90px,linear-gradient(90deg,rgba(128,128,128,.12) 1px,transparent 1px) 0 0/90px 90px}
#scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 5px)}
#vig{background:radial-gradient(ellipse 80% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.6) 100%)}
#flash{background:#fff;opacity:0}
#fade{background:#000;opacity:0}
#ko{position:absolute;left:60px;right:60px;top:1395px;text-align:center}
#ko .b{display:inline-block;max-width:900px;padding:14px 30px 20px;border-radius:18px;background:rgba(8,6,16,.62);font:700 46px/1.35 "Noto Sans KR",sans-serif;color:#fff;letter-spacing:-.01em;position:relative}
#ko .bar{position:absolute;left:30px;right:30px;bottom:8px;height:5px;border-radius:3px;background:var(--acc);transform-origin:0 50%}
#bk{position:absolute;left:0;right:0;top:250px;text-align:center}
#bk .j{font-size:58px;color:transparent;-webkit-text-stroke:2px var(--acc2);white-space:nowrap}
#bk .k{font:700 32px "Noto Sans KR",sans-serif;color:var(--acc2);margin-top:6px}
#prog{position:absolute;left:0;top:0;height:8px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
#ui{position:fixed;left:16px;right:16px;bottom:16px;display:flex;gap:12px;align-items:center;font:13px/1 system-ui;color:#aaa;z-index:2}
#ui button{background:#ff3d7f;color:#fff;border:0;border-radius:999px;width:44px;height:44px;font-size:18px;cursor:pointer;flex:none}
#bar{flex:1;height:6px;background:#221f30;border-radius:3px;position:relative;cursor:pointer}
#fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#3de0ff,#ff3d7f);border-radius:3px}
.render #ui{display:none}
</style>
</head>
<body>
<div id="cv">
  <div class="L" id="bg"></div>
  <div class="L" id="inv"></div>
  <div class="L" id="grid"></div>
  <div id="sun"></div>
  <div class="L"><div id="mqw"></div></div>
  <div class="L" id="shp"></div>
  <div class="L" id="emb"></div>
  <div id="world"><div id="rays"></div><div id="stage"></div><div id="fx"></div></div>
  <div class="L" id="vig"></div>
  <div class="L" id="scan"></div>
  <div class="L" id="flash"></div>
  <div class="L" id="hud">
    <div id="bk"><div class="j"></div><div class="k"></div></div>
    <div id="ko"><span class="b"><span class="t"></span><i class="bar"></i></span></div>
    <div id="prog"></div>
  </div>
  <div class="L" id="fade"></div>
</div>
<div id="ui"><button id="pp">▶</button><div id="bar"><div id="fill"></div></div><span id="time">0:00</span></div>
<audio id="au" src="song.m4a" preload="auto"></audio>
<script>
const D=/*DATA*/null;
const $=id=>document.getElementById(id);
const cv=$('cv'),world=$('world'),stage=$('stage'),fxL=$('fx'),bgEl=$('bg'),invEl=$('inv'),sunEl=$('sun'),raysEl=$('rays'),
  flashEl=$('flash'),fadeEl=$('fade'),koEl=$('ko'),koT=koEl.querySelector('.t'),koBar=koEl.querySelector('.bar'),
  bkEl=$('bk'),bkJ=bkEl.querySelector('.j'),bkK=bkEl.querySelector('.k'),progEl=$('prog');
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);cv.style.transform=`scale(${s}) translate(-50%,-50%)`}
addEventListener('resize',fit);fit();

/* ---------- math ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x, lerp=(a,b,x)=>a+(b-a)*x;
const eOutC=x=>1-(1-x)**3, eInC=x=>x*x*x, eIO=x=>x<.5?4*x*x*x:1-(-2*x+2)**3/2, eOutX=x=>x>=1?1:1-2**(-10*x);
const eBack=(x,c=1.70158)=>{x-=1;return 1+(c+1)*x*x*x+c*x*x};
const eBounce=x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375};
const spring=(a,w=26,k=9)=>a<=0?0:1-Math.exp(-k*a)*Math.cos(w*a);
const H=(i,s=0)=>{const x=Math.sin(i*127.1+s*311.7+.5)*43758.5453;return x-Math.floor(x)};
const R=(i,s)=>H(i,s)*2-1;
const nz=(x,s=0)=>Math.sin(x+s*1.3)*.6+Math.sin(x*2.31+s*4.1+1.7)*.4;
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
function rotp(x,y,d){const r=d*Math.PI/180,c=Math.cos(r),s=Math.sin(r);return [x*c-y*s,x*s+y*c]}
const boxOf=P=>({x0:Math.min(...P.map(p=>p[0])),x1:Math.max(...P.map(p=>p[0])),y0:Math.min(...P.map(p=>p[1])),y1:Math.max(...P.map(p=>p[1]))});
const boxRot=(B,d)=>boxOf([[B.x0,B.y0],[B.x1,B.y0],[B.x0,B.y1],[B.x1,B.y1]].map(p=>rotp(p[0],p[1],d)));
const boxU=(A,B)=>A?{x0:Math.min(A.x0,B.x0),x1:Math.max(A.x1,B.x1),y0:Math.min(A.y0,B.y0),y1:Math.max(A.y1,B.y1)}:B;

/* ---------- beats / energy ---------- */
const BT=D.beats;
function beatIdx(t){let lo=0,hi=BT.length-1,b=-1;while(lo<=hi){const m=(lo+hi)>>1;if(BT[m]<=t){b=m;lo=m+1}else hi=m-1}return b}
function pulse(t){const b=beatIdx(t);return b<0?0:Math.exp(-(t-BT[b])*7)}
function energy(t){const E=D.energy;return E?E[clamp(Math.floor(t*2),0,E.length-1)]:.5}

/* ---------- palette per section ---------- */
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const PAL={
  intro: {b1:'#262626',b2:'#000000',acc:'#ff2a2a',acc2:'#ffffff',hi:'#ff2a2a',txt:'#f2f2f2',int:.8,ray:.03},
  verse: {b1:'#1e1e1e',b2:'#050505',acc:'#ff3b30',acc2:'#dddddd',hi:'#ff3b30',txt:'#eeeeee',int:.75,ray:.03},
  chorus:{b1:'#3a0707',b2:'#060000',acc:'#ff2a2a',acc2:'#ffffff',hi:'#ffffff',txt:'#f5f5f5',int:1.1,ray:.09},
  rap:   {b1:'#141414',b2:'#000000',acc:'#ff2a2a',acc2:'#ffffff',hi:'#ff2a2a',txt:'#ffffff',int:1.2,ray:.12},
  bridge:{b1:'#f0f0f0',b2:'#b8b8b8',acc:'#d00000',acc2:'#111111',hi:'#d00000',txt:'#111111',int:.5,ray:0},
  final: {b1:'#4a0606',b2:'#080000',acc:'#ff2a2a',acc2:'#ffffff',hi:'#ffffff',txt:'#ffffff',int:1.3,ray:.14}};
for(const k in PAL)for(const c in PAL[k])if(typeof PAL[k][c]==='string')PAL[k][c]=hex(PAL[k][c]);
const SECT=[[0,'intro'],[28.5,'verse'],[61.7,'chorus'],[78.4,'intro'],[99.5,'rap'],[112,'verse'],[126.1,'bridge'],[132.1,'chorus'],[161.9,'verse'],[172.7,'final'],[195.8,'intro']];
function secAt(t){let i=0;for(let j=0;j<SECT.length;j++)if(t>=SECT[j][0])i=j;return i}
function palAt(t){const i=secAt(t),P=PAL[SECT[i][1]],a=clamp((t-SECT[i][0])/.3);if(i===0||a>=1)return P;
  const Q=PAL[SECT[i-1][1]],o={};for(const k in P)o[k]=Array.isArray(P[k])?P[k].map((v,j)=>lerp(Q[k][j],v,a)):lerp(Q[k],P[k],a);return o}
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix=(a,b,x)=>a.map((v,i)=>lerp(v,b[i],x));

/* ---------- text measuring ---------- */
const ctx=document.createElement('canvas').getContext('2d');
const em=s=>{ctx.font='900 100px "Noto Sans JP"';return ctx.measureText(s).width/100||1};

/* ---------- layouts (scene-local px, origin = stage centre) ---------- */
function placeRow(c,f,cx,cy,rot){
  const w=c.n*f;let x=-w/2;
  c.us.forEach(u=>{const uw=u.wr*f,[rx,ry]=rotp(x+uw/2,0,rot);u.x=cx+rx;u.y=cy+ry;u.f=f;u.rot=rot;x+=uw});
  Object.assign(c,{cx,cy,f,w,rot});
}
// classic kinetic type: each chunk is placed under the previous ones, sometimes turned 90deg;
// the camera follows the newest chunk and rotates so it always reads upright
function layoutCam(sc,spiral){
  let B=null,th=0;
  sc.chunks.forEach((c,k)=>{
    if(k>0&&(spiral||k%2===1))th+=spiral?-90:(k%4===1?-90:90);
    const Bp=B&&boxRot(B,-th);
    let f=Bp?clamp((Bp.x1-Bp.x0)/c.n,70,300):clamp(760/c.n,100,230);
    if(Bp&&c.emph)f=Math.min(f*1.2,340);
    const w=c.n*f,h=f*1.12;let cxp=0,cyp=0;
    if(Bp){cyp=Bp.y1+f*.1+h/2;const al=c.emph?0:(k%2?-1:1);cxp=al<0?Bp.x0+w/2:al>0?Bp.x1-w/2:(Bp.x0+Bp.x1)/2}
    const [cx,cy]=rotp(cxp,cyp,th);placeRow(c,f,cx,cy,th);c.th=th;
    B=boxU(B,boxOf([[-w/2,-h/2],[w/2,-h/2],[-w/2,h/2],[w/2,h/2]].map(p=>rotp(p[0]+cxp,p[1]+cyp,th))));
    c.z=clamp(820/w,Math.min(120,900/c.nc)/f,250/f);
  });
  sc.B=B;
}
function layoutRows(sc){
  const MW=920;let best=null;
  for(let f=200;f>=80;f-=5){
    const rows=[];let cur=[],cw=0,split=false;
    const push=()=>{if(cur.length)rows.push(cur);cur=[];cw=0};
    for(const c of sc.chunks){const k=c.emph?1.2:1,w=c.n*f*k;
      if(cw+w<=MW){c.us.forEach(u=>cur.push([u,f*k]));cw+=w}
      else if(w<=MW){push();c.us.forEach(u=>cur.push([u,f*k]));cw=w}
      else{split=true;for(const u of c.us){const uw=u.wr*f*k;if(cw+uw>MW)push();cur.push([u,f*k]);cw+=uw}}}
    push();best=rows;if(rows.length<=3&&!split)break;
  }
  const rh=best.map(r=>Math.max(...r.map(([,f])=>f))*1.2);
  let y=-rh.reduce((a,b)=>a+b,0)/2;
  best.forEach((r,ri)=>{const rw=r.reduce((a,[u,f])=>a+u.wr*f,0);let x=-rw/2;const cy=y+rh[ri]/2;
    r.forEach(([u,f])=>{const w=u.wr*f;u.x=x+w/2;u.y=cy;u.f=f;u.rot=0;x+=w});y+=rh[ri]});
}
const LAYOUT={
  cam:sc=>layoutCam(sc,false),spiral:sc=>layoutCam(sc,true),scatter:layoutRows,bounce:layoutRows,
  stack(sc){ // poster stack: every row stretched to the same width, emphasis rows huge
    const W=880,G=16,rows=sc.chunks.map(c=>({c,f:Math.max(60,Math.min(W/c.n,c.emph?300:220))}));
    let tot=rows.reduce((a,r)=>a+r.f*1.12,0)+G*(rows.length-1);
    if(tot>980){const k=980/tot;rows.forEach(r=>r.f*=k);tot=980}
    let y=-tot/2;
    rows.forEach((r,k)=>{const {c,f}=r,h=f*1.12,w=c.n*f,j=(k+sc.i)%5;
      placeRow(c,f,[-1,1,0,1,-1][j]*(W-w)/2,y+h/2,[-3,2.5,-2,3,-1.5][j]);c.ol=!c.emph&&k%2===1;y+=h+G});
  },
  zoom(sc){sc.chunks.forEach((c,k)=>placeRow(c,Math.min(900/c.n,c.emph?330:270),0,0,R(sc.i*7+k,3)*6))},
  tate(sc){ // vertical writing, columns right to left
    const G=26,cols=sc.chunks.map(c=>{const len=c.us.reduce((a,u)=>a+[...u.t].length,0);return {c,len,f:Math.min(940/len,c.emph?250:190)}});
    let W=cols.reduce((a,o)=>a+o.f*1.1,0)+G*(cols.length-1);
    if(W>900){const k=900/W;cols.forEach(o=>o.f*=k);W=900}
    let x=W/2;
    cols.forEach((o,k)=>{const cw=o.f*1.1,cx=x-cw/2,hg=o.len*o.f;let y=-hg/2+(k%2?40:-40);
      o.c.us.forEach(u=>{const uh=[...u.t].length*o.f;u.x=cx;u.y=y+uh/2;u.f=o.f;u.rot=0;u.vert=true;y+=uh});
      o.c.cx=cx;o.c.cy=y-hg/2;x-=cw+G});
  },
  shout(sc){ // giant emphasis word, the rest small above / below
    const E=sc.chunks.find(c=>c.emph)||sc.chunks[0],fE=Math.min(940/E.n,380);
    placeRow(E,fE,0,20,0);E.us.forEach(u=>u.big=1);
    let top=20-fE*.62,bot=20+fE*.62;
    for(let k=E.k-1;k>=0;k--){const c=sc.chunks[k],f=Math.min(760/c.n,150),h=f*1.2;top-=h;placeRow(c,f,0,top+h/2,-4);top-=8}
    for(let k=E.k+1;k<sc.chunks.length;k++){const c=sc.chunks[k],f=Math.min(760/c.n,150),h=f*1.2;placeRow(c,f,0,bot+h/2,3);bot+=h+8}
  }};
const ENT={cam:u=>u.emph?'slam':'pop',spiral:u=>u.emph?'slam':'pop',stack:u=>u.emph?'slam':['flip','pop','drop','pop'][u.ch%4],
  zoom:u=>u.emph?'slam':'far',scatter:()=>'fly',bounce:()=>'drop',tate:u=>u.emph?'slam':'slide',shout:u=>u.emph?'slam':'pop'};
const LEAD={pop:.04,slam:.03,far:.1,fly:.34,drop:.26,slide:.08,flip:.08};
const LAND={pop:.08,slam:.17,far:.25,fly:.18,drop:0,slide:.15,flip:.2};
const EXIT={cam:'cam',spiral:'cam',stack:'explode',zoom:'zoom',scatter:'explode',bounce:'fall',tate:'shutter',shout:'explode'};

/* ---------- scenes ---------- */
let S=[],TT=[],IMP=[];
function mkChar(parent,u,cls){
  const d=document.createElement('div'),f=u.f,w=u.vert?f*1.1:u.wr*f,h=u.vert?[...u.t].length*f:f*1.25;
  d.className='c'+cls;d.textContent=u.t;
  Object.assign(d.style,{fontSize:f+'px',width:w+'px',height:h+'px',lineHeight:(u.vert?w:h)+'px',marginLeft:-w/2+'px',marginTop:-h/2+'px',opacity:0});
  parent.appendChild(d);u.el=d;u.op=0;
}
function explodeVel(u,r,k=1){
  let dx=u.x,dy=u.y,l=Math.hypot(dx,dy);if(l<60){const a=r(6)*Math.PI*2;dx=Math.cos(a);dy=Math.sin(a);l=1}
  const sp=(700+900*r(7))*k;u.vx=dx/l*sp+(r(8)*2-1)*200;u.vy=dy/l*sp-450-300*r(9);u.spin2=(r(10)*2-1)*900;
}
function makeScene(L,i){
  const next=D.lines[i+1],sc={i,L,st:L.st,fl:new Set(L.fl),s:L.s,e:L.e};
  sc.inv=sc.fl.has('inv');
  sc.units=L.w.map(([t,s,e],k)=>({t,s,e,k,wr:em(t)}));
  sc.chunks=L.ch.map(([a,b,m],k)=>{const us=sc.units.slice(a,b),c={k,us,emph:!!m,s:us[0].s,e:us[us.length-1].e,n:us.reduce((x,u)=>x+u.wr,0),nc:us.length};
    us.forEach(u=>{u.ch=k;u.emph=c.emph});return c});
  sc.out=next&&next.s-L.e<2.5?next.s-.06:L.e+1.1;
  sc.exit=EXIT[sc.st];
  LAYOUT[sc.st](sc);
  sc.chunks.forEach(c=>{if(c.cx===undefined){c.cx=avg(c.us.map(u=>u.x));c.cy=avg(c.us.map(u=>u.y))}});
  sc.units.forEach(u=>{
    const r=j=>H(i*97+u.k*13+j,i);
    u.r1=r(1)*2-1;u.spin=(r(2)*2-1)*540;u.h0=750+350*r(3);u.ent=ENT[sc.st](u);u.lead=LEAD[u.ent];
    if(sc.fl.has('wind')){u.fx=-1300-500*r(4);u.fy=(r(5)*2-1)*350;u.spin=(r(2)*2-1)*160}
    else if(sc.fl.has('rise')){u.fx=(r(4)*2-1)*250;u.fy=1300+400*r(5);u.spin=(r(2)*2-1)*120}
    else{const a=r(4)*Math.PI*2,d=1200+500*r(5);u.fx=Math.cos(a)*d;u.fy=Math.sin(a)*d}
    explodeVel(u,r,sc.st==='shout'?1.5:1);
  });
  const el=document.createElement('div');el.className='sc'+(sc.inv?' inv':'');el.style.display='none';stage.appendChild(el);sc.el=el;sc.shown=false;
  sc.chunks.forEach(c=>{const g=document.createElement('div');g.className='grp';el.appendChild(g);c.g=g;
    c.us.forEach(u=>mkChar(g,u,(c.emph?' em':'')+(c.ol?' ol':'')+(u.vert?' v':'')+(c.emph&&sc.fl.has('fire')?' fire':'')))});
  sc.word=(sc.chunks.find(c=>c.emph)||sc.chunks[0]).us.map(u=>u.t).join('');
  return sc;
}
function makeTitle(a,b,v){
  const tt={a,b,v,units:[],ex:v===2?b-2.2:b-.5};
  const el=document.createElement('div');el.className='sc';el.style.display='none';stage.appendChild(el);tt.el=el;tt.shown=false;
  const add=(ch,f,x,y,k,big,s)=>{
    const r=j=>H(k*31+j+(big?0:500),v+11);
    const u={t:ch,x,y,k,f,big,s,e:s,rot:0,wr:em(ch),r1:r(1)*2-1,h0:900+300*r(2),spin:(r(3)*2-1)*540,ent:big?(v===1?'fly':'drop'):'pop'};
    u.lead=LEAD[u.ent];const an=r(4)*Math.PI*2;u.fx=Math.cos(an)*1400;u.fy=Math.sin(an)*1400;explodeVel(u,r,1.2);

  const word=[...'劣等感'],gap=4,f=Math.min(240,860/word.reduce((a,c)=>a+em(c),0)),ws=word.map(c=>em(c)*f),W=ws.reduce((x,y)=>x+y,0)+gap*(word.length-1);

function buildImpacts(){

/* ---------- per-character motion ---------- */
function entry(u,t){
  const a=t-u.s+u.lead;if(a<0)return null;
  const o={dx:0,dy:0,ly:0,dr:0,sx:1,sy:1,rx:0,ry:0,op:1,bl:0};
  switch(u.ent){
    case 'pop':{const p=clamp(a/.35);o.sx=o.sy=spring(a);o.op=clamp(a/.05);o.dr=u.r1*28*(1-eOutC(p));o.ly=60*(1-eOutC(p));break}
    case 'slam':{const p=clamp(a/.2);let s=1+(u.big?2.6:1.6)*(1-eOutC(p));if(a>.2)s-=.14*Math.sin(clamp((a-.2)/.22)*Math.PI);
      o.sx=o.sy=s;o.op=clamp(a/.04);o.bl=4*(1-p);o.dr=u.r1*(u.big?30:14)*(1-eOutC(p));break}
    case 'far':{const p=clamp(a/.4);o.sx=o.sy=.12+.88*eBack(p,2);o.op=clamp(a/.1);o.bl=10*(1-clamp(a/.22));o.dr=u.r1*20*(1-p);break}
    case 'fly':{const p=clamp(a/.52),e=eBack(p,1.25);o.dx=u.fx*(1-e);o.dy=u.fy*(1-e);o.dr=u.spin*(1-e);o.sx=o.sy=1+1.4*(1-e);o.op=clamp(a/.1);o.bl=6*(1-clamp(a/.3));break}
    case 'drop':{const p=clamp(a/.7);o.ly=-u.h0*(1-eBounce(p));let q=0;
      for(const [c,m] of [[.3636,.34],[.7273,.17],[.9091,.08]])if(p>=c)q=Math.max(q,m*Math.exp(-(p-c)*26));
      o.sy=1-q;o.sx=1+q*.9;o.ly+=u.f*.55*q;o.dr=u.r1*14*(1-p);o.op=clamp(a/.04);break}
    case 'slide':{const p=clamp(a/.32),e=eOutX(p);o.ly=-320*(1-e);o.sy=1+.6*(1-e);o.op=clamp(a/.07);o.bl=8*(1-e);break}
    case 'flip':{const p=clamp(a/.42);o.rx=-110*(1-eBack(p,1.7));o.op=clamp(a/.08);break}
  }
  return o;
}
function exitFx(kind,out,u,t,o){
  const x=t-out;if(x<=0)return;
  if(kind==='explode'){o.dx+=u.vx*x;o.dy+=u.vy*x+1300*x*x;o.dr+=u.spin2*x;o.op*=1-clamp((x-.2)/.3);o.sx*=1+x*.8;o.sy*=1+x*.8}
  else if(kind==='fall'){const y=Math.max(0,x-u.k*.018);o.dy+=1600*y*y-200*y;o.dr+=u.r1*300*y;o.op*=1-clamp((y-.25)/.25)}
  else if(kind==='shutter'){const p=clamp(x/.4);o.dy+=(u.ch%2?1:-1)*1600*eInC(p);o.op*=1-clamp((p-.6)/.4);o.bl+=10*p}
}
const f1=v=>v.toFixed(1),f3=v=>v.toFixed(3);
function applyU(u,o){
  if(o.op!==u.op){u.el.style.opacity=o.op;u.op=o.op}
  u.el.style.transform=`translate(${f1(u.x+o.dx)}px,${f1(u.y+o.dy)}px) rotate(${(u.rot+o.dr).toFixed(2)}deg) translateY(${f1(o.ly)}px)`+
    (o.rx?` perspective(600px) rotateX(${f1(o.rx)}deg)`:'')+(o.ry?` perspective(900px) rotateY(${f1(o.ry)}deg)`:'')+` scale(${f3(o.sx)},${f3(o.sy)})`;
  u.el.style.filter=o.bl>.5?`blur(${f1(o.bl)}px)`:'';
}
function hideU(u){if(u.op!==0){u.el.style.opacity=0;u.op=0}}

/* ---------- camera for cam / spiral scenes ---------- */
function camAt(sc,t){
  const C=sc.chunks;let k=0;for(let j=1;j<C.length;j++)if(t>=C[j].s-.08)k=j;
  const T=j=>({x:C[j].cx,y:C[j].cy,a:-C[j].th,z:C[j].z});
  let cam;
  if(k===0){const p=eOutC(clamp((t-(C[0].s-.2))/.6)),A=T(0);cam={...A,z:A.z*(2.2-1.2*p),a:A.a+(1-p)*(sc.i%2?20:-20),mv:0}}
  else{const p=clamp((t-(C[k].s-.08))/.34),A=T(k-1),B=T(k),e=eIO(p);
    cam={x:lerp(A.x,B.x,e),y:lerp(A.y,B.y,e),a:lerp(A.a,B.a,eBack(p,1.2)),z:lerp(A.z,B.z,e)*(1-.22*Math.sin(Math.PI*p)),mv:Math.sin(Math.PI*p)}}
  // pull back to show the whole composition before leaving, when there is time
  const last=C[C.length-1],r0=Math.max(last.s+.55,sc.out-1);
  if(k===C.length-1&&t>r0&&sc.out-r0>.25){
    const p=eIO(clamp((t-r0)/Math.min(.6,sc.out-r0))),B=sc.B,Bp=boxRot(B,cam.a);
    const zo=Math.min(900/(Bp.x1-Bp.x0),1000/(Bp.y1-Bp.y0));
    cam.x=lerp(cam.x,(B.x0+B.x1)/2,p);cam.y=lerp(cam.y,(B.y0+B.y1)/2,p);cam.z=lerp(cam.z,zo,p);
  }
  return cam;
}

/* ---------- scene render ---------- */
function renderScene(sc,t){
  if(t<sc.s-.6||t>sc.out+.6){if(sc.shown){sc.el.style.display='none';sc.shown=false}return}
  if(!sc.shown){sc.el.style.display='';sc.shown=true}
  const x=t-sc.out;
  let tf,op=1,bl=0;
  if(sc.exit==='cam'){
    const c=camAt(sc,t);let z=c.z,a=c.a;
    if(x>0){const e=eInC(clamp(x/.42));z*=1-.75*e;a+=45*e*(sc.i%2?1:-1);op=1-e;bl=12*e}
    tf=`scale(${f3(z)}) rotate(${a.toFixed(2)}deg) translate(${f1(-c.x)}px,${f1(-c.y)}px)`;
  }else{
    const pr=clamp((t-sc.s)/Math.max(.6,sc.out-sc.s));let z=1+.07*pr;
    if(sc.st==='shout')z+=.3*(1-eOutC(clamp((t-sc.s+.1)/.45)));
    tf=`scale(${f3(z)}) rotate(${((sc.i%2?1:-1)*(1.5-3*pr)).toFixed(2)}deg)`;
  }
  sc.el.style.transform=tf;sc.el.style.opacity=op;sc.el.style.filter=bl>.4?`blur(${f1(bl)}px)`:'';
  let ak=0;sc.chunks.forEach((c,k)=>{if(t>=c.s-.05)ak=k});
  if(sc.st==='zoom')sc.chunks.forEach((c,k)=>{ // one chunk at a time, the old one flies past the camera
    const end=k<sc.chunks.length-1?sc.chunks[k+1].s-.04:sc.out,y=t-end;
    if(t<c.s-.3||y>.32){c.g.style.display='none';return}
    c.g.style.display='';
    if(y>0){const p=clamp(y/.3);c.g.style.transform=`scale(${f3(1+4.5*eInC(p))})`;c.g.style.opacity=1-p;c.g.style.filter=`blur(${f1(p*14)}px)`}
    else{c.g.style.transform=`scale(${f3(1+.05*Math.max(0,t-c.s))})`;c.g.style.opacity=1;c.g.style.filter=''}
  });
  for(const u of sc.units){
    const o=entry(u,t);if(!o){hideU(u);continue}
    if(t>u.s+.35){
      // every landed letter bounces on the beat (a wave through the line), the current chunk the most
      const bp=pulse(t-u.k*.025),amp=(u.ch===ak?24:10)*(.6+.4*PAL[SECT[secAt(t)][1]].int);
      o.ly-=amp*bp;if(u.ch===ak){o.sy*=1+.08*bp;o.sx*=1-.05*bp}
      if(sc.fl.has('wind')){o.ly+=8*Math.sin(t*3+u.k);o.dr+=4*Math.sin(t*2.2+u.k*.7)}
      if(u.big){o.dx+=6*nz(t*31,u.k);o.dy+=6*nz(t*29,u.k+5)}
    }
    exitFx(sc.exit,sc.out,u,t,o);
    const now=t>=u.s&&t<u.e+.04;
    if(now!==u.now){u.el.classList.toggle('now',now);u.now=now}
    if(now){o.sx*=1.12;o.sy*=1.12}
    applyU(u,o);
  }
}
function renderTitle(tt,t){
  if(t<tt.a-.1||t>tt.b+.1){if(tt.shown){tt.el.style.display='none';tt.shown=false}return}
  if(!tt.shown){tt.el.style.display='';tt.shown=true}
  const pb=pulse(t),bi=beatIdx(t),g=bi-(bi%8);
  tt.el.style.transform=`scale(${f3(1+.05*Math.sin((t-tt.a)*.6)+.035*pb)}) rotate(${(2.5*Math.sin((t-tt.a)*.45)).toFixed(2)}deg)`;
  for(const u of tt.units){
    const o=entry(u,t);if(!o){hideU(u);continue}
    if(u.big&&t>u.s+.3){
      o.ly-=38*pulse(t-u.k*.05);
      if(g>=0&&BT[g]>u.s+.3)o.ry=360*eIO(clamp((t-BT[g]-u.k*.06)/.55));
      const ol=((bi>>1)+u.k)%2===1;if(ol!==u.ol){u.el.classList.toggle('ol',ol);u.ol=ol}
    }else if(!u.big&&t>u.s+.3)o.ly-=10*pulse(t-u.k*.03);
    exitFx(tt.v===2?'fall':'explode',tt.ex,u,t,o);
    applyU(u,o);
  }
}

  S=D.lines.map(makeScene);
  TT=[[15.3,28.6,0],[210.7,214.0,2]].map(([a,b,v])=>makeTitle(a,b,v));
  buildImpacts();buildFx();
  window.renderAt=render;render(0);
})();

if(new URLSearchParams(location.search).has('render'))document.body.classList.add('render');
else{
  const au=$('au'),pp=$('pp');
  const loop=()=>{render(au.currentTime);$('fill').style.width=(au.currentTime/D.dur*100)+'%';
    $('time').textContent=Math.floor(au.currentTime/60)+':'+String(Math.floor(au.currentTime%60)).padStart(2,'0');requestAnimationFrame(loop)};
  pp.onclick=()=>{au.paused?au.play():au.pause()};au.onplay=()=>pp.textContent='❚❚';au.onpause=()=>pp.textContent='▶';
  $('bar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();au.currentTime=(e.clientX-r.left)/r.width*D.dur};
  document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pp.click()}if(e.code==='ArrowRight')au.currentTime+=5;if(e.code==='ArrowLeft')au.currentTime-=5});
  READY.then(()=>requestAnimationFrame(loop));
}
</script>

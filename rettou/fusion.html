<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>劣等感 Fusion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;background:#000;overflow:hidden}
#cv{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:0 0}
#ui{position:fixed;left:16px;right:16px;bottom:16px;display:flex;gap:12px;align-items:center;font:13px/1 system-ui;color:#ccc}
#ui button{background:#FF3B4E;color:#fff;border:0;border-radius:999px;width:44px;height:44px;font-size:18px}
#bar{flex:1;height:6px;background:#333;border-radius:3px;position:relative}#fill{position:absolute;inset:0 auto 0 0;background:#FF3B4E}
.render #ui{display:none}
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="ui"><button id="pp">▶</button><div id="bar"><div id="fill"></div></div><span id="time">0:00</span></div>
<audio id="au" src="song.mp3" preload="auto"></audio>
<script>
const D=/*DATA*/null;
const cv=document.getElementById('cv');let g=cv.getContext('2d');const g0=g;
const W=1080,H=1920,CX=540,OY=860,CY=1190,HZ=1470;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.transform=`scale(${s}) translate(-50%,-50%)`}
addEventListener('resize',fit);fit();

/* ---------- math / time ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x,lerp=(a,b,x)=>a+(b-a)*x;
const eOutC=x=>1-(1-x)**3,eInC=x=>x*x*x,eIO=x=>x<.5?4*x*x*x:1-(-2*x+2)**3/2,eOutX=x=>x>=1?1:1-2**(-10*x),eInX=x=>x<=0?0:2**(10*x-10);
const eBack=(x,c=1.7)=>{x=clamp(x);x-=1;return 1+(c+1)*x*x*x+c*x*x};
const sprg=a=>a<=0?0:1-Math.exp(-9*a)*Math.cos(20*a);
const R=(i,s=0)=>{const x=Math.sin(i*127.1+s*311.7+.5)*43758.5453;return x-Math.floor(x)};
const B0=.302,BT=60/143.6;                       // 143.6 BPM grid
const beatAt=t=>(t-B0)/BT, pulse=t=>{const b=beatAt(t);return b<0?0:Math.exp(-(b-Math.floor(b))*BT*7)};
const P=(t,a,d)=>clamp((t-a)/d);                   // progress helper
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),rgba=(h,a=1)=>{const c=hex(h);return `rgba(${c[0]},${c[1]},${c[2]},${a})`};
const C={navy:'#2B2560',navy2:'#4B2BD6',blue:'#7B61FF',org:'#FF8A5C',apr:'#FFB38A',peach:'#FDE3CF',red:'#F4506B',mint:'#4FC3B8',cream:'#FFF6E9',dark:'#1C1B33',rust:'#A0583A',gold:'#FFC94A',pale:'#E3DDF7',teal:'#5AAFB8',lilac:'#B9A6FF',coral:'#F4777F'};
const Ln=D.lines;
const uT=(i,k)=>Ln[i].w[Math.max(0,Math.min(Ln[i].w.length-1,k))][1];         // start time of unit k in line i
const cT=(i,ch,n=0)=>{let c=0;for(const u of Ln[i].w){if(u[0].includes(ch)){if(c===n)return u[1];c++}}return Ln[i].s};

/* ---------- drawing helpers ---------- */
const JP=(f,w=900)=>`${w} ${f}px "Noto Sans JP"`,KR=f=>`500 ${f}px "Noto Sans KR"`;
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function circ(x,y,r,fill,stroke,lw=2){g.beginPath();g.arc(x,y,Math.max(0,r),0,Math.PI*2);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function poly(pts,fill,stroke,lw=2){g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function lin(x1,y1,x2,y2,col,lw=2){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=col;g.lineWidth=lw;g.stroke()}
let CUR_T=0,WI=0,BGL=0,SHK=0;
const lum=h=>{const c=hex(h);return (c[0]*.3+c[1]*.59+c[2]*.11)/255};
function bg(c1,c2){BGL=lum(c1);if(!c2){g.fillStyle=c1;g.fillRect(-60,-60,W+120,H+120)}else{const gr=g.createLinearGradient(0,0,W*.4,H);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.fillRect(-60,-60,W+120,H+120)}
  if(c1!=='#000'&&c1!=='#000000')deco(CUR_T);hero(CUR_T)}
/* reference-style flat decoration: dot grid, orbit lines, soft discs, beat-bouncing confetti shapes */
const ACC=[C.coral,C.gold,C.mint,C.lilac,C.org,C.teal,C.red];
function deco(t){
  const lt=BGL>.55,ink=lt?'43,37,96':'255,255,255',d=dist(t),pl=pulse(t),sd=WI*7.3;
  g.save();
  // dot grid (parallax)
  g.fillStyle=`rgba(${ink},${lt?.13:.12})`;const ox=(d*40)%64,oy=(d*18)%64;
  for(let y=-64;y<H+64;y+=64)for(let x=-64;x<W+64;x+=64)g.fillRect(x-ox+32,y-oy+32,3,3);
  // soft discs
  for(let k=0;k<2;k++){const x=W*(R(k,sd+1)>.5?.85:.12)+Math.sin(t*.3+k)*40,y=H*(.12+.7*R(k,sd+2))+Math.cos(t*.25+k)*50,r=170+140*R(k,sd+3);
    circ(x,y,r*(1+.03*pl),rgba(ACC[(WI+k*3)%ACC.length],lt?.28:.22))}
  // orbit lines
  g.lineWidth=2;for(let k=0;k<2;k++){const r=520+300*k+60*R(k,sd+4),a0=t*(.08+.05*k)*(k?-1:1)+R(k,sd+5)*6;g.strokeStyle=`rgba(${ink},${lt?.22:.25})`;g.beginPath();g.arc(CX+(k?-260:300),OY+(k?420:-300),r,a0,a0+2.6);g.stroke()}
  // confetti shapes near the edges, bounce on the beat
  for(let k=0;k<8;k++){const side=k%2?1:-1,x=CX+side*(380+120*R(k,sd+6))+Math.sin(t*.7+k)*18,y=260+1400*R(k,sd+7)+Math.cos(t*.6+k*2)*22-((d*30+k*97)%0)*1;
    const sz=(18+28*R(k,sd+8))*(1+.35*pl*(k%3===0)),rot=t*(R(k,sd+9)-.5)*1.4+k,col=ACC[(k+WI)%ACC.length],ty=Math.floor(R(k,sd+10)*5);
    g.save();g.translate(x,y);g.rotate(rot);g.fillStyle=col;g.strokeStyle=col;g.lineWidth=6;g.beginPath();
    if(ty===0){g.arc(0,0,sz,0,Math.PI);g.fill()}else if(ty===1){g.moveTo(0,-sz);g.lineTo(sz*.9,sz*.7);g.lineTo(-sz*.9,sz*.7);g.fill()}
    else if(ty===2){g.fillRect(-sz*.7,-sz*.7,sz*1.4,sz*1.4)}else if(ty===3){g.arc(0,0,sz*.8,0,7);g.stroke()}else{g.moveTo(0,-sz);g.lineTo(sz*.7,0);g.lineTo(0,sz);g.lineTo(-sz*.7,0);g.fill()}
    g.restore()}
  g.restore();
}
/* giant background keyword glyphs that slam in on their sung character (Surges-style) */
let HERO=[];
function hero(t){
  let h=null;for(const x of HERO)if(t>=x.t-.08)h=x;if(!h)return;const a=t-h.t+.08;if(a>h.d)return;
  const inP=eOutC(clamp(a/.35)),out=clamp((a-h.d+.5)/.5);const lt=BGL>.55;
  g.save();g.translate(CX+h.x+(1-inP)*h.dx+a*h.vx,OY+h.y+a*h.vy);g.rotate(h.r+(1-inP)*h.dr+a*.02);const sc=h.s*(1+.9*(1-inP)+a*.02)*(1+.03*pulse(t));g.scale(sc,sc);
  g.globalAlpha=(lt?.13:.11)*inP*(1-out)+(a<.12?.25*(1-a/.12):0);g.font=JP(820);g.textAlign='center';g.textBaseline='middle';
  if(h.o){g.strokeStyle=lt?C.navy:C.cream;g.lineWidth=14;g.strokeText(h.ch,0,0)}else{g.fillStyle=lt?C.navy:C.cream;g.fillText(h.ch,0,0)}
  g.restore();
}
function grain(t,a=.05){g.fillStyle=`rgba(255,255,255,${a})`;const f=Math.floor(t*12);for(let i=0;i<140;i++){g.fillRect(R(i,f)*W,R(i+500,f)*H,2,2)}}
function stars(t,a=.7){for(let i=0;i<70;i++){g.fillStyle=`rgba(255,255,255,${a*(.3+.7*Math.abs(Math.sin(t*(.6+R(i,3))+i)))})`;g.fillRect(R(i,1)*W,R(i,2)*H*.7,2,2)}}

/* ---------- kinetic caption engine ---------- */
// every glyph flies in on its sung time with a per-line motion style, the sung glyph hops & tints,
// and on exit the glyphs leave with their own motion instead of fading.
const oBounce=x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375};
const STY={0:'pop',1:'drop',2:'bounce',3:'slam',4:'type',5:'wobble',6:'drip',7:'wind',8:'spin',9:'pop',10:'drop',11:'rise',12:'slam',13:'slam',14:'shake',
  15:'fly',16:'scatter',17:'fly',18:'shout',19:'pop',20:'drop',21:'bounce',22:'slam',23:'fly',24:'fly',25:'fly',26:'fly',27:'fly',28:'rise',29:'slam',30:'scatter',
  31:'rise',32:'pop',33:'fly',34:'scatter',35:'wobble',36:'shout',37:'fly',38:'scatter',39:'fly',40:'shout',41:'wave',42:'scatter',43:'fly',44:'drop',45:'rise',46:'wave',47:'pop',48:'drop',49:'bounce',50:'pop',51:'pop'};
const CEND={};
function glyphT(st,k,a,t,dir){ // -> [dx,dy,rot,scale,alpha]
  const sp=sprg(Math.max(0,a+.12)),e=clamp((a+.12)/.38),r1=R(k,17)-.5,r2=R(k,19)-.5;
  switch(st){
    case 'fly':return [dir*(1-sp)*760,(1-sp)*r1*160,dir*(1-sp)*.7,1,clamp(e*3)];
    case 'drop':return [0,-(1-oBounce(e))*520,(1-e)*r1*.6,1,clamp(e*4)];
    case 'bounce':return [0,-(1-oBounce(e))*420-Math.abs(Math.sin((t-.3)*Math.PI/BT))*10*((k%2)?1:0),0,1,clamp(e*4)];
    case 'rise':return [0,(1-sp)*380,0,1,e];
    case 'pop':return [0,0,(1-sp)*.9*(k%2?1:-1),Math.max(0,sp),1];
    case 'slam':{const q=eOutC(e);return [0,0,(1-q)*r1*.3,1+3.2*(1-q),clamp(e*2.5)]}
    case 'shout':{const q=eOutC(e);return [Math.sin(t*50+k)*3,0,(1-q)*r1*.4,1+2.2*(1-q),clamp(e*2.5)]}
    case 'scatter':return [(1-sp)*r1*1500,(1-sp)*r2*1100,(1-sp)*r1*5,.4+.6*sp,e];
    case 'spin':return [0,0,(1-sp)*6.283,Math.max(0,sp),e];
    case 'wobble':return [0,0,(1-sp)*.8+Math.sin(t*4.2+k*.9)*.14,Math.max(0,sp),1];
    case 'drip':return [0,-(1-eOutC(e))*300,0,1,e];
    case 'wind':return [-(1-sp)*700,Math.sin(t*3.1+k)*9,(1-sp)*-.9+Math.sin(t*2.3+k)*.08,1,e];
    case 'wave':return [0,(1-sp)*260+Math.sin(t*3.2-k*.55)*13,0,1,e];
    case 'shake':{const j=a>0&&a<.5?(1-a/.5)*14:0;return [(R(k,Math.floor(t*30))-.5)*j,(R(k+9,Math.floor(t*30))-.5)*j,0,Math.max(0,sp),1]}
    case 'type':return [0,0,0,1,a>-.02?1:0];
  }
  return [0,0,0,1,1];
}
function cap(i,x,y,o={}){
  const L=Ln[i],f=(o.f||78)*1.2,col=o.col||'#fff',hi=o.hi||C.red,alpha=o.a??1;if(alpha<=0)return;
  const units=o.units||L.w,sp=o.sp||0,st=o.st||STY[i]||'pop',dir=o.dir||(i%2?1:-1),t=o.t,end=CEND[i]??(L.e+1.4);
  g.save();g.globalAlpha=alpha;g.font=JP(f,o.w||900);g.textBaseline='middle';g.textAlign='center';
  const ws=units.map(u=>g.measureText(u[0]).width+sp),tot=ws.reduce((a,b)=>a+b,0);
  const fit=tot>980?980/tot:1;g.translate(x,y);g.scale(fit,fit);
  let xx=-tot/2;
  units.forEach((u,k)=>{const a=t-u[1];const w=ws[k];
    if(a>-.14){let [dx,dy,rot,sc,al]=glyphT(st,k,a,t,dir);
      const now=t>=u[1]&&t<u[2]+.05,hop=now?Math.sin(clamp((t-u[1])/.22)*Math.PI)*-16:0;
      const ex=clamp((t-end-k*.03)/.42);if(ex>0){const q=eInC(ex);
        if(st==='fly'||st==='wind'){dx+=dir*q*900;rot+=dir*q*.8}else if(st==='drop'||st==='drip'||st==='bounce'){dy+=q*700;rot+=(R(k,23)-.5)*q*2}
        else if(st==='slam'||st==='shout'){sc*=1+q*1.6}else if(st==='scatter'){dx+=(R(k,29)-.5)*q*1400;dy+=(R(k,31)-.5)*q*1000;rot+=q*4*(R(k,37)-.5)}
        else{dy-=q*320;rot+=(R(k,41)-.5)*q*1.6}al*=1-ex}
      if(al>0&&sc>0){
        const drawG=(ox,oy,aa)=>{g.save();g.globalAlpha=alpha*al*aa;g.translate(xx+w/2+ox,oy+hop);g.rotate(rot);g.scale(sc*(now?1.14:1),sc*(now?1.14:1));
          if(o.shadow!==false){g.fillStyle=BGL>.55?'rgba(43,37,96,.18)':'rgba(0,0,0,.4)';g.fillText(u[0],5,7)}
          g.fillStyle=now?hi:(o.cols&&o.cols[k])||col;g.fillText(u[0],0,0);g.restore()};
        // motion trail while the glyph is travelling fast
        if((st==='fly'||st==='scatter'||st==='wind')&&a<.35&&a>-.14){for(let j=3;j>=1;j--){const[tx,ty]=glyphT(st,k,a-j*.035,t,dir);drawG(tx,ty,.12*(4-j)/3)}}
        drawG(dx,dy,1);
        if(st==='type'&&now){g.fillStyle=hi;g.fillRect(xx+w+4,-f*.45,6,f*.9)}
      }}
    xx+=w});
  if(o.ko!==false){const ka=clamp((t-L.s+.05)/.35),kx=clamp((t-end-.1)/.35);if(ka>0&&kx<1){g.globalAlpha=alpha*ka*(1-kx)*(o.koa??.9);g.font=KR(Math.round((o.kf||44)*1.12));g.fillStyle=o.kcol||col;
    g.letterSpacing=`${Math.round(18*(1-eOutC(ka)))}px`;g.fillText(L.ko,0,f*.5+50+(1-eOutC(ka))*30-eInC(kx)*30,1000/fit);g.letterSpacing='0px'}}
  g.restore();
}
// one caption per line: fades in with the line; the exit is handled per glyph by cap()
function capA(t,i,until){const L=Ln[i];const nx=Ln[i+1];const end=until??(nx?Math.min(nx.s-.05,L.e+1.4):L.e+1.4);CEND[i]=Math.min(end,until!=null?until-.45:end);return clamp((t-L.s+.3)/.15)*(t<CEND[i]+.9?1:0)}

const HK=[[0,'夢'],[1,'席'],[2,'笑'],[3,'劣'],[5,'不'],[6,'蜜'],[7,'風'],[8,'循'],[9,'花'],[10,'落'],[11,'芽'],[12,'原'],[13,'握'],[14,'栄'],[15,'劣'],[16,'虚'],[17,'存'],[18,'優'],
  [19,'夢'],[20,'空'],[21,'笑'],[22,'虫'],[27,'道'],[28,'生'],[29,'恥'],[30,'奪'],[31,'拾'],[32,'光'],[33,'喪'],[34,'虚'],[35,'揺'],[36,'優'],[37,'失'],[38,'虚'],[39,'充'],[40,'優'],
  [41,'浄'],[42,'幻'],[43,'劣'],[44,'虚'],[45,'存'],[46,'君'],[47,'夢'],[48,'席'],[49,'笑']];
HERO=HK.map(([i,ch],j)=>({t:cT(i,ch),ch,x:(R(j,71)-.5)*260,y:-120+(R(j,72)-.5)*300,r:(R(j,73)-.5)*.5,dr:(R(j,74)-.5)*1.2,dx:(j%2?1:-1)*600,s:.95+.3*R(j,75),vx:(R(j,76)-.5)*30,vy:-12,o:j%3===1}));
HERO.forEach((h,j)=>{const nx=HERO[j+1];h.d=Math.min(3.4,nx?nx.t-h.t+.1:3.4)});
const SLAMS=[];Ln.forEach((L,i)=>{if(STY[i]==='slam'||STY[i]==='shout')L.w.forEach(u=>SLAMS.push(u[1]))});

/* ---------- ambient journey: the road that runs through every world ---------- */
const SPD=[[0,.6],[15,1.2],[28.7,.7],[61.9,1.6],[78.5,2.2],[99.6,2.6],[112.1,1.8],[126.2,.4],[132.3,1.6],[162.2,.3],[172.9,1],[179,.6],[196,.35],[208,.1]];
const DIST=[0];for(let k=1;k<=21500;k++){const t=k/100;let v=SPD[0][1];for(const [a,s] of SPD)if(t>=a)v=s;DIST.push(DIST[k-1]+v/100)}
const dist=t=>DIST[clamp(Math.round(t*100),0,21500)];
function road(t,col,a=1,hz=HZ){
  if(a<=0)return;g.save();g.globalAlpha=a;const d=dist(t);
  lin(0,hz,W,hz,col,2);
  lin(CX-18,hz,CX-620,H,col,2);lin(CX+18,hz,CX+620,H,col,2);
  for(let k=0;k<9;k++){const p=((k/9+d*.35)%1),z=p*p;const y=hz+(H-hz)*z,y2=hz+(H-hz)*Math.min(1,(p+.045)**2);
    g.strokeStyle=col;g.lineWidth=2+10*z;g.beginPath();g.moveTo(CX,y);g.lineTo(CX,y2);g.stroke()}
  for(let k=0;k<6;k++){const p=((k/6+d*.25)%1),z=p*p;for(const s of[-1,1]){circ(CX+s*(30+700*z),hz-4-160*z,2+6*z,col)}}
  g.restore();
}

/* ---------- icons (each ≤ 5 shapes) ---------- */
function bubble(x,y,r,a=1,tint=C.blue){if(r<=0)return;g.save();g.globalAlpha=a;const gr=g.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(.6,rgba(tint,.18));gr.addColorStop(1,rgba(tint,.45));
  circ(x,y,r,gr,'rgba(255,255,255,.8)',3);g.beginPath();g.arc(x,y,r*.72,-2.4,-1.6);g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=6;g.stroke();g.restore()}
function chair(x,y,s,col,a=1){g.save();g.globalAlpha=a;g.fillStyle=col;g.fillRect(x-40*s,y-110*s,14*s,110*s);rr(x-40*s,y-20*s,80*s,20*s,6*s);g.fill();g.fillRect(x-36*s,y,10*s,70*s);g.fillRect(x+26*s,y,10*s,70*s);rr(x-40*s,y-120*s,20*s,70*s,6*s);g.fill();g.restore()}
function chairOutline(x,y,s,col){g.save();g.setLineDash([10,10]);g.strokeStyle=col;g.lineWidth=3;rr(x-40*s,y-120*s,80*s,190*s,10*s);g.stroke();g.restore()}
function podium(x,y,s,col,col2,a=1){g.save();g.globalAlpha=a;g.fillStyle=col;g.fillRect(x-210*s,y-150*s,140*s,150*s);g.fillStyle=col2;g.fillRect(x-70*s,y-230*s,140*s,230*s);g.fillStyle=col;g.fillRect(x+70*s,y-90*s,140*s,90*s);g.restore()}
function crown(x,y,s,col){poly([x-60*s,y,x-60*s,y-60*s,x-30*s,y-25*s,x,y-75*s,x+30*s,y-25*s,x+60*s,y-60*s,x+60*s,y],col,null)}
function can(x,y,s,rot,col){g.save();g.translate(x,y);g.rotate(rot);rr(-40*s,-60*s,80*s,120*s,14*s);g.fillStyle=col;g.fill();g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=3;g.stroke();g.fillStyle='rgba(255,255,255,.5)';g.fillRect(-40*s,-20*s,80*s,40*s);g.restore()}
function hand(x,y,s,pose,col,rot=0){ // pose 0 open, 1 fist, 2 pinch
  g.save();g.translate(x,y);g.rotate(rot);g.fillStyle=col;rr(-70*s,-40*s,140*s,130*s,50*s);g.fill();
  if(pose===0){for(let k=0;k<4;k++){rr((-62+k*34)*s,-150*s,26*s,120*s,13*s);g.fill()}rr(55*s,-10*s,70*s,26*s,13*s);g.fill()}
  else if(pose===1){for(let k=0;k<4;k++){rr((-62+k*34)*s,-70*s,28*s,50*s,13*s);g.fill()}}

function worldAt(t){let k=0;WORLDS.forEach((x,j)=>{if(t>=x.a)k=j});return k}
function drawWorld(ctx,k,t){g=ctx;g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.filter='none';WI=k;CUR_T=t;
  const w=WORLDS[k];
  const tilt=t>27.9&&t<28.7?eIO(P(t,27.9,.8)):0;
  if(tilt>0){g.save();g.translate(0,-H*tilt);WI=worldAt(20);WORLDS[WI].fn(t);g.restore();g.save();g.translate(0,H*(1-tilt));WI=worldAt(29);CUR_T=Math.max(t,28.7);WORLDS[WI].fn(Math.max(t,28.7));g.restore()}
  else w.fn(t);
  if(t>35.0&&t<35.45)liquid(P(t,35.0,.45),C.navy);
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g=g0}
function camera(t){
  const ch=(t>61.9&&t<96.5)||(t>132.3&&t<162.2)||(t>172.9&&t<195)?1:.45;
  let sh=0;for(const s of SLAMS){const a=t-s;if(a>0&&a<.3)sh=Math.max(sh,(1-a/.3)*10)}
  const sc=1.035+.02*pulse(t)*ch+.01*Math.sin(t*.4),rot=Math.sin(t*.21)*.008+(sh?(R(1,Math.floor(t*30))-.5)*.006:0);
  return {sc,rot,x:(R(2,Math.floor(t*30))-.5)*sh,y:(R(3,Math.floor(t*30))-.5)*sh}}
function blit(src,cam,extra){g0.save();g0.translate(CX+cam.x,H/2+cam.y);g0.rotate(cam.rot);g0.scale(cam.sc,cam.sc);g0.translate(-CX,-H/2);if(extra)extra();g0.drawImage(src,0,0);g0.restore()}
function render(t){
  g0.setTransform(1,0,0,1,0,0);g0.globalAlpha=1;g0.filter='none';g0.fillStyle='#000';g0.fillRect(0,0,W,H);
  const cam=camera(t);
  const tr=TRN.find(x=>t>=x[0]-TD/2&&t<x[0]+TD/2);
  if(!tr){drawWorld(ga,worldAt(t),t);blit(BA,cam)}
  else{
    const [b,ty,fx=CX,fy=OY]=tr,p=clamp((t-(b-TD/2))/TD),q=eIO(p),kO=worldAt(b-.01),kN=worldAt(b+.01);
    drawWorld(ga,kO,Math.min(t,b-.001));drawWorld(gb,kN,Math.max(t,b));
    if(ty==='band'){ // diagonal colour bands sweep across and reveal the next world (reference style)
      blit(BA,cam);const pos=-1400+2800*q;
      blit(BB,cam,()=>{g0.save();g0.translate(CX,H/2);g0.rotate(-.42);g0.beginPath();g0.rect(-1600,-1600,pos+1600,3200);g0.restore();g0.clip()});
      g0.save();g0.translate(CX,H/2);g0.rotate(-.42);[[C.coral,0],[C.gold,110],[C.navy2,190]].forEach(([c,o])=>{g0.fillStyle=c;g0.fillRect(pos-o-80*(1-Math.abs(q-.5)*2)-40,-1600,80*(1-Math.abs(q-.5)*2)+40,3200)});g0.restore()}
    else if(ty==='iris'){blit(BA,cam);const r=2300*eInC(p)+(p>0?4:0);
      blit(BB,cam,()=>{g0.beginPath();g0.arc(fx,fy,r,0,7);g0.clip()});
      g0.beginPath();g0.arc(fx,fy,r,0,7);g0.strokeStyle=C.gold;g0.lineWidth=14;g0.stroke();g0.beginPath();g0.arc(fx,fy,r+30,0,7);g0.strokeStyle=C.coral;g0.lineWidth=6;g0.stroke()}
    else if(ty==='zoom'||ty==='zoomin'){ // Prezi-like: fly into the old world, the new one grows out of the focus point
      const z=1+7*eInC(clamp(p*1.6));g0.globalAlpha=1;g0.filter=`blur(${Math.round(10*clamp(p*1.6))}px)`;
      blit(BA,cam,()=>{g0.translate(fx,fy);g0.scale(z,z);g0.translate(-fx,-fy)});
      g0.filter='none';const n=clamp((p-.3)/.7),zn=.25+.75*eOutC(n);g0.globalAlpha=clamp(n*2.5);g0.shadowColor='rgba(0,0,0,.45)';g0.shadowBlur=60;
      blit(BB,cam,()=>{g0.translate(fx,fy);g0.scale(zn,zn);g0.rotate((1-eOutC(n))*-.25);g0.translate(-fx,-fy)});g0.shadowBlur=0;g0.globalAlpha=1}
    else if(ty==='slide'){ // whip pan
      g0.filter=`blur(${Math.round(12*Math.sin(p*Math.PI))}px)`;
      blit(BA,cam,()=>g0.translate(-W*1.08*q,0));blit(BB,cam,()=>g0.translate(W*1.08*(1-q),0));g0.filter='none';
      g0.fillStyle=C.gold;g0.fillRect(W*(1-1.08*q)-W*.08*.5-10,0,24,H)}
  }
  g=g0;grain(t,.03);
  const fd=clamp((t-(D.dur-1.2))/1.1);if(fd>0)flash(fd,'#000000');
}
window.DUR=D.dur;
window.READY=(async()=>{try{await Promise.all([document.fonts.load(JP(100),D.lines.map(l=>l.w.map(u=>u[0]).join('')).join('')+'劣等感栄光原動力弱虫僕道'+POOL.join('')),document.fonts.load(KR(44),D.lines.map(l=>l.ko).join('')+'열등감겁쟁이·')])}catch(e){}
  window.renderAt=render;render(0)})();
if(new URLSearchParams(location.search).has('render'))document.body.classList.add('render');
else{const au=document.getElementById('au'),pp=document.getElementById('pp');const loop=()=>{render(au.currentTime);document.getElementById('fill').style.width=(au.currentTime/D.dur*100)+'%';document.getElementById('time').textContent=au.currentTime.toFixed(1);requestAnimationFrame(loop)};
  pp.onclick=()=>au.paused?au.play():au.pause();READY.then(()=>requestAnimationFrame(loop))}
</script>
